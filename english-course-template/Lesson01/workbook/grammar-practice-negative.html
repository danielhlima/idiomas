<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Grammar practice 2 for English Course Lesson 1.">
  <title>Workbook - Lesson 1 - Grammar Practice 2</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html {
      min-height: 100%;
      text-size-adjust: 100%;
    }
    
    body {
      min-height: 100%;
      margin: 0;
    }
    
    body, h1, h2, h3, h4, p, figure, blockquote, dl, dd {
      margin: 0;
    }
    
    ul[role="list"],
    ol[role="list"] {
      list-style: none;
    }
    
    img, picture, video, canvas, svg {
      display: block;
      max-width: 100%;
    }
    
    input, button, textarea, select {
      font: inherit;
    }
    
    button, select {
      color: inherit;
    }
    
    button {
      cursor: pointer;
    }
    
    button:disabled {
      cursor: not-allowed;
    }
    
    table {
      border-collapse: collapse;
      width: 100%;
    }
    
    [hidden] {
      display: none !important;
    }
    :root {
      --color-page: #f5f7fa;
      --color-surface: #ffffff;
      --color-surface-soft: #f0f4f7;
      --color-ink: #161616;
      --color-muted: #5b6470;
      --color-line: #d7dde4;
      --color-accent: #007c78;
      --color-accent-strong: #005f5c;
      --color-accent-soft: #d8f1ee;
      --color-warm: #c8562f;
      --color-warm-soft: #ffe3d6;
      --color-focus: #f7b801;
      --shadow-soft: 0 18px 60px rgba(20, 28, 38, 0.12);
      --shadow-panel: 0 8px 28px rgba(20, 28, 38, 0.1);
      --radius-sm: 6px;
      --radius-md: 8px;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 3rem;
      --space-8: 4rem;
      --font-body: Arial, Helvetica, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
      --app-header-height: 5.75rem;
      --slide-max-width: 1180px;
      --transition-fast: 160ms ease;
      --transition-medium: 260ms ease;
    }
    body {
      background: var(--color-page);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.5;
    }
    
    h1,
    h2,
    h3 {
      color: var(--color-ink);
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0;
    }
    
    h1 {
      font-size: 4.75rem;
    }
    
    h2 {
      font-size: 4rem;
    }
    
    h3 {
      font-size: 2.25rem;
    }
    
    p {
      max-width: 70ch;
    }
    
    th {
      font-weight: 700;
      text-align: left;
    }
    
    .app-eyebrow,
    .slide-kicker {
      color: var(--color-accent-strong);
      font-size: 0.875rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-transform: uppercase;
    }
    
    .app-title {
      color: var(--color-ink);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.2;
    }
    
    .slide-count {
      color: var(--color-muted);
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
    }
    
    .course-app {
      --slide-body-size: 1.125rem;
      --slide-font-scale: 1;
      --slide-h1-size: 4.75rem;
      --slide-h2-size: 4rem;
      --slide-h3-size: 2.25rem;
      --slide-kicker-size: 0.875rem;
      --slide-meta-size: 1.25rem;
      --slide-count-size: 1rem;
    }
    
    .course-app[data-font-size="small"] {
      --slide-font-scale: 0.9;
    }
    
    .course-app[data-font-size="large"] {
      --slide-font-scale: 1.16;
    }
    
    .course-app .slide {
      font-size: calc(var(--slide-body-size) * var(--slide-font-scale));
    }
    
    .course-app .slide h1 {
      font-size: calc(var(--slide-h1-size) * var(--slide-font-scale));
    }
    
    .course-app .slide h2 {
      font-size: calc(var(--slide-h2-size) * var(--slide-font-scale));
    }
    
    .course-app .slide h3 {
      font-size: calc(var(--slide-h3-size) * var(--slide-font-scale));
    }
    
    .course-app .slide .slide-kicker {
      font-size: calc(var(--slide-kicker-size) * var(--slide-font-scale));
    }
    
    .course-app .slide .app-title {
      font-size: calc(var(--slide-meta-size) * var(--slide-font-scale));
    }
    
    .course-app .slide .slide-count {
      font-size: calc(var(--slide-count-size) * var(--slide-font-scale));
    }
    .skip-link {
      background: var(--color-focus);
      color: var(--color-ink);
      font-weight: 800;
      left: var(--space-4);
      padding: var(--space-3) var(--space-4);
      position: fixed;
      top: var(--space-4);
      transform: translateY(-150%);
      transition: transform var(--transition-fast);
      z-index: 30;
    }
    
    .skip-link:focus {
      transform: translateY(0);
    }
    
    .sr-only {
      clip: rect(0, 0, 0, 0);
      border: 0;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
    
    .course-app {
      display: block;
      min-height: 100vh;
    }
    
    .lesson-deck {
      min-height: 100vh;
      padding: 0;
    }
    
    .slide:focus-visible {
      outline: 4px solid var(--color-focus);
      outline-offset: 3px;
    }
    .slide {
      background:
        linear-gradient(90deg, var(--color-accent-soft), transparent 34%),
        var(--color-surface);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      margin: 0;
      max-width: none;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      width: 100%;
    }
    
    .slide-header {
      border-bottom: 1px solid var(--color-line);
      display: grid;
      gap: var(--space-2);
      padding: var(--space-6) var(--space-7) var(--space-5);
    }
    
    .slide-content {
      align-items: stretch;
      display: grid;
      gap: var(--space-5);
      padding: var(--space-6) var(--space-7);
    }
    
    .slide-content-centered {
      align-items: center;
    }
    
    .slide-footer {
      align-items: center;
      border-top: 1px solid var(--color-line);
      display: flex;
      gap: var(--space-4);
      justify-content: space-between;
      padding: var(--space-4) var(--space-7);
    }
    
    .slide-progress {
      background: var(--color-surface-soft);
      border-radius: 999px;
      height: 0.85rem;
      overflow: hidden;
      width: min(100%, 38rem);
    }
    
    .slide-progress span {
      background: linear-gradient(90deg, var(--color-accent), var(--color-warm));
      border-radius: inherit;
      display: block;
      height: 100%;
      transition: width var(--transition-medium);
      width: 0;
    }
    
    .content-panel,
    .dialogue-box,
    .review-box,
    .homework-box,
    .hero-placeholder {
      align-content: start;
      display: grid;
      gap: var(--space-5);
    }
    
    .content-panel {
      grid-template-columns: 1fr;
    }
    
    .two-column {
      align-items: stretch;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
    .placeholder-line,
    .placeholder-card,
    .info-box,
    .grammar-box,
    .exercise-box,
    .activity-box,
    .media-placeholder,
    .audio-player-placeholder {
      border: 2px dashed var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      font-weight: 800;
    }
    
    .placeholder-line {
      align-items: center;
      background: var(--color-surface);
      display: flex;
      min-height: 4rem;
      padding: var(--space-4) var(--space-5);
    }
    
    .placeholder-line-large {
      color: var(--color-ink);
      font-family: var(--font-display);
      font-size: 3rem;
      line-height: 1.1;
      min-height: 6rem;
    }
    
    .placeholder-stack {
      display: grid;
      gap: var(--space-4);
    }
    
    .placeholder-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    
    .placeholder-grid-compact {
      grid-template-columns: repeat(3, minmax(9rem, 1fr));
    }
    
    .placeholder-card,
    .info-box,
    .grammar-box,
    .exercise-box,
    .activity-box,
    .media-placeholder {
      align-items: center;
      background: rgba(255, 255, 255, 0.76);
      display: flex;
      min-height: 7rem;
      padding: var(--space-5);
    }
    
    .placeholder-card-tall {
      min-height: 22rem;
    }
    
    .placeholder-card-wide {
      min-height: 10rem;
    }
    
    .info-box {
      background: var(--color-accent-soft);
      border-color: var(--color-accent);
      color: var(--color-accent-strong);
    }
    
    .cover-slide {
      background:
        linear-gradient(90deg, var(--color-accent-soft), transparent 42%),
        var(--color-surface);
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .cover-header {
      border-bottom: 0;
      padding-bottom: var(--space-4);
    }
    
    .cover-title-stack {
      display: grid;
      gap: var(--space-3);
      max-width: 56rem;
    }
    
    .cover-title-stack h1 {
      max-width: 11ch;
    }
    
    .cover-lesson,
    .cover-subtitle {
      margin: 0;
    }
    
    .cover-lesson {
      color: var(--color-accent-strong);
      font-size: calc(1.35rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
    }
    
    .cover-subtitle {
      color: var(--color-ink);
      font-size: calc(2.6rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.1;
    }
    
    .cover-slide-content {
      align-items: center;
      padding-top: 0;
    }
    
    .cover-hero-art {
      justify-self: center;
      margin: 0;
      min-height: 0;
      width: min(100%, 72rem, max(34rem, calc((100vh - 24rem) * 16 / 9)));
    }
    
    .cover-hero-image {
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: block;
      height: auto;
      object-fit: contain;
      width: 100%;
    }
    
    .learn-slide .slide-content {
      align-items: start;
    }
    
    .learn-panel {
      align-content: stretch;
    }
    
    .learn-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    
    .learn-card {
      align-content: start;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: grid;
      gap: var(--space-3);
      min-height: 13.5rem;
      padding: var(--space-5);
    }
    
    .learn-icon {
      font-size: calc(2.4rem * var(--slide-font-scale));
      line-height: 1;
    }
    
    .course-app .slide .learn-card h3 {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: calc(1.45rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }
    
    .learn-card p {
      color: var(--color-muted);
      font-size: calc(1.12rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.3;
      margin: 0;
    }
    
    .warmup-slide .slide-content {
      align-items: start;
    }
    
    .warmup-panel {
      gap: var(--space-4);
    }
    
    .warmup-illustration {
      justify-self: center;
      margin: 0;
      width: min(100%, 78rem, max(36rem, calc((100vh - 20rem) * 16 / 9)));
    }
    
    .warmup-illustration img {
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: block;
      height: auto;
      object-fit: contain;
      width: 100%;
    }
    
    .warmup-questions {
      display: grid;
      gap: var(--space-3);
      grid-template-columns: repeat(5, minmax(0, 1fr));
      list-style-position: outside;
      margin: 0;
      padding-left: 1.25rem;
    }
    
    .warmup-questions li {
      color: var(--color-ink);
      font-size: calc(1.04rem * var(--slide-font-scale));
      font-weight: 850;
      line-height: 1.25;
      padding-right: var(--space-2);
    }
    
    .teacher-note {
      color: var(--color-muted);
      font-size: calc(0.95rem * var(--slide-font-scale));
      font-weight: 700;
      justify-self: center;
      margin: 0;
      text-align: center;
    }
    
    .greetings-slide .slide-content {
      align-items: start;
    }
    
    .greetings-slide {
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .greetings-panel {
      gap: var(--space-5);
    }
    
    .greetings-panel-visual {
      align-items: center;
      gap: var(--space-5);
      grid-template-columns: minmax(0, 1.18fr) minmax(19rem, 0.82fr);
    }
    
    .greetings-illustration-placeholder {
      align-items: center;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      display: grid;
      justify-self: center;
      margin: 0;
      max-height: 18rem;
      max-width: 46rem;
      place-items: center;
      text-align: center;
      width: min(100%, 46rem);
    }
    
    .greetings-illustration-placeholder figcaption {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-5);
    }
    
    .greetings-illustration-placeholder strong {
      color: var(--color-accent-strong);
      font-size: calc(1.35rem * var(--slide-font-scale));
      line-height: 1.15;
    }
    
    .greetings-illustration-placeholder span {
      font-size: calc(1rem * var(--slide-font-scale));
      font-weight: 700;
      line-height: 1.3;
    }
    
    .greetings-illustration {
      aspect-ratio: auto;
      background: transparent;
      border: 0;
      box-shadow: var(--shadow-panel);
      height: clamp(10rem, 30vh, 18rem);
      max-height: none;
      overflow: visible;
    }
    
    .greetings-illustration img {
      border-radius: var(--radius-sm);
      display: block;
      height: 100%;
      object-fit: contain;
      object-position: center;
      width: 100%;
    }
    
    .greetings-panel-visual .greetings-illustration {
      align-self: center;
      height: auto;
      max-width: none;
      width: 100%;
    }
    
    .greetings-panel-visual .greetings-illustration img {
      height: auto;
    }
    
    .greetings-card-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    
    .greetings-panel-visual .greetings-card-grid {
      gap: var(--space-3);
      grid-template-columns: 1fr;
    }
    
    .greetings-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: grid;
      gap: var(--space-4);
      padding: var(--space-5);
    }
    
    .greetings-panel-visual .greetings-card {
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .course-app .slide .greetings-card h3 {
      color: var(--color-accent-strong);
      font-family: var(--font-body);
      font-size: calc(1.55rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }
    
    .greetings-card ul {
      display: grid;
      gap: var(--space-3);
      list-style-position: outside;
      margin: 0;
      padding-left: 1.25rem;
    }
    
    .greetings-panel-visual .greetings-card ul {
      gap: var(--space-2);
    }
    
    .greetings-card li {
      color: var(--color-ink);
      font-size: calc(1.22rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.25;
    }
    
    .greetings-panel-visual .greetings-card li {
      font-size: calc(1rem * var(--slide-font-scale));
      line-height: 1.18;
    }
    
    .greetings-practice-slide {
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .greetings-practice-slide .slide-content {
      align-items: start;
    }
    
    .practice-subtitle {
      color: var(--color-muted);
      font-size: calc(1.35rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.25;
      margin: 0;
    }
    
    .greetings-practice-panel {
      gap: var(--space-5);
    }
    
    .greetings-practice-panel-visual {
      align-items: center;
      gap: var(--space-5);
      grid-template-columns: minmax(0, 1.1fr) minmax(21rem, 0.9fr);
    }
    
    .practice-illustration-placeholder {
      align-items: center;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      display: grid;
      justify-self: center;
      margin: 0;
      max-height: 11rem;
      max-width: 30rem;
      place-items: center;
      text-align: center;
      width: min(100%, 30rem);
    }
    
    .practice-illustration-placeholder figcaption {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .practice-illustration-placeholder strong {
      color: var(--color-accent-strong);
      font-size: calc(1.18rem * var(--slide-font-scale));
      line-height: 1.15;
    }
    
    .practice-illustration-placeholder span {
      font-size: calc(0.92rem * var(--slide-font-scale));
      font-weight: 700;
      line-height: 1.25;
    }
    
    .practice-illustration {
      aspect-ratio: auto;
      background: transparent;
      border: 0;
      box-shadow: var(--shadow-panel);
      height: clamp(8rem, 25vh, 14rem);
      max-height: none;
      max-width: 44rem;
      overflow: visible;
      width: min(100%, 44rem);
    }
    
    .practice-illustration img {
      border-radius: var(--radius-sm);
      display: block;
      height: 100%;
      object-fit: contain;
      object-position: center;
      width: 100%;
    }
    
    .greetings-practice-panel-visual .practice-illustration {
      align-self: center;
      height: auto;
      max-width: none;
      width: 100%;
    }
    
    .greetings-practice-panel-visual .practice-illustration img {
      height: auto;
    }
    
    .matching-columns,
    .choice-grid,
    .conversation-grid {
      display: grid;
      gap: var(--space-4);
    }
    
    .matching-columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    
    .greetings-practice-panel-visual .matching-columns {
      gap: var(--space-3);
      grid-template-columns: 1fr;
    }
    
    .greetings-practice-panel-choice .choice-grid {
      gap: var(--space-3);
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    
    .greetings-practice-panel-conversations .conversation-grid {
      gap: var(--space-3);
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    
    .choice-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    
    .conversation-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    
    .practice-card,
    .choice-card,
    .conversation-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: grid;
      gap: var(--space-3);
      padding: var(--space-5);
    }
    
    .greetings-practice-panel-visual .practice-card {
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .greetings-practice-panel-choice .choice-card {
      gap: var(--space-2);
      padding: var(--space-3);
    }
    
    .greetings-practice-panel-conversations .conversation-card {
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .course-app .slide .practice-card h3,
    .course-app .slide .choice-card h3,
    .course-app .slide .conversation-card h3 {
      color: var(--color-accent-strong);
      font-family: var(--font-body);
      font-size: calc(1.35rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }
    
    .practice-card ul,
    .choice-card ul {
      display: grid;
      gap: var(--space-3);
      list-style-position: outside;
      margin: 0;
      padding-left: 1.25rem;
    }
    
    .greetings-practice-panel-visual .practice-card ul {
      gap: var(--space-2);
    }
    
    .greetings-practice-panel-choice .choice-card ul {
      gap: var(--space-1);
    }
    
    .choice-card ul {
      list-style: none;
      padding-left: 0;
    }
    
    .practice-card li,
    .choice-card li,
    .conversation-card p {

<body>
  <div class="workbook-font-controls" aria-label="Font size">
    <button type="button" data-font-action="decrease" aria-label="Decrease font size">-A</button>
    <button type="button" data-font-action="reset" aria-label="Reset font size">A</button>
    <button type="button" data-font-action="increase" aria-label="Increase font size">A+</button>
  </div>

  <main class="workbook-page" data-grammar-workbook>
    <header class="workbook-top">
      <div class="workbook-course">English Course - Workbook</div>
      <div>Lesson 1 - Grammar Practice 2</div>
    </header>

    <section class="workbook-hero" aria-labelledby="exercise-heading">
      <p class="slide-kicker">Grammar Practice</p>
      <h1 id="exercise-heading">The Verb to Be — Negative</h1>
      <p>Practice negative sentences with am not, isn't and aren't.</p>
    </section>

    <section id="exercise-shell" class="workbook-shell" aria-label="Interactive grammar practice">
      <div class="workbook-status" aria-label="Practice status">
        <div>
          <small>Exercise</small>
          <strong id="question-count">1 / 25</strong>
        </div>
        <div>
          <small>Score</small>
          <strong id="score-count">0</strong>
        </div>
        <div>
          <small>Best score</small>
          <strong id="best-score">-</strong>
        </div>
      </div>
      <div class="workbook-progress-track" aria-hidden="true">
        <div id="progress-bar" class="workbook-progress-bar"></div>
      </div>

      <div id="exercise-panel" class="workbook-exercise">
        <p id="question-section" class="workbook-question-section"></p>
        <h2 id="question-title" class="workbook-question-title" tabindex="-1"></h2>
        <p id="question-prompt" class="workbook-question-prompt"></p>
        <div id="options" class="workbook-options" role="group" aria-label="Answer options"></div>
        <form id="blank-form" class="workbook-blank-form" hidden>
          <label id="blank-label" for="blank-answer"></label>
          <input id="blank-answer" type="text" autocomplete="off">
          <button id="blank-check" class="workbook-primary" type="submit">Check</button>
        </form>
        <form id="multi-form" class="workbook-multi-form" hidden>
          <div id="multi-items" class="workbook-multi-items"></div>
          <button id="multi-check" class="workbook-primary" type="submit">Check Answers</button>
        </form>
        <form id="writing-form" class="workbook-writing-form" hidden>
          <label id="writing-label" for="writing-answer"></label>
          <textarea id="writing-answer" rows="7"></textarea>
          <div class="workbook-writing-actions">
            <button id="sample-button" class="workbook-secondary" type="button">Show Sample Answer</button>
            <button id="writing-complete" class="workbook-primary" type="submit">Complete</button>
          </div>
          <p id="sample-answer" class="workbook-sample-answer" hidden></p>
        </form>
        <div id="feedback" class="workbook-feedback" aria-live="polite"></div>
        <div class="workbook-actions">
          <button id="retry-button" class="workbook-secondary" type="button" hidden>Try again</button>
          <button id="next-button" class="workbook-primary" type="button" disabled>Next</button>
        </div>
      </div>

      <div id="result-panel" class="workbook-result" tabindex="-1" aria-labelledby="result-title">
        <h2 id="result-title">Result</h2>

      }
    
      function isAcceptedAnswer(source, value) {
        var rawValue = String(value || "").trim();
    
        if (source.requireQuestionMark && rawValue.charAt(rawValue.length - 1) !== "?") {
          return false;
        }
    
        return getAcceptedAnswers(source).indexOf(normalize(value)) !== -1;
      }
    
      function getBestScore() {
        var rawScore = readStorage(BEST_SCORE_KEY);
    
        if (rawScore === null) {
          return null;
        }
    
        var stored = Number(rawScore);
        return Number.isFinite(stored) ? stored : null;
      }
    
      function updateBestScoreLabel() {
        var best = getBestScore();
        bestScore.textContent = best === null ? "-" : best + "/" + gradedTotal;
      }
    
      function updateProgress() {
        questionCount.textContent = (currentIndex + 1) + " / " + QUESTIONS.length;
        scoreCount.textContent = String(score);
        progressBar.style.width = (((currentIndex + 1) / QUESTIONS.length) * 100) + "%";
        updateBestScoreLabel();
      }
    
      function clearFeedback() {
        feedback.className = "workbook-feedback";
        feedback.innerHTML = "";
      }
    
      function writeFeedback(kind, heading, message) {
        var strong = document.createElement("strong");
        var paragraph = document.createElement("p");
    
        feedback.className = "workbook-feedback " + kind;
        feedback.innerHTML = "";
        strong.textContent = heading;
        paragraph.textContent = message;
        feedback.appendChild(strong);
        feedback.appendChild(paragraph);
      }
    
      function hideInputAreas() {
        optionsContainer.hidden = true;
        optionsContainer.innerHTML = "";
        blankForm.hidden = true;
    
        if (writingForm) {
          writingForm.hidden = true;
        }
        if (sampleButton) {
          sampleButton.hidden = true;
        }
        if (sampleAnswer) {
          sampleAnswer.hidden = true;
        }
        if (multiForm) {
          multiForm.hidden = true;
        }
        if (multiItems) {
          multiItems.innerHTML = "";
        }
        if (retryButton) {
          retryButton.hidden = true;
        }
      }
    
      function renderChoiceQuestion(question) {
        hideInputAreas();
        optionsContainer.hidden = false;
    
        question.options.forEach(function renderOption(option) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "workbook-answer";
          button.textContent = option;
          button.dataset.optionValue = option;
          button.setAttribute("aria-label", "Select " + option);
          button.addEventListener("click", function onAnswerClick() {
            selectAnswer(option);
          });
          optionsContainer.appendChild(button);
        });
      }
    
      function renderTextQuestion(question) {
        hideInputAreas();
        blankForm.hidden = false;
        blankLabel.textContent = question.label || "Answer";
        blankAnswer.value = "";
        blankAnswer.placeholder = question.placeholder || "";
        blankAnswer.disabled = false;
      }
    
      function renderWritingQuestion(question) {
        hideInputAreas();
    
        if (!writingForm) {
          return;
        }
    
        writingForm.hidden = false;
        writingLabel.textContent = question.label || "Write your answer.";
        writingAnswer.value = "";
        writingAnswer.disabled = false;
    
        if (sampleButton) {
          sampleButton.hidden = false;
        }
      }
    
      function renderMultiChoiceItem(item, fieldset, name) {
        var options = document.createElement("div");
    
        options.className = "workbook-multi-options";
    
        item.options.forEach(function addOption(option) {
          var label = document.createElement("label");
          var input = document.createElement("input");
          var text = document.createElement("span");
    
          input.type = "radio";
          input.name = name;
          input.value = option;
          text.textContent = option;
          label.appendChild(input);
          label.appendChild(text);
          options.appendChild(label);
        });
    
        fieldset.appendChild(options);
      }
    
      function renderMultiTextItem(item, fieldset, inputId) {
        var label = document.createElement("label");
        var input = document.createElement("input");
    
        label.setAttribute("for", inputId);
        label.textContent = item.label || "Answer";
        input.id = inputId;
        input.type = "text";
        input.autocomplete = "off";
        input.placeholder = item.placeholder || "";
        input.dataset.textAnswer = "true";
        fieldset.appendChild(label);
        fieldset.appendChild(input);
      }
    
      function renderMultiQuestion(question) {
        hideInputAreas();
    
        if (!multiForm || !multiItems) {
          return;
        }
    
        multiForm.hidden = false;
    
        question.items.forEach(function renderItem(item, index) {
          var fieldset = document.createElement("fieldset");
          var legend = document.createElement("legend");
          var itemFeedback = document.createElement("p");
          var itemNumber = String(index + 1);
          var inputName = "exercise-" + currentIndex + "-item-" + index;
          var inputId = inputName + "-answer";
    
          fieldset.className = "workbook-multi-item";
          fieldset.dataset.itemIndex = String(index);
          legend.textContent = itemNumber + ". " + (item.prompt || item.label || "Complete the item.");
          itemFeedback.className = "workbook-item-feedback";
          itemFeedback.setAttribute("aria-live", "polite");
          fieldset.appendChild(legend);
    
          if (Array.isArray(item.options)) {
            renderMultiChoiceItem(item, fieldset, inputName);
          } else {
            renderMultiTextItem(item, fieldset, inputId);
          }
    
          fieldset.appendChild(itemFeedback);
          multiItems.appendChild(fieldset);
        });
    
        if (multiCheck) {
          multiCheck.disabled = false;
        }
      }
    
      function renderActiveInput(question) {
        if (Array.isArray(question.items)) {
          renderMultiQuestion(question);
          return;
        }
    
        if (question.type === "writing") {
          renderWritingQuestion(question);
          return;
        }
    
        if (question.type === "blank" || question.type === "correction" || question.type === "order" || question.type === "build") {
          renderTextQuestion(question);
          return;
        }
    
        renderChoiceQuestion(question);
      }
    
      function renderQuestion() {
        var question = QUESTIONS[currentIndex];
    
        answered = false;
        selectedAnswer = "";
        attemptCount = 0;
    
        exercisePanel.classList.remove("is-hidden");
        resultPanel.classList.remove("active");
        questionSection.textContent = question.section;
        questionTitle.textContent = question.title;
        questionPrompt.textContent = question.prompt;
        clearFeedback();
        nextButton.disabled = true;
        nextButton.textContent = currentIndex === QUESTIONS.length - 1 ? "See result" : "Next";
        renderActiveInput(question);
        updateProgress();
      }
    
      function markChoiceButtons(question, isCorrect) {
        Array.prototype.slice.call(optionsContainer.querySelectorAll(".workbook-answer")).forEach(function updateButton(button) {
          var value = button.dataset.optionValue;
          var mark = document.createElement("span");
    
          mark.className = "mark";
          button.disabled = true;
          button.innerHTML = "";
          button.appendChild(mark);
          button.appendChild(document.createTextNode(value));
    
          if (isAcceptedAnswer(question, value)) {
            button.classList.add("correct");
            mark.textContent = "OK";
            button.setAttribute("aria-label", value + ", correct answer");
          }
    
          if (value === selectedAnswer && !isCorrect) {
            button.classList.add("incorrect");
            mark.textContent = "X";
            button.setAttribute("aria-label", value + ", incorrect answer");
          }
        });
      }
    
      function setAnsweredState(isCorrect, question) {
        var firstAttempt = attemptCount === 0;
        var answerLabel = getAnswerLabel(question);
        var message = isCorrect ? "Answer: " + answerLabel + "." : "Correct answer: " + answerLabel + ".";
    
        answered = true;
        attemptCount += 1;
    
        if (isCorrect && firstAttempt && isGradable(question)) {
          score += 1;
        }
    
        if (isCorrect && !firstAttempt) {
          message += " Retry answers do not change the score.";
        }
    
        writeFeedback(isCorrect ? "correct" : "incorrect", isCorrect ? "Correct." : "Incorrect.", message);
        scoreCount.textContent = String(score);
        nextButton.disabled = false;
    
        if (retryButton) {
          retryButton.hidden = isCorrect;
        }
      }
    
      function selectAnswer(option) {
        var question = QUESTIONS[currentIndex];
        var isCorrect = isAcceptedAnswer(question, option);
    
        if (answered) {
          return;
        }
    
        selectedAnswer = option;
        markChoiceButtons(question, isCorrect);
        setAnsweredState(isCorrect, question);
      }
    
      function checkTextAnswer() {
        var question = QUESTIONS[currentIndex];
        var isCorrect = isAcceptedAnswer(question, blankAnswer.value);
    
        if (answered) {
          return;
        }
    
        if (!blankAnswer.value.trim()) {
          writeFeedback("incorrect", "Try again.", "Complete the answer before checking.");
          return;
        }
    
        blankAnswer.disabled = true;
        setAnsweredState(isCorrect, question);
      }
    
      function getMultiItemAnswer(fieldset, item) {
        var checked = fieldset.querySelector("input[type='radio']:checked");
        var textInput = fieldset.querySelector("[data-text-answer]");
    
        if (Array.isArray(item.options)) {
          return checked ? checked.value : "";
        }
    
        return textInput ? textInput.value : "";
      }
    
      function disableMultiItem(fieldset) {
        Array.prototype.slice.call(fieldset.querySelectorAll("input")).forEach(function disableInput(input) {
          input.disabled = true;
        });
      }
    
      function markMultiItem(fieldset, item, isCorrect) {
        var itemFeedback = fieldset.querySelector(".workbook-item-feedback");
    
        fieldset.classList.toggle("is-correct", isCorrect);
        fieldset.classList.toggle("is-incorrect", !isCorrect);
    
        if (itemFeedback) {
          itemFeedback.textContent = (isCorrect ? "OK. " : "X. ") + "Correct answer: " + getAnswerLabel(item) + ".";
        }
    
        disableMultiItem(fieldset);
      }
    
      function checkMultiAnswers() {
        var question = QUESTIONS[currentIndex];
        var fieldsets = Array.prototype.slice.call(multiItems.querySelectorAll(".workbook-multi-item"));
        var answers = fieldsets.map(function getAnswer(fieldset, index) {
          return getMultiItemAnswer(fieldset, question.items[index]);
        });
        var hasBlank = answers.some(function isBlank(answer) {
          return !String(answer).trim();
        });
        var correctCount = 0;
        var firstAttempt = attemptCount === 0;
    
        if (answered) {
          return;
        }
    
        if (hasBlank) {
          writeFeedback("incorrect", "Try again.", "Complete all items before checking.");
          return;
        }
    
        answers.forEach(function checkAnswer(answer, index) {
          var item = question.items[index];
          var fieldset = fieldsets[index];
          var isCorrect = isAcceptedAnswer(item, answer);
    
          if (isCorrect && isItemGradable(item)) {
            correctCount += 1;
          }
    
          markMultiItem(fieldset, item, isCorrect);
        });
    
        answered = true;
        attemptCount += 1;
    
        if (firstAttempt) {
          score += correctCount;
        }
    
        scoreCount.textContent = String(score);
        nextButton.disabled = false;
    
        if (multiCheck) {
          multiCheck.disabled = true;
        }
    
        if (retryButton) {
          retryButton.hidden = correctCount === question.items.length;
        }
    
        writeFeedback(
          correctCount === question.items.length ? "correct" : "incorrect",
          correctCount === question.items.length ? "Correct." : "Try again.",
          correctCount + " / " + question.items.length + " correct. Correct answers are shown in each item."
        );
      }
    
      function completeWriting() {
        var question = QUESTIONS[currentIndex];
    
        if (!writingAnswer.value.trim()) {
          writeFeedback("incorrect", "Try again.", "Write your answer before continuing.");
          return;
        }
    
        answered = true;
        writingAnswer.disabled = true;
        writeFeedback("correct", "Complete.", question.completionMessage || "This exercise is not automatically graded.");
        nextButton.disabled = false;
    
        if (retryButton) {
          retryButton.hidden = true;
        }
    
        if (question.sampleAnswer && sampleAnswer && sampleAnswer.hidden) {
          sampleButton.hidden = false;
        }
      }
    
      function retryQuestion() {
        var question = QUESTIONS[currentIndex];
    
        answered = false;
        selectedAnswer = "";
        clearFeedback();
        nextButton.disabled = true;
        renderActiveInput(question);
      }
    
      function resultMessage(percent) {
        var customMessages = config.resultMessages;
    
        if (Array.isArray(customMessages)) {
          var match = customMessages.find(function findMessage(option) {
            return percent >= option.min;
          });
    
          if (match) {
            return match.message;
          }
        }
    
        if (percent >= 90) {
          return "Excellent work.";
        }
        if (percent >= 70) {
          return "Very good. Review a few items and try again.";
        }
        if (percent >= 50) {
          return "Good start. Review the lesson and repeat the practice.";
        }
        return "Review the lesson and repeat the practice.";
      }
    
      function showResult() {
        var previousBest = getBestScore();
        var percent = gradedTotal > 0 ? Math.round((score / gradedTotal) * 100) : 0;
        var newBest = previousBest === null ? score : Math.max(previousBest, score);
        var resultStatus = document.getElementById("result-status");
    
        writeStorage(BEST_SCORE_KEY, newBest);
        updateBestScoreLabel();
        progressBar.style.width = "100%";
    
        document.getElementById("result-summary").textContent = config.resultSummary || "You completed the practice.";
        document.getElementById("result-correct").textContent = String(score);
        document.getElementById("result-total").textContent = String(gradedTotal);
        document.getElementById("result-percent").textContent = percent + "%";
        document.getElementById("result-message").textContent = resultMessage(percent);
        document.getElementById("previous-best").textContent = previousBest === null ? "" : "Best score: " + previousBest + "/" + gradedTotal;
    
        if (resultStatus) {
          resultStatus.textContent = "Complete";
        }
    
        exercisePanel.classList.add("is-hidden");
        resultPanel.classList.add("active");
        resultPanel.focus();
      }
    
      function nextQuestion() {
        if (!answered) {
          return;
        }
    
        if (currentIndex === QUESTIONS.length - 1) {
          showResult();
          return;
        }
    
        currentIndex += 1;
        renderQuestion();
        questionTitle.focus();
      }
    
      function restartPractice() {
        if (config.confirmReset && !window.confirm(config.resetConfirmMessage || "Reset all exercises and start again?")) {
          return;
        }
    
        currentIndex = 0;
        score = 0;
        answered = false;
        selectedAnswer = "";
        attemptCount = 0;
        renderQuestion();
        questionTitle.focus();
      }
    
      function normalizeScale(value) {
        if (value === null || value === undefined || value === "") {
          return FONT_DEFAULT;
        }
    
        var number = Number(value);
        var scaled = Number.isFinite(number) ? number : FONT_DEFAULT;
        return Math.round(Math.min(FONT_MAX, Math.max(FONT_MIN, scaled)) * 100) / 100;
      }
    
      function updateFontButtons(scale) {
        Array.prototype.slice.call(document.querySelectorAll("[data-font-action]")).forEach(function updateButton(button) {
          var active = button.dataset.fontAction === "reset" && scale === FONT_DEFAULT;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }
    
      function applyFontScale(value) {
        var scale = normalizeScale(value);
        document.documentElement.style.setProperty("--workbook-font-scale", String(scale));
        writeStorage(FONT_STORAGE_KEY, scale);
        updateFontButtons(scale);
        return scale;
      }
    
      function changeFontScale(delta) {
        var current = Number(getComputedStyle(document.documentElement).getPropertyValue("--workbook-font-scale")) || FONT_DEFAULT;
        applyFontScale(current + delta);
      }
    
      nextButton.addEventListener("click", nextQuestion);
      restartButton.addEventListener("click", restartPractice);
    
      if (retryButton) {
        retryButton.addEventListener("click", retryQuestion);
      }
    
      blankForm.addEventListener("submit", function onBlankSubmit(event) {
        event.preventDefault();
        checkTextAnswer();
      });
    
      if (multiForm) {
        multiForm.addEventListener("submit", function onMultiSubmit(event) {
          event.preventDefault();
          checkMultiAnswers();
        });
      }
    
      if (writingForm) {
        writingForm.addEventListener("submit", function onWritingSubmit(event) {
          event.preventDefault();
          completeWriting();
        });
      }
    
      if (sampleButton && sampleAnswer) {
        sampleButton.addEventListener("click", function onSampleClick() {
          var question = QUESTIONS[currentIndex];
    
          sampleAnswer.textContent = question.sampleAnswer || "";
          sampleAnswer.hidden = false;
        });
      }
    
      document.querySelector(".workbook-font-controls").addEventListener("click", function onFontClick(event) {
        var button = event.target.closest("[data-font-action]");
    
        if (!button) {
          return;
        }
    
        if (button.dataset.fontAction === "decrease") {
          changeFontScale(-FONT_STEP);
        }
        if (button.dataset.fontAction === "increase") {
          changeFontScale(FONT_STEP);
        }
        if (button.dataset.fontAction === "reset") {
          applyFontScale(FONT_DEFAULT);
        }
      });
    
      document.addEventListener("keydown", function onKeyDown(event) {
        if (!(event.ctrlKey || event.metaKey)) {
          return;
        }
    
        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          changeFontScale(FONT_STEP);
        }
        if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          changeFontScale(-FONT_STEP);
        }
        if (event.key === "0") {
          event.preventDefault();
          applyFontScale(FONT_DEFAULT);
        }
      });
    
      applyFontScale(readStorage(FONT_STORAGE_KEY));
      renderQuestion();
    })(window, document);
  </script>
</body>
</html>
