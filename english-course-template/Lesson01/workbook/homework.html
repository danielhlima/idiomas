<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Final homework review for English Course Lesson 1.">
  <title>Lesson 1 - Homework</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html {
      min-height: 100%;
      text-size-adjust: 100%;
    }
    
    body {
      min-height: 100%;
      margin: 0;
    }
    
    body, h1, h2, h3, h4, p, figure, blockquote, dl, dd {
      margin: 0;
    }
    
    ul[role="list"],
    ol[role="list"] {
      list-style: none;
    }
    
    img, picture, video, canvas, svg {
      display: block;
      max-width: 100%;
    }
    
    input, button, textarea, select {
      font: inherit;
    }
    
    button, select {
      color: inherit;
    }
    
    button {
      cursor: pointer;
    }
    
    button:disabled {
      cursor: not-allowed;
    }
    
    table {
      border-collapse: collapse;
      width: 100%;
    }
    
    [hidden] {
      display: none !important;
    }
    :root {
      --color-page: #f5f7fa;
      --color-surface: #ffffff;
      --color-surface-soft: #f0f4f7;
      --color-ink: #161616;
      --color-muted: #5b6470;
      --color-line: #d7dde4;
      --color-accent: #007c78;
      --color-accent-strong: #005f5c;
      --color-accent-soft: #d8f1ee;
      --color-warm: #c8562f;
      --color-warm-soft: #ffe3d6;
      --color-focus: #f7b801;
      --shadow-soft: 0 18px 60px rgba(20, 28, 38, 0.12);
      --shadow-panel: 0 8px 28px rgba(20, 28, 38, 0.1);
      --radius-sm: 6px;
      --radius-md: 8px;
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 3rem;
      --space-8: 4rem;
      --font-body: Arial, Helvetica, sans-serif;
      --font-display: Georgia, "Times New Roman", serif;
      --app-header-height: 5.75rem;
      --slide-max-width: 1180px;
      --transition-fast: 160ms ease;
      --transition-medium: 260ms ease;
    }
    body {
      background: var(--color-page);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: 1.125rem;
      line-height: 1.5;
    }
    
    h1,
    h2,
    h3 {
      color: var(--color-ink);
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0;
    }
    
    h1 {
      font-size: 4.75rem;
    }
    
    h2 {
      font-size: 4rem;
    }
    
    h3 {
      font-size: 2.25rem;
    }
    
    p {
      max-width: 70ch;
    }
    
    th {
      font-weight: 700;
      text-align: left;
    }
    
    .app-eyebrow,
    .slide-kicker {
      color: var(--color-accent-strong);
      font-size: 0.875rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.2;
      text-transform: uppercase;
    }
    
    .app-title {
      color: var(--color-ink);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.2;
    }
    
    .slide-count {
      color: var(--color-muted);
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
    }
    
    .course-app {
      --slide-body-size: 1.125rem;
      --slide-font-scale: 1;
      --slide-h1-size: 4.75rem;
      --slide-h2-size: 4rem;
      --slide-h3-size: 2.25rem;
      --slide-kicker-size: 0.875rem;
      --slide-meta-size: 1.25rem;
      --slide-count-size: 1rem;
    }
    
    .course-app[data-font-size="small"] {
      --slide-font-scale: 0.9;
    }
    
    .course-app[data-font-size="large"] {
      --slide-font-scale: 1.16;
    }
    
    .course-app .slide {
      font-size: calc(var(--slide-body-size) * var(--slide-font-scale));
    }
    
    .course-app .slide h1 {
      font-size: calc(var(--slide-h1-size) * var(--slide-font-scale));
    }
    
    .course-app .slide h2 {
      font-size: calc(var(--slide-h2-size) * var(--slide-font-scale));
    }
    
    .course-app .slide h3 {
      font-size: calc(var(--slide-h3-size) * var(--slide-font-scale));
    }
    
    .course-app .slide .slide-kicker {
      font-size: calc(var(--slide-kicker-size) * var(--slide-font-scale));
    }
    
    .course-app .slide .app-title {
      font-size: calc(var(--slide-meta-size) * var(--slide-font-scale));
    }
    
    .course-app .slide .slide-count {
      font-size: calc(var(--slide-count-size) * var(--slide-font-scale));
    }
    .skip-link {
      background: var(--color-focus);
      color: var(--color-ink);
      font-weight: 800;
      left: var(--space-4);
      padding: var(--space-3) var(--space-4);
      position: fixed;
      top: var(--space-4);
      transform: translateY(-150%);
      transition: transform var(--transition-fast);
      z-index: 30;
    }
    
    .skip-link:focus {
      transform: translateY(0);
    }
    
    .sr-only {
      clip: rect(0, 0, 0, 0);
      border: 0;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
    
    .course-app {
      display: block;
      min-height: 100vh;
    }
    
    .lesson-deck {
      min-height: 100vh;
      padding: 0;
    }
    
    .slide:focus-visible {
      outline: 4px solid var(--color-focus);
      outline-offset: 3px;
    }
    .slide {
      background:
        linear-gradient(90deg, var(--color-accent-soft), transparent 34%),
        var(--color-surface);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      margin: 0;
      max-width: none;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      width: 100%;
    }
    
    .slide-header {
      border-bottom: 1px solid var(--color-line);
      display: grid;
      gap: var(--space-2);
      padding: var(--space-6) var(--space-7) var(--space-5);
    }
    
    .slide-content {
      align-items: stretch;
      display: grid;
      gap: var(--space-5);
      padding: var(--space-6) var(--space-7);
    }
    
    .slide-content-centered {
      align-items: center;
    }
    
    .slide-footer {
      align-items: center;
      border-top: 1px solid var(--color-line);
      display: flex;
      gap: var(--space-4);
      justify-content: space-between;
      padding: var(--space-4) var(--space-7);
    }
    
    .slide-progress {
      background: var(--color-surface-soft);
      border-radius: 999px;
      height: 0.85rem;
      overflow: hidden;
      width: min(100%, 38rem);
    }
    
    .slide-progress span {
      background: linear-gradient(90deg, var(--color-accent), var(--color-warm));
      border-radius: inherit;
      display: block;
      height: 100%;
      transition: width var(--transition-medium);
      width: 0;
    }
    
    .content-panel,
    .dialogue-box,
    .review-box,
    .homework-box,
    .hero-placeholder {
      align-content: start;
      display: grid;
      gap: var(--space-5);
    }
    
    .content-panel {
      grid-template-columns: 1fr;
    }
    
    .two-column {
      align-items: stretch;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
    .placeholder-line,
    .placeholder-card,
    .info-box,
    .grammar-box,
    .exercise-box,
    .activity-box,
    .media-placeholder,
    .audio-player-placeholder {
      border: 2px dashed var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      font-weight: 800;
    }
    
    .placeholder-line {
      align-items: center;
      background: var(--color-surface);
      display: flex;
      min-height: 4rem;
      padding: var(--space-4) var(--space-5);
    }
    
    .placeholder-line-large {
      color: var(--color-ink);
      font-family: var(--font-display);
      font-size: 3rem;
      line-height: 1.1;
      min-height: 6rem;
    }
    
    .placeholder-stack {
      display: grid;
      gap: var(--space-4);
    }
    
    .placeholder-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    
    .placeholder-grid-compact {
      grid-template-columns: repeat(3, minmax(9rem, 1fr));
    }
    
    .placeholder-card,
    .info-box,
    .grammar-box,
    .exercise-box,
    .activity-box,
    .media-placeholder {
      align-items: center;
      background: rgba(255, 255, 255, 0.76);
      display: flex;
      min-height: 7rem;
      padding: var(--space-5);
    }
    
    .placeholder-card-tall {
      min-height: 22rem;
    }
    
    .placeholder-card-wide {
      min-height: 10rem;
    }
    
    .info-box {
      background: var(--color-accent-soft);
      border-color: var(--color-accent);
      color: var(--color-accent-strong);
    }
    
    .cover-slide {
      background:
        linear-gradient(90deg, var(--color-accent-soft), transparent 42%),
        var(--color-surface);
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .cover-header {
      border-bottom: 0;
      padding-bottom: var(--space-4);
    }
    
    .cover-title-stack {
      display: grid;
      gap: var(--space-3);
      max-width: 56rem;
    }
    
    .cover-title-stack h1 {
      max-width: 11ch;
    }
    
    .cover-lesson,
    .cover-subtitle {
      margin: 0;
    }
    
    .cover-lesson {
      color: var(--color-accent-strong);
      font-size: calc(1.35rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
    }
    
    .cover-subtitle {
      color: var(--color-ink);
      font-size: calc(2.6rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.1;
    }
    
    .cover-slide-content {
      align-items: center;
      padding-top: 0;
    }
    
    .cover-hero-art {
      justify-self: center;
      margin: 0;
      min-height: 0;
      width: min(100%, 72rem, max(34rem, calc((100vh - 24rem) * 16 / 9)));
    }
    
    .cover-hero-image {
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: block;
      height: auto;
      object-fit: contain;
      width: 100%;
    }
    
    .learn-slide .slide-content {
      align-items: start;
    }
    
    .learn-panel {
      align-content: stretch;
    }
    
    .learn-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    
    .learn-card {
      align-content: start;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: grid;
      gap: var(--space-3);
      min-height: 13.5rem;
      padding: var(--space-5);
    }
    
    .learn-icon {
      font-size: calc(2.4rem * var(--slide-font-scale));
      line-height: 1;
    }
    
    .course-app .slide .learn-card h3 {
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: calc(1.45rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }
    
    .learn-card p {
      color: var(--color-muted);
      font-size: calc(1.12rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.3;
      margin: 0;
    }
    
    .warmup-slide .slide-content {
      align-items: start;
    }
    
    .warmup-panel {
      gap: var(--space-4);
    }
    
    .warmup-illustration {
      justify-self: center;
      margin: 0;
      width: min(100%, 78rem, max(36rem, calc((100vh - 20rem) * 16 / 9)));
    }
    
    .warmup-illustration img {
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: block;
      height: auto;
      object-fit: contain;
      width: 100%;
    }
    
    .warmup-questions {
      display: grid;
      gap: var(--space-3);
      grid-template-columns: repeat(5, minmax(0, 1fr));
      list-style-position: outside;
      margin: 0;
      padding-left: 1.25rem;
    }
    
    .warmup-questions li {
      color: var(--color-ink);
      font-size: calc(1.04rem * var(--slide-font-scale));
      font-weight: 850;
      line-height: 1.25;
      padding-right: var(--space-2);
    }
    
    .teacher-note {
      color: var(--color-muted);
      font-size: calc(0.95rem * var(--slide-font-scale));
      font-weight: 700;
      justify-self: center;
      margin: 0;
      text-align: center;
    }
    
    .greetings-slide .slide-content {
      align-items: start;
    }
    
    .greetings-slide {
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .greetings-panel {
      gap: var(--space-5);
    }
    
    .greetings-panel-visual {
      align-items: center;
      gap: var(--space-5);
      grid-template-columns: minmax(0, 1.18fr) minmax(19rem, 0.82fr);
    }
    
    .greetings-illustration-placeholder {
      align-items: center;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      display: grid;
      justify-self: center;
      margin: 0;
      max-height: 18rem;
      max-width: 46rem;
      place-items: center;
      text-align: center;
      width: min(100%, 46rem);
    }
    
    .greetings-illustration-placeholder figcaption {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-5);
    }
    
    .greetings-illustration-placeholder strong {
      color: var(--color-accent-strong);
      font-size: calc(1.35rem * var(--slide-font-scale));
      line-height: 1.15;
    }
    
    .greetings-illustration-placeholder span {
      font-size: calc(1rem * var(--slide-font-scale));
      font-weight: 700;
      line-height: 1.3;
    }
    
    .greetings-illustration {
      aspect-ratio: auto;
      background: transparent;
      border: 0;
      box-shadow: var(--shadow-panel);
      height: clamp(10rem, 30vh, 18rem);
      max-height: none;
      overflow: visible;
    }
    
    .greetings-illustration img {
      border-radius: var(--radius-sm);
      display: block;
      height: 100%;
      object-fit: contain;
      object-position: center;
      width: 100%;
    }
    
    .greetings-panel-visual .greetings-illustration {
      align-self: center;
      height: auto;
      max-width: none;
      width: 100%;
    }
    
    .greetings-panel-visual .greetings-illustration img {
      height: auto;
    }
    
    .greetings-card-grid {
      display: grid;
      gap: var(--space-4);
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    
    .greetings-panel-visual .greetings-card-grid {
      gap: var(--space-3);
      grid-template-columns: 1fr;
    }
    
    .greetings-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: grid;
      gap: var(--space-4);
      padding: var(--space-5);
    }
    
    .greetings-panel-visual .greetings-card {
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .course-app .slide .greetings-card h3 {
      color: var(--color-accent-strong);
      font-family: var(--font-body);
      font-size: calc(1.55rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }
    
    .greetings-card ul {
      display: grid;
      gap: var(--space-3);
      list-style-position: outside;
      margin: 0;
      padding-left: 1.25rem;
    }
    
    .greetings-panel-visual .greetings-card ul {
      gap: var(--space-2);
    }
    
    .greetings-card li {
      color: var(--color-ink);
      font-size: calc(1.22rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.25;
    }
    
    .greetings-panel-visual .greetings-card li {
      font-size: calc(1rem * var(--slide-font-scale));
      line-height: 1.18;
    }
    
    .greetings-practice-slide {
      overflow-x: hidden;
      overflow-y: auto;
    }
    
    .greetings-practice-slide .slide-content {
      align-items: start;
    }
    
    .practice-subtitle {
      color: var(--color-muted);
      font-size: calc(1.35rem * var(--slide-font-scale));
      font-weight: 800;
      line-height: 1.25;
      margin: 0;
    }
    
    .greetings-practice-panel {
      gap: var(--space-5);
    }
    
    .greetings-practice-panel-visual {
      align-items: center;
      gap: var(--space-5);
      grid-template-columns: minmax(0, 1.1fr) minmax(21rem, 0.9fr);
    }
    
    .practice-illustration-placeholder {
      align-items: center;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      display: grid;
      justify-self: center;
      margin: 0;
      max-height: 11rem;
      max-width: 30rem;
      place-items: center;
      text-align: center;
      width: min(100%, 30rem);
    }
    
    .practice-illustration-placeholder figcaption {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .practice-illustration-placeholder strong {
      color: var(--color-accent-strong);
      font-size: calc(1.18rem * var(--slide-font-scale));
      line-height: 1.15;
    }
    
    .practice-illustration-placeholder span {
      font-size: calc(0.92rem * var(--slide-font-scale));
      font-weight: 700;
      line-height: 1.25;
    }
    
    .practice-illustration {
      aspect-ratio: auto;
      background: transparent;
      border: 0;
      box-shadow: var(--shadow-panel);
      height: clamp(8rem, 25vh, 14rem);
      max-height: none;
      max-width: 44rem;
      overflow: visible;
      width: min(100%, 44rem);
    }
    
    .practice-illustration img {
      border-radius: var(--radius-sm);
      display: block;
      height: 100%;
      object-fit: contain;
      object-position: center;
      width: 100%;
    }
    
    .greetings-practice-panel-visual .practice-illustration {
      align-self: center;
      height: auto;
      max-width: none;
      width: 100%;
    }
    
    .greetings-practice-panel-visual .practice-illustration img {
      height: auto;
    }
    
    .matching-columns,
    .choice-grid,
    .conversation-grid {
      display: grid;
      gap: var(--space-4);
    }
    
    .matching-columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    
    .greetings-practice-panel-visual .matching-columns {
      gap: var(--space-3);
      grid-template-columns: 1fr;
    }
    
    .greetings-practice-panel-choice .choice-grid {
      gap: var(--space-3);
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    
    .greetings-practice-panel-conversations .conversation-grid {
      gap: var(--space-3);
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    
    .choice-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    
    .conversation-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    
    .practice-card,
    .choice-card,
    .conversation-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-panel);
      display: grid;
      gap: var(--space-3);
      padding: var(--space-5);
    }
    
    .greetings-practice-panel-visual .practice-card {
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .greetings-practice-panel-choice .choice-card {
      gap: var(--space-2);
      padding: var(--space-3);
    }
    
    .greetings-practice-panel-conversations .conversation-card {
      gap: var(--space-2);
      padding: var(--space-4);
    }
    
    .course-app .slide .practice-card h3,
    .course-app .slide .choice-card h3,
    .course-app .slide .conversation-card h3 {
      color: var(--color-accent-strong);
      font-family: var(--font-body);
      font-size: calc(1.35rem * var(--slide-font-scale));
      font-weight: 900;
      line-height: 1.15;
      margin: 0;
    }
    
    .practice-card ul,
    .choice-card ul {
      display: grid;
      gap: var(--space-3);
      list-style-position: outside;
      margin: 0;
      padding-left: 1.25rem;
    }
    
    .greetings-practice-panel-visual .practice-card ul {
      gap: var(--space-2);
    }
    
    .greetings-practice-panel-choice .choice-card ul {
      gap: var(--space-1);
    }
    
    .choice-card ul {
      list-style: none;
      padding-left: 0;
    }
    
    .practice-card li,
    .choice-card li,
    .conversation-card p {
      color: var(--color-ink);

      function normalize(value) {
        var text = String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[’`]/g, "'")
          .toLowerCase();
    
        [
          ["i'm", "i am"],
          ["you're", "you are"],
          ["he's", "he is"],
          ["she's", "she is"],
          ["it's", "it is"],
          ["we're", "we are"],
          ["they're", "they are"],
          ["isn't", "is not"],
          ["aren't", "are not"],
          ["what's", "what is"],
          ["where's", "where is"],
          ["that's", "that is"]
        ].forEach(function expand(pair) {
          text = text.replace(new RegExp("\\b" + pair[0].replace("'", "\\'") + "\\b", "g"), pair[1]);
        });
    
        return text
          .replace(/[.!?]/g, "")
          .replace(/,/g, "")
          .replace(/\s+/g, " ")
          .trim();
      }

      function readStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      }
    
      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          return;
        }
      }
    
      function loadState() {
        var fallback = createDefaultState();
        var raw = readStorage(STORAGE_KEY);
        var parsed;
    
        if (!raw) {
          return fallback;
        }
    
        try {
          parsed = JSON.parse(raw);
        } catch (error) {
          return fallback;
        }
    
        if (!parsed || !Array.isArray(parsed.answers) || parsed.answers.length !== SECTIONS.length) {
          return fallback;
        }
    
        return {
          answers: SECTIONS.map(function normalizeSectionAnswers(section, sectionIndex) {
            var answers = Array.isArray(parsed.answers[sectionIndex]) ? parsed.answers[sectionIndex].slice(0, section.exercises.length) : [];
    
            while (answers.length < section.exercises.length) {
              answers.push("");
            }
    
            return answers.map(function stringifyAnswer(answer) {
              return String(answer || "");
            });
          }),
          checked: SECTIONS.map(function normalizeChecked(_section, index) {
            return Boolean(parsed.checked && parsed.checked[index]);
          }),
          scores: SECTIONS.map(function normalizeScore(_section, index) {
            var score = parsed.scores && parsed.scores[index];
            return Number.isFinite(Number(score)) ? Number(score) : null;
          }),
          transcriptAvailable: Boolean(parsed.transcriptAvailable),
          transcriptVisible: Boolean(parsed.transcriptVisible)
        };
      }

      }
    
      function getSectionElement(sectionIndex) {
        return sectionsContainer.querySelector("[data-section-index='" + sectionIndex + "']");
      }
    
      function readSectionAnswers(sectionIndex) {
        var sectionElement = getSectionElement(sectionIndex);
        var section = SECTIONS[sectionIndex];
    
        return section.exercises.map(function readAnswer(exercise, exerciseIndex) {
          var fieldset = sectionElement.querySelector("[data-exercise-index='" + exerciseIndex + "']");
          var checked = fieldset.querySelector("input[type='radio']:checked");
          var textInput = fieldset.querySelector("[data-text-input]");
    
          if (exercise.type === "choice") {
            return checked ? checked.value : "";
          }
    
          return textInput ? textInput.value : "";
        });
      }
    
      function updateStoredAnswers(sectionIndex) {
        if (state.checked[sectionIndex]) {
          return;
        }
    
        state.answers[sectionIndex] = readSectionAnswers(sectionIndex);
        saveState();
        updateAllStatus();
      }
    
      function applyAnswerToInputs(sectionIndex, exerciseIndex, answer, disabled) {
        var sectionElement = getSectionElement(sectionIndex);
        var fieldset = sectionElement.querySelector("[data-exercise-index='" + exerciseIndex + "']");
    
        Array.prototype.slice.call(fieldset.querySelectorAll("input")).forEach(function updateInput(input) {
          input.disabled = disabled;
    
          if (input.type === "radio") {
            input.checked = normalize(input.value) === normalize(answer);
          }
    
          if (input.dataset.textInput === "true") {
            input.value = answer || "";
          }
        });
      }
    
      function markExercise(sectionIndex, exerciseIndex, shouldMark) {
        var sectionElement = getSectionElement(sectionIndex);
        var fieldset = sectionElement.querySelector("[data-exercise-index='" + exerciseIndex + "']");
        var feedback = fieldset.querySelector(".listening-question-feedback");
        var exercise = SECTIONS[sectionIndex].exercises[exerciseIndex];
        var answer = state.answers[sectionIndex][exerciseIndex] || "";
        var correct = isCorrect(exercise, answer);
    
        fieldset.classList.remove("is-correct", "is-incorrect");
        Array.prototype.slice.call(fieldset.querySelectorAll("label")).forEach(function clearLabel(label) {
          label.classList.remove("is-correct", "is-incorrect");
        });
    
        if (!shouldMark) {
          feedback.textContent = "";
          return;
        }
    
        fieldset.classList.add(correct ? "is-correct" : "is-incorrect");
        feedback.textContent = (correct ? "Correct! " : (SECTIONS[sectionIndex].isListening ? "Listen again. " : "Almost! ")) + "Correct answer: " + answerLabel(exercise) + ".";
    
        Array.prototype.slice.call(fieldset.querySelectorAll("label")).forEach(function markLabel(label) {
          var input = label.querySelector("input");
    
          if (!input) {
            return;
          }
    
          if (isCorrect(exercise, input.value)) {
            label.classList.add("is-correct");
          }
    
          if (input.checked && !correct) {
            label.classList.add("is-incorrect");
          }
        });
      }
    
      function writeSectionFeedback(sectionIndex, kind, heading, message) {
        var feedback = getSectionElement(sectionIndex).querySelector(".listening-feedback");
        var strong = createElement("strong", null, heading);
        var paragraph = createElement("p", null, message);
    
        feedback.className = "listening-feedback " + kind;
        feedback.innerHTML = "";
        feedback.appendChild(strong);
        feedback.appendChild(paragraph);
      }
    
      function updateSection(sectionIndex) {
        var section = SECTIONS[sectionIndex];
        var sectionElement = getSectionElement(sectionIndex);
        var shouldDisable = state.checked[sectionIndex];
        var shouldMark = state.checked[sectionIndex];
        var score = sectionElement.querySelector("[data-section-score]");
    
        section.exercises.forEach(function updateExercise(_exercise, exerciseIndex) {
          applyAnswerToInputs(sectionIndex, exerciseIndex, state.answers[sectionIndex][exerciseIndex], shouldDisable);
          markExercise(sectionIndex, exerciseIndex, shouldMark);
        });
    
        score.textContent = "Section score: " + (state.scores[sectionIndex] === null ? "- / " + section.exercises.length : state.scores[sectionIndex] + " / " + section.exercises.length);
    
        if (section.isListening) {
          var transcript = sectionElement.querySelector(".listening-transcript");
          var transcriptButton = sectionElement.querySelector("[data-toggle-transcript]");
    
          transcript.hidden = !state.transcriptVisible;
          transcriptButton.disabled = !state.transcriptAvailable;
          transcriptButton.textContent = state.transcriptVisible ? "Hide Transcript" : "Show Transcript";
        }
      }
    
      function checkSection(sectionIndex) {
        var section = SECTIONS[sectionIndex];
        var answers = readSectionAnswers(sectionIndex);
        var missing = answers.some(function isMissing(answer) {
          return !String(answer || "").trim();
        });
        var score = 0;
    
        if (missing) {
          writeSectionFeedback(sectionIndex, "incorrect", "Almost!", "Complete every exercise in this section before checking your answers.");
          return;
        }
    
        answers.forEach(function countAnswer(answer, exerciseIndex) {
          if (isCorrect(section.exercises[exerciseIndex], answer)) {
            score += 1;
          }
        });
    
        state.answers[sectionIndex] = answers;
        state.checked[sectionIndex] = true;
        state.scores[sectionIndex] = score;
    
        if (section.isListening) {
          state.transcriptAvailable = true;
          state.transcriptVisible = false;
        }
    
        saveState();
        updateSection(sectionIndex);
        updateAllStatus();
        writeSectionFeedback(
          sectionIndex,
          score === section.exercises.length ? "correct" : "incorrect",
          score === section.exercises.length ? "Good job!" : "Review this topic.",
          "You scored " + score + " / " + section.exercises.length + ". Correct answers are shown."
        );
        updateFinalResult(true);
      }
    
      function retrySection(sectionIndex) {
        var section = SECTIONS[sectionIndex];
    
        state.answers[sectionIndex] = section.exercises.map(function emptyAnswer() {
          return "";
        });
        state.checked[sectionIndex] = false;
        state.scores[sectionIndex] = null;
    
        if (section.isListening) {
          state.transcriptVisible = false;
        }
    
        saveState();
        updateSection(sectionIndex);
        updateAllStatus();
        writeSectionFeedback(sectionIndex, "", "Try again.", "Answer the exercises in this section again and then check your answers.");
        updateFinalResult(false);
      }
    
      function toggleTranscript() {
        if (!state.transcriptAvailable) {
          return;
        }
    
        state.transcriptVisible = !state.transcriptVisible;
        saveState();
        updateSection(SECTIONS.length - 1);
      }
    
      function getFilledCount() {
        return state.answers.reduce(function sumSection(total, sectionAnswers) {
          return total + sectionAnswers.filter(function hasAnswer(answer) {
            return Boolean(String(answer || "").trim());
          }).length;
        }, 0);
      }
    
      function getCompletedSectionCount() {
        return state.checked.filter(Boolean).length;
      }
    
      function getTotalScore() {
        return state.scores.reduce(function sumScores(total, score) {
          return total + (score || 0);
        }, 0);
      }
    
      function finalMessage(percent) {
        if (percent >= 90) {
          return "Excellent! You are ready for Lesson 2.";
        }
        if (percent >= 75) {
          return "Very good! Review the exercises you missed.";
        }
        if (percent >= 60) {
          return "Good progress. Review Lesson 1 again.";
        }
        return "Please review Lesson 1 before continuing.";
      }
    
      function updateAllStatus() {
        var filled = getFilledCount();
        var completed = getCompletedSectionCount();
        var score = getTotalScore();
        var percent = Math.round((score / EXERCISE_TOTAL) * 100);
    
        filledCount.textContent = filled + " / " + EXERCISE_TOTAL;
        sectionCount.textContent = completed + " / " + SECTIONS.length;
        totalScore.textContent = score + " / " + EXERCISE_TOTAL;
        percentage.textContent = percent + "%";
        progressBar.style.width = ((filled / EXERCISE_TOTAL) * 100) + "%";
      }
    
      function updateFinalResult(shouldFocus) {
        var completed = getCompletedSectionCount();
        var score = getTotalScore();
        var percent = Math.round((score / EXERCISE_TOTAL) * 100);
    
        if (completed < SECTIONS.length) {
          resultPanel.classList.remove("active");
          return;
        }
    
        resultSummary.textContent = "You completed the Lesson 1 Homework.";
        sectionScores.innerHTML = "";
    
        SECTIONS.forEach(function addSectionScore(section, index) {
          var item = document.createElement("div");
          var small = createElement("small", null, section.title);
          var strong = createElement("strong", null, state.scores[index] + " / " + section.exercises.length);
    
          item.appendChild(small);
          item.appendChild(strong);
          sectionScores.appendChild(item);
        });
    
        [
          { label: "Final Score", value: score + " / " + EXERCISE_TOTAL },
          { label: "Percentage", value: percent + "%" }
        ].forEach(function addTotal(itemData) {
          var item = document.createElement("div");
          var small = createElement("small", null, itemData.label);
          var strong = createElement("strong", null, itemData.value);
    
          item.appendChild(small);
          item.appendChild(strong);
          sectionScores.appendChild(item);
        });
    
        resultMessage.textContent = finalMessage(percent);
        resultPanel.classList.add("active");
    
        if (shouldFocus) {
          resultPanel.focus();
        }
      }
    
      function resetHomework() {
        if (!window.confirm("Reset all homework answers, scores and transcript access?")) {
          return;
        }
    
        state = createDefaultState();
        saveState();
        renderAllSections();
      }
    
      function normalizeScale(value) {
        if (value === null || value === undefined || value === "") {
          return FONT_DEFAULT;
        }
    
        var number = Number(value);
        var scaled = Number.isFinite(number) ? number : FONT_DEFAULT;
        return Math.round(Math.min(FONT_MAX, Math.max(FONT_MIN, scaled)) * 100) / 100;
      }
    
      function updateFontButtons(scale) {
        Array.prototype.slice.call(document.querySelectorAll("[data-font-action]")).forEach(function updateButton(button) {
          var active = button.dataset.fontAction === "reset" && scale === FONT_DEFAULT;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }
    
      function applyFontScale(value) {
        var scale = normalizeScale(value);
        document.documentElement.style.setProperty("--workbook-font-scale", String(scale));
        writeStorage(FONT_STORAGE_KEY, scale);
        updateFontButtons(scale);
        return scale;
      }
    
      function changeFontScale(delta) {
        var current = Number(getComputedStyle(document.documentElement).getPropertyValue("--workbook-font-scale")) || FONT_DEFAULT;
        applyFontScale(current + delta);
      }
    
      sectionsContainer.addEventListener("change", function onAnswerChange(event) {
        var section = event.target.closest("[data-section-index]");
    
        if (!section) {
          return;
        }
    
        updateStoredAnswers(Number(section.dataset.sectionIndex));
      });
    
      sectionsContainer.addEventListener("input", function onAnswerInput(event) {
        var section = event.target.closest("[data-section-index]");
    
        if (!section) {
          return;
        }
    
        updateStoredAnswers(Number(section.dataset.sectionIndex));
      });
    
      document.getElementById("reset-homework").addEventListener("click", resetHomework);
      document.getElementById("reset-homework-final").addEventListener("click", resetHomework);
    
      document.querySelector(".workbook-font-controls").addEventListener("click", function onFontClick(event) {
        var button = event.target.closest("[data-font-action]");
    
        if (!button) {
          return;
        }
    
        if (button.dataset.fontAction === "decrease") {
          changeFontScale(-FONT_STEP);
        }
        if (button.dataset.fontAction === "increase") {
          changeFontScale(FONT_STEP);
        }
        if (button.dataset.fontAction === "reset") {
          applyFontScale(FONT_DEFAULT);
        }
      });
    
      document.addEventListener("keydown", function onKeyDown(event) {
        if (!(event.ctrlKey || event.metaKey)) {
          return;
        }
    
        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          changeFontScale(FONT_STEP);
        }
        if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          changeFontScale(-FONT_STEP);
        }
        if (event.key === "0") {
          event.preventDefault();
          applyFontScale(FONT_DEFAULT);
        }
      });
    
      applyFontScale(readStorage(FONT_STORAGE_KEY));
      renderAllSections();
    })(window, document);
  </script>
</body>
</html>
