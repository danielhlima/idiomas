<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Grammar practice for English Course Lesson 2, up to Slide 14.">
  <title>Workbook - Lesson 2 - Grammar Practice 15</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      background: #f5f7fa;
      color: #161616;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      --surface: #ffffff;
      --surface-soft: #f0f4f7;
      --ink: #161616;
      --muted: #5b6470;
      --line: #d7dde4;
      --accent: #007c78;
      --accent-strong: #005f5c;
      --accent-soft: #d8f1ee;
      --warm: #c8562f;
      --warm-soft: #ffe3d6;
      --focus: #f7b801;
      --shadow: 0 16px 45px rgba(20, 28, 38, 0.12);
      --radius: 8px;
      --font-scale: 1;
    }

    body[data-font-size="small"] {
      --font-scale: 0.9;
    }

    body[data-font-size="large"] {
      --font-scale: 1.14;
    }

    .font-controls {
      align-items: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.25rem;
      position: fixed;
      right: 1rem;
      top: 1rem;
      z-index: 20;
    }

    .font-controls button {
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      font-weight: 900;
      min-height: 2.35rem;
      min-width: 2.75rem;
    }

    .font-controls button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .workbook-page {
      display: grid;
      gap: 1.5rem;
      margin: 0 auto;
      max-width: 980px;
      min-height: 100vh;
      padding: 5.5rem 1rem 2rem;
    }

    .workbook-top {
      align-items: center;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      font-size: calc(0.95rem * var(--font-scale));
      font-weight: 800;
      gap: 0.75rem;
      justify-content: space-between;
    }

    .workbook-course {
      color: var(--accent-strong);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .workbook-hero {
      background:
        linear-gradient(135deg, rgba(216, 241, 238, 0.82), transparent 42%),
        var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      gap: 0.8rem;
      padding: clamp(1.4rem, 4vw, 2.5rem);
    }

    .kicker {
      color: var(--accent-strong);
      font-size: calc(0.9rem * var(--font-scale));
      font-weight: 900;
      letter-spacing: 0.08em;
      margin: 0;
      text-transform: uppercase;
    }

    h1,
    h2 {
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.05;
      margin: 0;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4.5rem);
    }

    h2 {
      font-size: calc(2rem * var(--font-scale));
    }

    .workbook-hero p:last-child {
      color: var(--muted);
      font-size: calc(1.15rem * var(--font-scale));
      font-weight: 800;
      margin: 0;
      max-width: 60ch;
    }

    .workbook-shell {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      gap: 1.25rem;
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .status {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .status div {
      background: var(--surface-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem;
    }

    .status small {
      color: var(--muted);
      display: block;
      font-size: calc(0.78rem * var(--font-scale));
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status strong {
      color: var(--ink);
      display: block;
      font-size: calc(1.35rem * var(--font-scale));
      line-height: 1.1;
      margin-top: 0.25rem;
    }

    .progress-track {
      background: var(--surface-soft);
      border-radius: 999px;
      height: 0.85rem;
      overflow: hidden;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--accent), var(--warm));
      height: 100%;
      transition: width 220ms ease;
      width: 0;
    }

    .exercise {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      gap: 1rem;
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .section-label {
      color: var(--accent-strong);
      font-size: calc(0.88rem * var(--font-scale));
      font-weight: 900;
      letter-spacing: 0.08em;
      margin: 0;
      text-transform: uppercase;
    }

    .prompt {
      color: var(--muted);
      font-size: calc(1rem * var(--font-scale));
      font-weight: 800;
      margin: 0;
    }

    .question-text {
      color: var(--ink);
      font-size: calc(1.55rem * var(--font-scale));
      font-weight: 900;
      line-height: 1.25;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .options {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .option-button {
      background: var(--surface-soft);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-weight: 900;
      min-height: 3.25rem;
      padding: 0.75rem 1rem;
    }

    .option-button:hover,
    .option-button:focus-visible {
      border-color: var(--accent);
    }

    .option-button.is-selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent-strong);
    }

    .answer-form {
      align-items: end;
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr auto;
    }

    .answer-form label {
      color: var(--muted);
      display: grid;
      font-size: calc(0.9rem * var(--font-scale));
      font-weight: 900;
      gap: 0.45rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .answer-form input {
      border: 2px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      min-height: 3.2rem;
      padding: 0.7rem 0.85rem;
    }

    .primary,
    .secondary {
      border: 0;
      border-radius: var(--radius);
      font-weight: 900;
      min-height: 3rem;
      padding: 0.7rem 1.1rem;
    }

    .primary {
      background: var(--accent);
      color: #ffffff;
    }

    .secondary {
      background: var(--surface-soft);
      color: var(--accent-strong);
    }

    .feedback {
      border-radius: var(--radius);
      font-weight: 850;
      min-height: 2rem;
      padding: 0.75rem 1rem;
    }

    .feedback.correct {
      background: var(--accent-soft);
      color: var(--accent-strong);
    }

    .feedback.incorrect {
      background: var(--warm-soft);
      color: var(--warm);
    }

    .actions,
    .result-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .result {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: none;
      gap: 1rem;
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .result.is-visible {
      display: grid;
    }

    .score-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .score-grid div {
      background: var(--surface-soft);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .score-grid small {
      color: var(--muted);
      display: block;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .score-grid strong {
      display: block;
      font-size: 1.6rem;
      margin-top: 0.25rem;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 2px;
    }

    @media (max-width: 720px) {
      .workbook-page {
        padding: 5rem 0.75rem 1.25rem;
      }

      .status,
      .score-grid,
      .options,
      .answer-form {
        grid-template-columns: 1fr;
      }

      .actions,
      .result-actions {
        justify-content: stretch;
      }

      .actions button,
      .result-actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body data-font-size="normal">
  <div class="font-controls" role="group" aria-label="Font size">
    <button type="button" data-font-size="small" aria-label="Use small font">-A</button>
    <button type="button" data-font-size="normal" aria-label="Use normal font">A</button>
    <button type="button" data-font-size="large" aria-label="Use large font">A+</button>
  </div>

  <main class="workbook-page" data-workbook>
    <header class="workbook-top">
      <div class="workbook-course">English Course - Workbook</div>
      <div>Lesson 2 - Grammar Practice 15</div>
    </header>

    <section class="workbook-hero" aria-labelledby="workbook-title">
      <p class="kicker">Grammar Practice</p>
      <h1 id="workbook-title">Lesson 2 Review</h1>
      <p>Complete 20 exercises about instructions, Let's, colours, adjectives, and prepositions of place.</p>
    </section>

    <section class="workbook-shell" aria-label="Interactive grammar practice">
      <div class="status" aria-label="Practice status">
        <div>
          <small>Question</small>
          <strong id="question-count">1 / 20</strong>
        </div>
        <div>
          <small>Score</small>
          <strong id="score-count">0</strong>
        </div>
        <div>
          <small>Best score</small>
          <strong id="best-score">-</strong>
        </div>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div id="exercise-panel" class="exercise">
        <p id="section-label" class="section-label"></p>
        <h2 id="question-title" tabindex="-1"></h2>
        <p id="question-prompt" class="prompt"></p>
        <p id="question-text" class="question-text"></p>
        <div id="options" class="options" role="group" aria-label="Answer options"></div>
        <form id="answer-form" class="answer-form" hidden>
          <label for="answer-input">
            Type the answer
            <input id="answer-input" type="text" autocomplete="off">
          </label>
          <button class="primary" type="submit">Check</button>
        </form>
        <div id="feedback" class="feedback" aria-live="polite" hidden></div>
        <div class="actions">
          <button id="try-again-button" class="secondary" type="button" hidden>Try again</button>
          <button id="next-button" class="primary" type="button" disabled>Next</button>
        </div>
      </div>

      <div id="result-panel" class="result" tabindex="-1" aria-labelledby="result-title">
        <h2 id="result-title">Result</h2>
        <p id="result-summary"></p>
        <div class="score-grid" aria-label="Score summary">
          <div><small>Correct</small><strong id="result-correct"></strong></div>
          <div><small>Total</small><strong id="result-total"></strong></div>
          <div><small>Percent</small><strong id="result-percent"></strong></div>
        </div>
        <p id="result-message"></p>
        <div class="result-actions">
          <button id="restart-button" class="primary" type="button">Repeat practice</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function grammarPractice(window, document) {
      "use strict";

      var STORAGE_KEY = "englishLesson2GrammarPractice15BestScore";
      var FONT_KEY = "englishLesson2GrammarPractice15FontSize";
      var questions = [
        {
          section: "Imperatives",
          title: "Exercise 1",
          prompt: "Choose the correct imperative.",
          text: "______ the door.",
          type: "choice",
          options: ["Close", "Listen", "Put"],
          answer: ["Close"]
        },
        {
          section: "Imperatives",
          title: "Exercise 2",
          prompt: "Choose the correct imperative.",
          text: "______ the question.",
          type: "choice",
          options: ["Answer", "Close", "Put"],
          answer: ["Answer"]
        },
        {
          section: "Imperatives",
          title: "Exercise 3",
          prompt: "Choose the correct verb to complete the instruction.",
          text: "______ the file.",
          type: "choice",
          options: ["Open", "Put", "Ask"],
          answer: ["open"]
        },
        {
          section: "Imperatives",
          title: "Exercise 4",
          prompt: "Choose the correct verb to complete the instruction.",
          text: "______ answers.",
          type: "choice",
          options: ["Check", "Close", "Show"],
          answer: ["check"]
        },
        {
          section: "Imperatives",
          title: "Exercise 5",
          prompt: "Put the words in the correct order.",
          text: "door / the / close",
          type: "input",
          answer: ["close the door"]
        },
        {
          section: "Let's",
          title: "Exercise 6",
          prompt: "Complete the suggestion.",
          text: "______ start.",
          type: "input",
          answer: ["Let's", "Let us"]
        },
        {
          section: "Let's",
          title: "Exercise 7",
          prompt: "Choose the correct suggestion.",
          text: "______ begin.",
          type: "choice",
          options: ["Let's", "Close", "Open"],
          answer: ["Let's"]
        },
        {
          section: "Let's",
          title: "Exercise 8",
          prompt: "Choose the correct suggestion.",
          text: "answers",
          type: "choice",
          options: ["Let's check the answers.", "Let's close the answers.", "Let's put the answers."],
          answer: ["Let's check the answers."]
        },
        {
          section: "Let's",
          title: "Exercise 9",
          prompt: "Put the words in the correct order.",
          text: "repeat / let's",
          type: "input",
          answer: ["let's repeat", "let us repeat"]
        },
        {
          section: "Let's",
          title: "Exercise 10",
          prompt: "Put the words in the correct order.",
          text: "screen / at / look / let's / the",
          type: "input",
          answer: ["let's look at the screen", "let us look at the screen"]
        },
        {
          section: "Colours and Adjectives",
          title: "Exercise 11",
          prompt: "Choose the correct phrase.",
          text: "black + laptop",
          type: "choice",
          options: ["black laptop", "laptop black", "black computer"],
          answer: ["black laptop"]
        },
        {
          section: "Colours and Adjectives",
          title: "Exercise 12",
          prompt: "Choose the correct phrase.",
          text: "blue + notebook",
          type: "choice",
          options: ["blue notebook", "notebook blue", "blue phone"],
          answer: ["blue notebook"]
        },
        {
          section: "Colours and Adjectives",
          title: "Exercise 13",
          prompt: "Choose the phrase from Slide 12.",
          text: "big + screen",
          type: "choice",
          options: ["big screen", "screen big", "big office"],
          answer: ["big screen"]
        },
        {
          section: "Colours and Adjectives",
          title: "Exercise 14",
          prompt: "Choose the phrase from Slide 12.",
          text: "old + chair",
          type: "choice",
          options: ["old chair", "chair old", "old notebook"],
          answer: ["old chair"]
        },
        {
          section: "Colours and Adjectives",
          title: "Exercise 15",
          prompt: "Choose the phrase from Slide 12.",
          text: "clean + office",
          type: "choice",
          options: ["clean office", "office clean", "clean phone"],
          answer: ["clean office"]
        },
        {
          section: "Prepositions of Place",
          title: "Exercise 16",
          prompt: "Choose the correct preposition.",
          text: "phone ______ desk",
          type: "choice",
          options: ["on", "in", "under"],
          answer: ["on"]
        },
        {
          section: "Prepositions of Place",
          title: "Exercise 17",
          prompt: "Choose the correct preposition from Slide 14.",
          text: "notebook ______ bag",
          type: "choice",
          options: ["in", "on", "behind"],
          answer: ["in"]
        },
        {
          section: "Prepositions of Place",
          title: "Exercise 18",
          prompt: "Choose the correct preposition.",
          text: "keys ______ chair",
          type: "choice",
          options: ["under", "behind", "between"],
          answer: ["under"]
        },
        {
          section: "Prepositions of Place",
          title: "Exercise 19",
          prompt: "Choose the correct preposition from Slide 14.",
          text: "phone / coffee mug / notebook",
          type: "choice",
          options: ["between", "next to", "behind"],
          answer: ["between"]
        },
        {
          section: "Prepositions of Place",
          title: "Exercise 20",
          prompt: "Complete the example from Slide 14 with the correct preposition.",
          text: "photo ______ monitor",
          type: "input",
          answer: ["in front of"]
        }
      ];

      var state = {
        index: 0,
        score: 0,
        answered: false,
        missedCurrent: false,
        selectedAnswer: ""
      };

      var elements = {
        body: document.body,
        questionCount: document.getElementById("question-count"),
        scoreCount: document.getElementById("score-count"),
        bestScore: document.getElementById("best-score"),
        progressBar: document.getElementById("progress-bar"),
        exercisePanel: document.getElementById("exercise-panel"),
        resultPanel: document.getElementById("result-panel"),
        sectionLabel: document.getElementById("section-label"),
        title: document.getElementById("question-title"),
        prompt: document.getElementById("question-prompt"),
        text: document.getElementById("question-text"),
        options: document.getElementById("options"),
        answerForm: document.getElementById("answer-form"),
        answerInput: document.getElementById("answer-input"),
        feedback: document.getElementById("feedback"),
        tryAgain: document.getElementById("try-again-button"),
        next: document.getElementById("next-button"),
        resultCorrect: document.getElementById("result-correct"),
        resultTotal: document.getElementById("result-total"),
        resultPercent: document.getElementById("result-percent"),
        resultSummary: document.getElementById("result-summary"),
        resultMessage: document.getElementById("result-message"),
        restart: document.getElementById("restart-button")
      };

      function normalize(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/[’]/g, "'")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/[.!?]+$/g, "")
          .trim();
      }

      function isCorrect(value, question) {
        var normalized = normalize(value);
        return question.answer.some(function compare(answer) {
          return normalize(answer) === normalized;
        });
      }

      function getBestScore() {
        try {
          return window.localStorage.getItem(STORAGE_KEY);
        } catch (error) {
          return null;
        }
      }

      function saveBestScore(score) {
        try {
          var best = Number(getBestScore() || 0);
          if (score > best) {
            window.localStorage.setItem(STORAGE_KEY, String(score));
          }
        } catch (error) {
          return;
        }
      }

      function updateBestScore() {
        elements.bestScore.textContent = getBestScore() || "-";
      }

      function setFeedback(message, correct) {
        elements.feedback.hidden = false;
        elements.feedback.className = "feedback " + (correct ? "correct" : "incorrect");
        elements.feedback.textContent = message;
      }

      function clearFeedback() {
        elements.feedback.hidden = true;
        elements.feedback.className = "feedback";
        elements.feedback.textContent = "";
      }

      function renderQuestion() {
        var question = questions[state.index];
        state.answered = false;
        state.missedCurrent = false;
        state.selectedAnswer = "";

        elements.questionCount.textContent = state.index + 1 + " / " + questions.length;
        elements.scoreCount.textContent = String(state.score);
        elements.progressBar.style.width = ((state.index + 1) / questions.length) * 100 + "%";
        elements.sectionLabel.textContent = question.section;
        elements.title.textContent = question.title;
        elements.prompt.textContent = question.prompt;
        elements.text.textContent = question.text;
        elements.options.innerHTML = "";
        elements.answerInput.value = "";
        elements.next.disabled = true;
        elements.tryAgain.hidden = true;
        clearFeedback();

        if (question.type === "choice") {
          elements.answerForm.hidden = true;
          elements.options.hidden = false;
          question.options.forEach(function addOption(option) {
            var button = document.createElement("button");
            button.className = "option-button";
            button.type = "button";
            button.textContent = option;
            button.addEventListener("click", function chooseOption() {
              if (state.answered) {
                return;
              }
              state.selectedAnswer = option;
              Array.prototype.forEach.call(elements.options.children, function clearSelected(child) {
                child.classList.remove("is-selected");
              });
              button.classList.add("is-selected");
              checkAnswer(option);
            });
            elements.options.appendChild(button);
          });
          return;
        }

        elements.options.hidden = true;
        elements.answerForm.hidden = false;
        window.setTimeout(function focusInput() {
          elements.answerInput.focus();
        }, 0);
      }

      function checkAnswer(value) {
        var question = questions[state.index];
        var correct = isCorrect(value, question);
        var firstAttempt = !state.answered && !state.missedCurrent;
        state.answered = true;

        if (correct && firstAttempt) {
          state.score += 1;
          elements.scoreCount.textContent = String(state.score);
          setFeedback("Correct.", true);
          elements.tryAgain.hidden = true;
        } else if (correct) {
          setFeedback("Correct. Score unchanged because the first answer was incorrect.", true);
          elements.tryAgain.hidden = true;
        } else {
          state.missedCurrent = true;
          setFeedback("Not yet. Try again or go to the next question.", false);
          elements.tryAgain.hidden = false;
        }

        elements.next.disabled = false;
      }

      function showResult() {
        var percent = Math.round((state.score / questions.length) * 100);
        saveBestScore(state.score);
        updateBestScore();
        elements.exercisePanel.hidden = true;
        elements.resultPanel.classList.add("is-visible");
        elements.resultCorrect.textContent = String(state.score);
        elements.resultTotal.textContent = String(questions.length);
        elements.resultPercent.textContent = percent + "%";
        elements.resultSummary.textContent = "You completed 20 grammar exercises.";
        elements.resultMessage.textContent = percent >= 80 ?
          "Great work. You are ready to continue." :
          "Good practice. Repeat the exercises to build confidence.";
        elements.resultPanel.focus();
      }

      function nextQuestion() {
        if (state.index === questions.length - 1) {
          showResult();
          return;
        }

        state.index += 1;
        renderQuestion();
        elements.title.focus();
      }

      function restart() {
        state.index = 0;
        state.score = 0;
        elements.exercisePanel.hidden = false;
        elements.resultPanel.classList.remove("is-visible");
        renderQuestion();
      }

      function applyFontSize(size) {
        var nextSize = ["small", "normal", "large"].indexOf(size) >= 0 ? size : "normal";
        elements.body.dataset.fontSize = nextSize;
        try {
          window.localStorage.setItem(FONT_KEY, nextSize);
        } catch (error) {
          return;
        }
        Array.prototype.forEach.call(document.querySelectorAll("[data-font-size]"), function updateButton(button) {
          button.setAttribute("aria-pressed", String(button.dataset.fontSize === nextSize));
        });
      }

      elements.answerForm.addEventListener("submit", function onSubmit(event) {
        event.preventDefault();
        if (!state.answered || !isCorrect(elements.answerInput.value, questions[state.index])) {
          checkAnswer(elements.answerInput.value);
        }
      });

      elements.tryAgain.addEventListener("click", function onTryAgain() {
        var question = questions[state.index];
        state.answered = false;
        elements.next.disabled = true;
        elements.tryAgain.hidden = true;
        clearFeedback();
        if (question.type === "choice" && elements.options.firstElementChild) {
          elements.options.firstElementChild.focus();
          return;
        }
        elements.answerInput.focus();
      });

      elements.next.addEventListener("click", nextQuestion);
      elements.restart.addEventListener("click", restart);

      Array.prototype.forEach.call(document.querySelectorAll("[data-font-size]"), function addFontControl(button) {
        button.addEventListener("click", function onFontClick() {
          applyFontSize(button.dataset.fontSize);
        });
      });

      applyFontSize((function getSavedFontSize() {
        try {
          return window.localStorage.getItem(FONT_KEY);
        } catch (error) {
          return "normal";
        }
      })());
      updateBestScore();
      renderQuestion();
    })(window, document);
  </script>
</body>
</html>
