<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook · Las acciones</title><style>:root{--r:#aa151b;--g:#2d7a5b;--i:#172033;--m:#667085;--p:#fffdf8;--line:#1720332c}*{box-sizing:border-box}body{margin:0;color:var(--i);font-family:Inter,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff,#f7f1e5)}button,textarea{font:inherit}.page{width:min(100%,1100px);margin:auto;padding:25px 20px}.top{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:2px solid #aa151b2e;color:var(--m);font-size:.8rem;font-weight:800;text-transform:uppercase}.course{color:var(--r)}h1{margin:22px 0 4px;font-size:clamp(2rem,5vw,3rem)}.sub{color:var(--m)}.shell{margin-top:18px;border-radius:16px;background:#fff;box-shadow:0 15px 35px #0002;overflow:hidden}.status{display:grid;grid-template-columns:repeat(3,1fr);background:#1720331a}.status div{padding:12px;background:#fff}.status small{display:block;color:var(--m);font-size:.68rem;text-transform:uppercase}.bar{height:8px;background:linear-gradient(90deg,var(--r),#f1bf00);width:0;transition:width .2s ease}.exercise,.result{padding:24px}.block{padding:11px 13px;border-left:6px solid #f1bf00;background:var(--p);border-radius:12px}.block small{display:block;color:var(--m);font-size:.7rem;text-transform:uppercase}.prompt{color:var(--m);font-weight:750}.title{font-size:clamp(1.35rem,3.8vw,2.2rem);white-space:pre-line;line-height:1.25}.textarea{width:100%;min-height:82px;padding:11px;border:2px solid var(--line);border-radius:12px;font-size:1.08rem;resize:vertical}.textarea.incorrect{border-color:#b42318;background:#fff1f0;color:#b42318}.textarea.correct{border-color:var(--g);background:#ecfdf3;color:var(--g)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.primary{min-height:45px;padding:9px 15px;border:0;border-radius:10px;background:var(--r);color:#fff;font-weight:900;text-transform:uppercase;cursor:pointer}.primary:disabled{background:#c9c3b8;cursor:not-allowed}.feedback{margin-top:14px;padding:13px;border-left:6px solid var(--g);background:#ecfdf3;border-radius:11px}.feedback.bad{border-left-color:#b42318;background:#fff1f0;color:#8f1d14}.feedback:empty{display:none}.result{display:none}.result.active{display:block}.result h2{font-size:2.5rem}.result button{margin-top:15px}.parts{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}.parts span{padding:6px 9px;border-radius:999px;background:#f4efe5;color:var(--m);font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.parts span.current{background:#aa151b14;color:var(--r)}@media(max-width:720px){.page{padding:20px 13px}.top{flex-direction:column;gap:5px}.status{grid-template-columns:1fr}.actions{display:grid}.primary{width:100%}.exercise,.result{padding:18px}.parts{display:grid;grid-template-columns:1fr 1fr}.parts span{ text-align:center }}</style></head><body><main class="page"><header class="top"><div class="course">Curso de Español · Workbook</div><div>Lección 5 · Repaso 5</div></header><h1>Las acciones</h1><p class="sub">Conjuga, transforma y produce frases en presente.</p><div class="parts"><span class="current">Parte 1 · Conjuga · 1–6</span><span>Parte 2 · Transforma · 7–12</span><span>Parte 3 · Produce · 13–18</span></div><section class="shell"><div class="status"><div><small>Ejercicio</small><strong id="count">1 / 18</strong></div><div><small>Puntuación</small><strong id="points">0 / 18</strong></div><div><small>Resultado</small><strong id="best">—</strong></div></div><div id="bar" class="bar"></div><div id="exercise" class="exercise"><div id="block" class="block"></div><p id="prompt" class="prompt"></p><h2 id="title" class="title"></h2><textarea id="answer" class="textarea" aria-label="Respuesta escrita" placeholder="Escribe tu respuesta."></textarea><div class="actions"><button id="check" class="primary" type="button">Comprobar</button><button id="next" class="primary" type="button" disabled>Siguiente</button></div><div id="feedback" class="feedback" aria-live="polite"></div></div><section id="result" class="result" tabindex="-1"><h2>Resultado</h2><p id="summary"></p><p id="score"></p><p id="message"></p><button id="restart" class="primary" type="button">Repetir ejercicio</button></section></section></main><script>(()=>{const Q=[
['Conjuga','yo + trabajar',['trabajo','yo trabajo'],'Se acepta la forma verbal sola o con el pronombre explícito.'],
['Conjuga','tú + aprender',['aprendes','tú aprendes'],'Se acepta la forma verbal sola o con el pronombre explícito.'],
['Conjuga','ella + escribir',['escribe','ella escribe'],'Se acepta la forma verbal sola o con el pronombre explícito.'],
['Conjuga','nosotros + comer',['comemos','nosotros comemos'],'Se acepta la forma verbal sola o con el pronombre explícito.'],
['Conjuga','vosotros + vivir',['vivís','vosotros vivís'],'Se acepta la forma verbal sola o con el pronombre explícito.'],
['Conjuga','ellos + estudiar',['estudian','ellos estudian'],'Se acepta la forma verbal sola o con el pronombre explícito.'],
['Transforma','Yo trabajo por la mañana. → nosotros','Nosotros trabajamos por la mañana.','Cambia la persona.'],
['Transforma','Ella vive en Madrid. → ellos','Ellos viven en Madrid.','Cambia la persona.'],
['Transforma','Nosotros comemos a la una. → vosotros','Vosotros coméis a la una.','Cambia la persona.'],
['Transforma','Ellos estudian español por la tarde. → negativo','Ellos no estudian español por la tarde.','Forma la frase negativa.'],
['Transforma','Tú escribes por la noche. → pregunta',['¿Escribes por la noche?','¿Tú escribes por la noche?','¿Cuándo escribes?','¿Cuándo escribes tú?','¿Cuándo tú escribes?'],'Se aceptan preguntas equivalentes que mantienen «escribes por la noche» y el orden natural o marcado del sujeto.'],
['Transforma','Marta trabaja en una oficina y vive en Madrid. → Marta y Carlos','Marta y Carlos trabajan en una oficina y viven en Madrid.','Cambia el sujeto y la concordancia.'],
['Produce','Marta / trabajar / banco / 08:00',['Marta trabaja en un banco a las ocho.','Marta trabaja en el banco a las ocho.','Marta trabaja en un banco a las ocho de la mañana.','Marta trabaja en el banco a las ocho de la mañana.','Marta trabaja en un banco a las 08:00.','Marta trabaja en el banco a las 08:00.','Marta trabaja en un banco a las ocho en punto.','Marta trabaja en el banco a las ocho en punto.','Marta trabaja en un banco a las 8:00 am.','Marta trabaja en el banco a las 8:00 am.'],'El artículo puede variar según el contexto y la hora puede escribirse de varias formas correctas.'],
['Produce','nosotros / comer / restaurante / 13:00',['Nosotros comemos en un restaurante a la una.','Nosotros comemos en el restaurante a la una.','Nosotros comemos en un restaurante a las trece.','Nosotros comemos en el restaurante a las trece.','Nosotros comemos en un restaurante a la una de la tarde.','Nosotros comemos en el restaurante a la una de la tarde.','Nosotros comemos en un restaurante a las 13:00.','Nosotros comemos en el restaurante a las 13:00.','Nosotros comemos en un restaurante a la 1:00 pm.','Nosotros comemos en el restaurante a la 1:00 pm.'],'El artículo puede variar según el contexto y la hora puede escribirse de varias formas correctas.'],
['Produce','vosotros / vivir / Madrid','Vosotros vivís en Madrid.','Escribe una frase completa.'],
['Produce','Luis y Ana / escribir / noche / no',['Luis y Ana no escriben por la noche.','Luis y Ana no escriben de noche.'],'Forma la frase negativa.'],
['Produce','yo / estudiar español / martes / 20:30',['Yo estudio español los martes a las ocho y media.','Estudio español los martes a las ocho y media.','Yo estudio español los martes a las ocho y media de la noche.','Estudio español los martes a las ocho y media de la noche.','Yo estudio español los martes a las veinte y treinta.','Estudio español los martes a las veinte y treinta.','Yo estudio español los martes a las 20:30.','Estudio español los martes a las 20:30.','Yo estudio español los martes a las ocho y media de la tarde.','Estudio español los martes a las ocho y media de la tarde.','Yo estudio español los martes a las 8:30 pm.','Estudio español los martes a las 8:30 pm.','Yo estudio español cada martes a las ocho y media de la noche.','Estudio español cada martes a las ocho y media de la noche.'],'La hora y la frecuencia pueden expresarse de varias formas correctas.'],
['Produce','Marta y Luis / trabajar / mañana / comer / 13:00 / vivir / Barcelona',['Marta y Luis trabajan por la mañana. Comen a la una. Viven en Barcelona.','Marta y Luis trabajan por la mañana, comen a la una y viven en Barcelona.','Marta y Luis trabajan por la mañana, comen a la una de la tarde, y viven en Barcelona.','Marta y Luis trabajan por la mañana. Marta y Luis comen a la una. Marta y Luis viven en Barcelona.','Marta y Luis trabajan por la mañana. Comen a las trece. Viven en Barcelona.','Marta y Luis trabajan por la mañana. Comen a las 13:00. Viven en Barcelona.','Trabajan por la mañana, comen a la una y viven en Barcelona.','Marta y Luis trabajan por la mañana. Comen a la una de la tarde. Viven en Barcelona.','Marta y Luis trabajan por la mañana. Comen a la 1:00 pm. Viven en Barcelona.'],'Se aceptan formulaciones equivalentes y horas gramaticalmente correctas.']
];let i=0,s=0,closed=false;const $=id=>document.getElementById(id),norm=x=>x.trim().toLocaleLowerCase('es').replace(/[¿¡.!?]+/g,' ').replace(/\s+/g,' ').trim();function part(n){return n<6?'Parte 1 · Conjuga':n<12?'Parte 2 · Transforma':'Parte 3 · Produce'}function render(){const q=Q[i];closed=false;$('exercise').style.display='block';$('result').classList.remove('active');$('block').innerHTML=`<small>${part(i)}</small><strong>Ejercicio ${i+1}</strong>`;$('prompt').textContent=i<6?'Escribe la forma correcta.':'Escribe tu respuesta.';$('title').textContent=q[1];$('answer').value='';$('answer').disabled=false;$('answer').className='textarea';$('feedback').className='feedback';$('feedback').innerHTML='';$('check').disabled=false;$('next').disabled=true;$('next').textContent=i===Q.length-1?'Ver resultado':'Siguiente';$('count').textContent=`${i+1} / ${Q.length}`;$('points').textContent=`${s} / ${Q.length}`;$('bar').style.width=`${(i/Q.length)*100}%`;setTimeout(()=>$('answer').focus(),0)}function check(){if(closed)return;const q=Q[i],v=norm($('answer').value),answers=Array.isArray(q[2])?q[2]:[q[2]],ok=answers.some(a=>norm(a)===v);closed=true;if(ok)s++;$('answer').classList.add(ok?'correct':'incorrect');$('answer').disabled=true;$('feedback').className=`feedback${ok?'':' bad'}`;$('feedback').innerHTML=`<strong>${ok?'Correcto.':'Incorrecto.'}</strong> ${ok?'':`Respuesta modelo: ${answers[0]} `}${q[3]}`;$('check').disabled=true;$('next').disabled=false;$('points').textContent=`${s} / ${Q.length}`;}function showResult(){$('exercise').style.display='none';$('result').classList.add('active');$('summary').textContent=`Has completado los ${Q.length} ejercicios.`;$('score').textContent=`Puntuación: ${s} / ${Q.length} (${Math.round(s/Q.length*100)}%).`;$('message').textContent=s===Q.length?'Excelente: conjugaste, transformaste y produjiste frases con precisión.':'Revisa las respuestas marcadas y vuelve a intentarlo.';$('result').focus()}$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{if(!closed)return;if(i<Q.length-1){i++;render()}else showResult()});$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});$('restart').addEventListener('click',()=>{i=0;s=0;render()});render()})();</script></body></html>
