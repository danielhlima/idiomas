<script>document.addEventListener("keydown",event=>{if(event.key!=="Enter"||!(event.target instanceof HTMLInputElement||event.target instanceof HTMLTextAreaElement)||event.target.disabled)return;event.preventDefault();document.querySelector("#check-button,#check")?.click()});</script>
<script>function marcarRespuesta(){setTimeout(()=>{const input=document.querySelector("#answer .input"),feedback=document.querySelector("#feedback");if(!input||!feedback)return;const incorrect=!feedback.textContent.trim().startsWith("Correcto.");input.classList.toggle("incorrect",incorrect);input.classList.toggle("correct",!incorrect)},0)}document.addEventListener("submit",marcarRespuesta);document.addEventListener("click",event=>{if(event.target.closest("#check"))marcarRespuesta()});</script>
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook · La pregunta exacta</title><style> :root{--r:#aa151b;--g:#2d7a5b;--i:#172033;--m:#667085;--p:#fffdf8;--s:#f4efe4}*{box-sizing:border-box}body{margin:0;color:var(--i);font-family:Inter,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff,#f7f1e5)}button,input{font:inherit}.page{width:min(100%,1000px);margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;border-bottom:2px solid #aa151b2e;padding-bottom:10px;color:var(--m);font-size:.8rem;font-weight:800;text-transform:uppercase}.course{color:var(--r)}h1{font-size:clamp(2rem,5vw,3rem);margin:25px 0 4px}.sub{color:var(--m)}.shell{margin-top:20px;background:#ffff;border-radius:18px;box-shadow:0 20px 50px #0002;overflow:hidden}.status{display:grid;grid-template-columns:repeat(3,1fr);background:#1720331a}.status div{padding:14px 18px;background:#fff}.status small{display:block;color:var(--m);font-size:.7rem;font-weight:900;text-transform:uppercase}.status strong{font-size:1.1rem}.bar{height:8px;background:linear-gradient(90deg,var(--r),#f1bf00);width:0}.exercise,.result{padding:28px}.block{padding:12px 15px;border-left:6px solid #f1bf00;background:var(--p);border-radius:12px}.block small{display:block;color:var(--m);font-size:.72rem;font-weight:900;text-transform:uppercase}.prompt{color:var(--m);font-weight:750}.title{font-size:clamp(1.45rem,4vw,2.5rem);line-height:1.18}.highlight{color:var(--r);font-weight:900}.input{width:100%;min-height:58px;border:2px solid #17203324;border-radius:12px;padding:12px;font-size:1.15rem}.input.incorrect{border-color:#b42318;background:#fff1f0;color:#b42318}.input.correct{border-color:#2d7a5b;background:#ecfdf3;color:#2d7a5b}.input.incorrect{border-color:#b42318;background:#fff1f0;color:#b42318}.input.correct{border-color:#2d7a5b;background:#ecfdf3;color:#2d7a5b}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.primary{min-height:46px;padding:10px 16px;border:0;border-radius:10px;background:var(--r);color:white;font-weight:900;text-transform:uppercase}.primary:disabled{background:#c9c3b8}.feedback{margin-top:16px;padding:14px;border-left:6px solid var(--g);background:#ecfdf3;border-radius:12px}.feedback:empty{display:none}.result{display:none}.result.active{display:block}.result h2{font-size:2.6rem}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.score div{padding:14px;background:#fff;border-radius:12px;box-shadow:0 5px 16px #0001}.score small{display:block;color:var(--m);font-size:.7rem;text-transform:uppercase}.score strong{color:var(--r);font-size:1.3rem}@media(max-width:650px){.page{padding:20px 14px}.top{flex-direction:column;gap:5px}.status,.score{grid-template-columns:1fr}.exercise,.result{padding:20px 15px}.actions{display:grid}.primary{width:100%}}</style></head><body><main class="page"><header class="top"><div class="course">Curso de Español · Workbook</div><div>Lección 5 · Repaso 3</div></header><h1>La pregunta exacta</h1><p class="sub">Escribe la pregunta que busca la información destacada.</p><section class="shell"><div class="status"><div><small>Pregunta</small><strong id="count">1 / 10</strong></div><div><small>Puntuación</small><strong id="points">0 / 10</strong></div><div><small>Mejor resultado</small><strong id="best">—</strong></div></div><div id="bar" class="bar"></div><div id="exercise" class="exercise"><div id="block" class="block"></div><p id="prompt" class="prompt"></p><h2 id="title" class="title"></h2><div id="answer"></div><div class="actions"><button id="check" class="primary">Comprobar</button><button id="next" class="primary" disabled>Siguiente</button></div><div id="feedback" class="feedback" aria-live="polite"></div></div><section id="result" class="result" tabindex="-1"><h2>Resultado</h2><p id="summary"></p><div class="score"><div><small>Puntuación obtenida</small><strong id="got"></strong></div><div><small>Puntuación máxima</small><strong>10</strong></div><div><small>Porcentaje</small><strong id="pct"></strong></div></div><p id="message"></p><button id="restart" class="primary">Repetir ejercicio</button></section></section></main><script>
(()=>{const Q=[['Lugar','Marta trabaja en un hospital.','en un hospital',['¿Dónde trabaja Marta?','¿Dónde Marta trabaja?'],'Buscamos un lugar: ¿dónde...?'],['Día / momento','Luis estudia español los martes.','los martes',['¿Cuándo estudia español Luis?','¿Cuándo Luis estudia español?'],'Buscamos un momento: ¿cuándo...?'],['Cantidad','Hay dieciséis estudiantes en la sala.','dieciséis estudiantes',['¿Cuántos estudiantes hay en la sala?'],'Revisa la tilde en “cuántos”.'],['Compañía','Trabajo con Ana.','con Ana',['¿Con quién trabajas?','¿Con quién trabajas tú?','¿Con quién trabajo?'],'Buscamos compañía: ¿con quién...?'],['Posesión','El libro es de Carlos.','de Carlos',['¿De quién es el libro?'],'Buscamos posesión: ¿de quién...?'],['Hora','Marta come a la una y media.','a la una y media',['¿A qué hora come Marta?','¿Cuándo come Marta?','¿A qué hora Marta come?','¿Cuándo Marta come?'],'Buscamos una hora: ¿a qué hora...?'],['Persona','Laura y Pedro viven en Madrid.','Laura y Pedro',['¿Quiénes viven en Madrid?'],'“Quiénes” concuerda con una persona plural.'],['Lugar + verbo','Nosotros estudiamos español en la oficina.','en la oficina',['¿Dónde estudiamos español?'],'Mantén el mismo sujeto y la forma verbal.'],['Cantidad femenina','Hay cuatro ventanas grandes en la sala.','cuatro ventanas grandes',['¿Cuántas ventanas grandes hay en la sala?'],'“Cuántas” concuerda con “ventanas”.'],['Dos preguntas','Ana vive en Barcelona y trabaja por la mañana.','',['¿Dónde vive Ana?\n¿Cuándo trabaja Ana?'],'Escribe las dos preguntas completas.']];let i=0,s=0,closed=false;const $=x=>document.getElementById(x),norm=x=>x.trim().toLocaleLowerCase('es').replace(/[.!?]+$/g,'').replace(/\s+/g,' ');function render(){const q=Q[i];closed=false;$('exercise').style.display='block';$('result').classList.remove('active');$('block').innerHTML=`<small>Área · ${q[0]}</small>`;$('prompt').textContent='Escribe la pregunta.';let title=q[1].replace(q[2],`<span class="highlight">${q[2]}</span>`);if(i===9)title=q[1].replace('en Barcelona','<span class="highlight">en Barcelona</span>').replace('por la mañana','<span class="highlight">por la mañana</span>');$('title').innerHTML=title;const input=document.createElement('textarea');input.className='input';input.rows=i===9?3:1;input.placeholder='Escribe la pregunta completa.';input.setAttribute('aria-label','Pregunta escrita');$('answer').innerHTML='';$('answer').appendChild(input);$('feedback').innerHTML='';$('check').disabled=false;$('next').disabled=true;$('next').textContent=i===9?'Ver resultado':'Siguiente';$('count').textContent=`${i+1} / 10`;$('points').textContent=`${s} / 10`;$('bar').style.width=`${(i+1)*10}%`;}function check(){if(closed)return;const q=Q[i],v=norm($('answer').querySelector('textarea').value),ok=q[3].some(a=>norm(a)===v);closed=true;if(ok)s++;$('feedback').className='feedback';$('feedback').innerHTML=`<strong>${ok?'Correcto.':'Revisa la estructura.'}</strong> ${ok?'':`Respuesta modelo: ${q[3][0]} `}${q[4]}`;$('answer').querySelector('textarea').disabled=true;$('check').disabled=true;$('next').disabled=false;$('points').textContent=`${s} / 10`;}function result(){$('exercise').style.display='none';$('result').classList.add('active');$('got').textContent=s;$('pct').textContent=`${s*10}%`;$('summary').textContent='Has completado los 10 ejercicios.';$('message').textContent=s>=8?'Buen trabajo: construyes preguntas con precisión.':'Revisa las respuestas y vuelve a intentarlo.';$('result').focus();}$('check').addEventListener('click',check);$('next').addEventListener('click',()=>{if(!closed)return;if(i<9){i++;render();}else result();});$('restart').addEventListener('click',()=>{i=0;s=0;render()});render()})();
</script><script>document.addEventListener("submit",()=>setTimeout(()=>{const input=document.querySelector("#answer .input"),feedback=document.querySelector("#feedback");if(!input||!feedback)return;const incorrect=!feedback.textContent.trim().startsWith("Correcto.");input.classList.toggle("incorrect",incorrect);input.classList.toggle("correct",!incorrect)},0));</script></body></html>
