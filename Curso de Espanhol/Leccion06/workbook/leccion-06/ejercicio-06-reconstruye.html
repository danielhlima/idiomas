<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbook · Lección 6 · Reconstruye</title>
  <style>
    :root{--red:#aa151b;--gold:#f1bf00;--ink:#172033;--muted:#667085;--paper:#fffdf8;--soft:#f4efe4;--line:rgba(23,32,51,.12);--green:#2d7a5b;--blue:#2d5ea8;--focus:rgba(45,94,168,.38)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,#f7f1e5);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(92%,900px);margin:0 auto;padding:34px 0}header{border-bottom:2px solid rgba(170,21,27,.2);padding-bottom:14px}.course{margin:0;color:var(--red);font-size:.8rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}h1{margin:10px 0 5px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,5vw,3.5rem);line-height:1.05}.sub{margin:0;color:var(--muted);font-weight:700}.shell{margin-top:24px;padding:clamp(22px,4vw,42px);border-left:5px solid var(--gold);background:rgba(255,255,255,.96);box-shadow:0 12px 28px rgba(20,28,38,.1)}.progress{margin:0 0 14px;color:var(--muted);font-weight:800}.instruction{margin:0 0 18px;color:var(--muted);font-weight:750}.prompt{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:700;line-height:1.3}.answer{width:100%;min-height:120px;margin-top:20px;resize:vertical;border:1px solid var(--line);border-bottom:3px solid var(--blue);padding:12px 14px;color:var(--ink);font:700 1.05rem Arial,Helvetica,sans-serif}.answer:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.actions button,button{min-height:42px;border:1px solid var(--red);padding:9px 16px;background:var(--red);color:#fff;font-weight:900;letter-spacing:.05em;cursor:pointer}.actions .secondary{background:#fff;color:var(--red)}.feedback{min-height:48px;margin:16px 0 0;padding:12px 14px;background:var(--soft);font-weight:750;line-height:1.4}.feedback.correct{background:#ecfdf3;color:#17603f}.feedback.incorrect{background:#fff1f0;color:#8e1116}.answer-key{margin:14px 0 0;padding:12px 14px;border-left:4px solid var(--green);background:#ecfdf3;font-weight:800}.answer-key[hidden],.question-wrap[hidden],.done[hidden]{display:none}.done{text-align:center}.done h2{font-family:Georgia,"Times New Roman",serif}.repeat{margin-top:16px;border:0!important}@media(max-width:560px){.actions{display:grid}.actions button{width:100%}}
  </style>
</head>
<body>
  <main>
    <header><p class="course">Curso de Español · Lección 6 · Ejercicios 6</p><h1>Reconstruye</h1><p class="sub">Escribe la frase completa.</p></header>
    <section class="shell">
      <div class="question-wrap"><p class="progress" data-progress></p><p class="instruction" data-instruction></p><p class="prompt" data-prompt></p><textarea class="answer" data-answer aria-label="Escribe la frase"></textarea><div class="actions"><button type="button" data-check>COMPROBAR</button><button class="secondary" type="button" data-show>Mostrar respuesta</button></div><p class="feedback" aria-live="polite" data-feedback></p><p class="answer-key" data-key hidden></p></div>
      <div class="done" hidden><h2>¡Práctica terminada!</h2><p>Con querer y poder, el segundo verbo permanece en infinitivo.</p><button class="repeat" type="button" data-repeat>REPETIR</button></div>
    </section>
  </main>
  <script>
    (()=>{const items=[['Marta / querer / aprender / español','Escribe la frase completa.',['marta quiere aprender español.'],'Correcto. Después de querer usamos el infinitivo.'],['nosotros / poder / trabajar / mañana','Escribe la frase completa.',['nosotros podemos trabajar mañana.','podemos trabajar mañana.'],'Correcto. Después de poder usamos el infinitivo.'],['yo / no / poder / venir / hoy','Escribe la frase completa.',['yo no puedo venir hoy.','no puedo venir hoy.'],'Correcto. La negativa va delante del verbo conjugado.'],['tú / querer / comer / ahora','Escribe la frase completa.',['tú quieres comer ahora.','quieres comer ahora.'],'Correcto. Querer se conjuga; comer queda en infinitivo.'],['ellos / querer / viajar / mañana','Escribe la frase completa.',['ellos quieren viajar mañana.'],'Correcto. Después de querer usamos el infinitivo.'],['vosotros / poder / aprender / español','Escribe la frase completa.',['vosotros podéis aprender español.'],'Correcto. Con vosotros: podéis.'],['¿Qué forma tiene el segundo verbo después de querer o poder?','Responde brevemente.',['el infinitivo.','va en infinitivo.'],'Correcto. El segundo verbo va en infinitivo.'],['¿Cuál es correcta? A. Quiero viajo. B. Quiero viajar.','Escribe la opción correcta y la frase.',['b. quiero viajar.','quiero viajar.'],'Correcto. Después del verbo conjugado usamos el infinitivo.'],['¿Cuál es correcta? A. Podemos trabajamos mañana. B. Podemos trabajar mañana.','Escribe la opción correcta y la frase.',['b. podemos trabajar mañana.','podemos trabajar mañana.'],'Correcto. Después de poder usamos el infinitivo.']];let index=0;const progress=document.querySelector('[data-progress]'),instruction=document.querySelector('[data-instruction]'),prompt=document.querySelector('[data-prompt]'),answer=document.querySelector('[data-answer]'),check=document.querySelector('[data-check]'),show=document.querySelector('[data-show]'),feedback=document.querySelector('[data-feedback]'),key=document.querySelector('[data-key]'),wrap=document.querySelector('.question-wrap'),done=document.querySelector('.done');const clean=value=>value.trim().toLocaleLowerCase('es-ES').replace(/[.!?]+$/g,'').replace(/\s+/g,' ');function render(){const item=items[index];progress.textContent=`Ejercicio ${index+1} de ${items.length}`;instruction.textContent=item[1];prompt.textContent=item[0];answer.value='';answer.disabled=false;check.disabled=false;show.disabled=false;feedback.className='feedback';feedback.textContent='Escribe tu respuesta.';key.hidden=true;key.textContent=''}function reveal(){key.textContent=`Respuesta posible: ${items[index][2][0]}`;key.hidden=false}function verify(){const item=items[index],value=clean(answer.value);if(!value){feedback.className='feedback incorrect';feedback.textContent='Escribe una respuesta antes de comprobar.';return}const correct=item[2].some(expected=>clean(expected)===value);feedback.className=`feedback ${correct?'correct':'incorrect'}`;feedback.textContent=correct?item[3]:'Revisa la conjugación de querer o poder y deja el segundo verbo en infinitivo.';reveal();if(correct){answer.disabled=true;check.disabled=true;show.disabled=true;setTimeout(()=>{index++;if(index===items.length){wrap.hidden=true;done.hidden=false}else render()},900)}}check.addEventListener('click',verify);show.addEventListener('click',reveal);document.querySelector('[data-repeat]').addEventListener('click',()=>{index=0;done.hidden=true;wrap.hidden=false;render()});render()})();
  </script>
</body>
</html>
