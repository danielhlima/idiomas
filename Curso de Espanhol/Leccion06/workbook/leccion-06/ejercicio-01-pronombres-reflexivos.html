<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook · Lección 6 · Pronombres reflexivos</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:linear-gradient(135deg,#fff,#f7f1e5)}main{width:min(92%,820px);margin:0 auto;padding:34px 0}header{border-bottom:2px solid #aa151b33;padding-bottom:12px}.course{margin:0;color:#aa151b;font-size:.8rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}h1{margin:9px 0 5px;font-size:clamp(2rem,5vw,3rem)}.sub{margin:0;color:#667085;font-weight:650}.shell{margin-top:24px;padding:clamp(22px,5vw,42px);border-top:6px solid #f1bf00;border-radius:18px;background:#fff;box-shadow:0 15px 35px #17203318}.progress{margin:0 0 20px;color:#667085;font-weight:800}.question{margin:0;font-size:clamp(1.45rem,4vw,2.2rem);font-weight:850;line-height:1.22}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.option,button{min-height:52px;border:2px solid #17203322;border-radius:12px;background:#fff;color:#172033;padding:10px 14px;font-weight:850;font-size:1rem;cursor:pointer}.option:hover{border-color:#2d5ea8}.option.correct{border-color:#2d7a5b;background:#ecfdf3}.option.incorrect{border-color:#b42318;background:#fff1f0}.feedback{min-height:52px;margin-top:18px;padding:13px 15px;border-radius:12px;background:#f4efe4;font-weight:750;line-height:1.4}.done{text-align:center}.done[hidden],.question-wrap[hidden]{display:none}.repeat{margin-top:18px;border:0;background:#aa151b;color:#fff}@media(max-width:520px){.options{grid-template-columns:1fr}}</style></head><body><main><header><p class="course">Curso de Español · Lección 6 · Práctica 1</p><h1>Pronombres reflexivos</h1><p class="sub">Elige la forma que completa cada frase.</p></header><section class="shell"><div class="question-wrap"><p class="progress" data-progress></p><p class="question" data-question></p><div class="options" data-options></div><p class="feedback" aria-live="polite" data-feedback>Elige una respuesta.</p></div><div class="done" hidden><h2>¡Actividad terminada!</h2><p>Has practicado los pronombres reflexivos.</p><button class="repeat" type="button" data-repeat>REPETIR EJERCICIO</button></div></section></main><script>(()=>{const items=[['Yo ___ levanto temprano.',['me','te','se','nos'],'me'],['¿A qué hora ___ duchas?',['me','te','se','os'],'te'],['Marta ___ acuesta a las once.',['me','te','se','nos'],'se'],['Nosotros ___ vestimos antes de salir.',['nos','os','se','me'],'nos'],['Ellos ___ lavan los dientes.',['se','te','nos','os'],'se']];let index=0;const progress=document.querySelector('[data-progress]'),question=document.querySelector('[data-question]'),options=document.querySelector('[data-options]'),feedback=document.querySelector('[data-feedback]'),wrap=document.querySelector('.question-wrap'),done=document.querySelector('.done');function render(){const [text,choices]=items[index];progress.textContent=`Pregunta ${index+1} de ${items.length}`;question.textContent=text;feedback.textContent='Elige una respuesta.';options.replaceChildren(...choices.map(choice=>{const button=document.createElement('button');button.className='option';button.type='button';button.textContent=choice;button.addEventListener('click',()=>answer(button,choice));return button}))}function answer(button,value){const correct=items[index][2],all=[...options.children];all.forEach(b=>b.disabled=true);if(value===correct){button.classList.add('correct');feedback.textContent='Correcto. El pronombre concuerda con la persona.'}else{button.classList.add('incorrect');all.find(b=>b.textContent===correct).classList.add('correct');feedback.textContent=`Todavía no. La respuesta correcta es “${correct}”.`}setTimeout(()=>{index++;if(index===items.length){wrap.hidden=true;done.hidden=false}else render()},900)}document.querySelector('[data-repeat]').addEventListener('click',()=>{index=0;done.hidden=true;wrap.hidden=false;render()});render()})();</script></body></html>
