<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbook · Lección 6 · Diagnóstico</title>
  <style>
    :root{--red:#aa151b;--gold:#f1bf00;--ink:#172033;--muted:#667085;--paper:#fffdf8;--soft:#f4efe4;--line:rgba(23,32,51,.12);--green:#2d7a5b;--focus:rgba(45,94,168,.38)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,#f7f1e5);color:var(--ink);font-family:Arial,Helvetica,sans-serif}main{width:min(92%,860px);margin:0 auto;padding:34px 0}header{border-bottom:2px solid rgba(170,21,27,.2);padding-bottom:14px}.course{margin:0;color:var(--red);font-size:.8rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}h1{margin:10px 0 5px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,5vw,3.5rem);line-height:1.05}.sub{margin:0;color:var(--muted);font-weight:700}.shell{margin-top:24px;padding:clamp(22px,4vw,42px);border-left:5px solid var(--gold);background:rgba(255,255,255,.96);box-shadow:0 12px 28px rgba(20,28,38,.1)}.progress{margin:0 0 16px;color:var(--muted);font-weight:800}.word{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.3rem,6vw,4.5rem);font-weight:700;text-align:center}.question{margin:14px 0 0;font-size:clamp(1.25rem,3vw,1.8rem);font-weight:850;text-align:center}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.options button,button{min-height:48px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:900;letter-spacing:.05em;cursor:pointer}.options button:hover{border-color:var(--red)}.options button.correct{border-color:var(--green);background:#ecfdf3;color:#17603f}.options button.incorrect{border-color:var(--red);background:#fff1f0;color:#8e1116}.feedback{min-height:48px;margin:18px 0 0;padding:12px 14px;background:var(--soft);font-weight:750;line-height:1.4}.feedback.correct{background:#ecfdf3;color:#17603f}.feedback.incorrect{background:#fff1f0;color:#8e1116}.done{text-align:center}.done[hidden],.question-wrap[hidden]{display:none}.done h2{font-family:Georgia,"Times New Roman",serif}.repeat{margin-top:16px;padding:10px 16px;border:0;background:var(--red);color:#fff;font-weight:900}.options button:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(max-width:520px){.options{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header><p class="course">Curso de Español · Lección 6 · Diagnóstico</p><h1>Regular o irregular?</h1><p class="sub">Observa la forma y elige una opción.</p></header>
    <section class="shell">
      <div class="question-wrap"><p class="progress" data-progress></p><p class="word" data-word></p><p class="question">¿Regular o irregular?</p><div class="options"><button type="button" data-choice="regular">REGULAR</button><button type="button" data-choice="irregular">IRREGULAR</button></div><p class="feedback" aria-live="polite" data-feedback>Elige una opción.</p></div>
      <div class="done" hidden><h2>Diagnóstico terminado</h2><p>¿Qué parte del verbo cambia? Coméntalo oralmente.</p><p>A veces cambia la raíz. A veces cambia una forma específica.</p><button class="repeat" type="button" data-repeat>REPETIR</button></div>
    </section>
  </main>
  <script>
    (()=>{const items=[['trabajo','regular','Regular. La raíz “trabaj-” se mantiene.'],['puedo','irregular','Irregular. La forma cambia respecto a “poder”.'],['vivimos','regular','Regular. La raíz “viv-” se mantiene.'],['quiero','irregular','Irregular. La forma cambia respecto a “querer”.'],['tengo','irregular','Irregular. La forma cambia respecto a “tener”.']];let index=0;const progress=document.querySelector('[data-progress]'),word=document.querySelector('[data-word]'),buttons=[...document.querySelectorAll('[data-choice]')],feedback=document.querySelector('[data-feedback]'),wrap=document.querySelector('.question-wrap'),done=document.querySelector('.done');function render(){progress.textContent=`Diagnóstico ${index+1} de ${items.length}`;word.textContent=items[index][0];feedback.className='feedback';feedback.textContent='Elige una opción.';buttons.forEach(button=>{button.disabled=false;button.className=''})}function answer(button){const item=items[index],correct=button.dataset.choice===item[1];buttons.forEach(option=>option.disabled=true);button.classList.add(correct?'correct':'incorrect');if(!correct)buttons.find(option=>option.dataset.choice===item[1]).classList.add('correct');feedback.className=`feedback ${correct?'correct':'incorrect'}`;feedback.textContent=correct?item[2]:`Todavía no. La respuesta es “${item[1]}”.`;setTimeout(()=>{index++;if(index===items.length){wrap.hidden=true;done.hidden=false}else render()},900)}buttons.forEach(button=>button.addEventListener('click',()=>answer(button)));document.querySelector('[data-repeat]').addEventListener('click',()=>{index=0;done.hidden=true;wrap.hidden=false;render()});render()})();
  </script>
</body>
</html>
