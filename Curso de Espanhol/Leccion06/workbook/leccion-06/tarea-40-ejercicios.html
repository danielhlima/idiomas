<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarea para casa · 40 ejercicios</title>
<style>
:root{--red:#aa151b;--gold:#f1bf00;--ink:#172033;--muted:#667085;--green:#2d7a5b;--soft:#f4efe4;--paper:#fffdf8;--line:rgba(23,32,51,.12);--font:1}*{box-sizing:border-box}html{font-size:calc(16px * var(--font))}body{margin:0;background:radial-gradient(circle at 90% 8%,#f8e9a9,transparent 28%),linear-gradient(135deg,#fff,#f7f1e5);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2d5ea8;outline-offset:3px}.page{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 0 42px}.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #aa151b33;padding-bottom:12px;margin-bottom:22px}.course,.kicker{color:var(--red);font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.fonts{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:#fff}.fonts button{width:34px;height:30px;border:0;border-radius:7px;background:transparent;font-weight:900}.fonts button:hover{background:var(--soft);color:var(--red)}h1{font:700 clamp(2rem,5vw,3.3rem)/1.05 Georgia,"Times New Roman",serif;margin:.2rem 0 .5rem}h2{color:var(--red);font-size:1rem;letter-spacing:.08em;text-transform:uppercase}.sub{color:var(--muted);font-size:1.08rem}.card{border:1px solid var(--line);border-radius:17px;background:#fffffff2;box-shadow:0 14px 35px #00000012;padding:22px}.progress{height:9px;overflow:hidden;border-radius:99px;background:#1720331c;margin:16px 0 20px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .2s}.exercise{display:grid;gap:16px}.exercise-prompt{font:700 clamp(1.35rem,3vw,2rem)/1.25 Georgia,"Times New Roman",serif;margin:0}.hint{color:var(--muted);font-weight:750}.answer{min-height:100px;width:100%;border:1px solid var(--line);border-bottom:4px solid var(--green);border-radius:10px;padding:12px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px}.btn{min-height:44px;border:0;border-radius:9px;padding:10px 14px;font-weight:900}.primary{background:var(--red);color:#fff}.secondary{background:var(--soft);color:var(--red)}.feedback{min-height:1.4em;color:var(--muted);font-weight:800}.feedback.ok{color:var(--green)}.feedback.bad{color:var(--red)}.result{text-align:center}.result h2{font-size:1.4rem}.score{font:700 3rem Georgia,"Times New Roman",serif;color:var(--red)}.review{margin-top:14px;color:var(--muted);font-weight:750}.hidden{display:none!important}@media(max-width:560px){.page{width:calc(100% - 20px);padding-top:15px}.topbar{display:grid;gap:12px}.actions{display:grid}.actions .btn{width:100%}}
</style></head>
<body><main class="page"><div class="topbar"><div class="course">CURSO DE ESPAÑOL</div><div class="fonts"><button data-font="down" type="button" aria-label="Disminuir texto">A−</button><button data-font="reset" type="button" aria-label="Restaurar texto">A</button><button data-font="up" type="button" aria-label="Aumentar texto">A+</button></div></div><div class="kicker">TAREA PARA CASA · 40 EJERCICIOS</div><h1>Practica lo que aprendimos hoy</h1><p class="sub">Completa cada ejercicio y revisa tus respuestas.</p><div class="progress" aria-label="Progreso"><span id="bar"></span></div><section class="card" id="work"><p id="count" class="hint"></p><article class="exercise"><p id="prompt" class="exercise-prompt"></p><p id="hint" class="hint"></p><textarea id="answer" class="answer" aria-label="Tu respuesta"></textarea><div class="actions"><button class="btn primary" id="check" type="button">COMPROBAR</button><button class="btn secondary" id="next" type="button" disabled>SIGUIENTE</button></div><p id="feedback" class="feedback" aria-live="polite"></p></article></section><section class="card result hidden" id="result"><h2>Resultado final</h2><p class="score" id="score"></p><p id="summary"></p><p class="review">Puedes revisar tus respuestas con tu profesor.</p><button class="btn primary" id="repeat" type="button">REPETIR EJERCICIO</button></section></main><script>
const items=[
['Yo ______ aprender español. (querer)',['quiero'],'Correcto. Querer cambia e → ie.'],['Tú ______ en el trabajo. (pensar)',['piensas'],'Correcto.'],['Ella ______ la pregunta. (entender)',['entiende'],'Correcto.'],['Nosotros ______ café. (preferir)',['preferimos'],'Con nosotros no cambia la raíz.'],['Yo ______ trabajar mañana. (poder)',['puedo'],'Correcto. Poder cambia o → ue.'],['Él ______ ocho horas. (dormir)',['duerme'],'Correcto.'],['Nosotros ______ a casa a las siete. (volver)',['volvemos'],'Correcto.'],['Ellos ______ a la una. (almorzar)',['almuerzan'],'Correcto.'],['Marta ______ una reunión. (tener)',['tiene'],'Tener cambia en algunas personas.'],['Yo ______ una reunión hoy. (tener)',['tengo'],'Tener tiene una forma especial en yo.'],['Yo ______ la comida. (pedir)',['pido'],'Pedir cambia e → i.'],['Vosotros ______ la frase. (repetir)',['repetís'],'Recuerda el acento.'],['Yo ______ hacer deporte. (querer)',['quiero'],'Correcto.'],['Ella no ______ salir. (poder)',['puede'],'Correcto.'],['Carlos ______ a casa. (volver)',['vuelve'],'Correcto.'],['Tú ______ español. (preferir)',['prefieres'],'Correcto.'],['Cambia a nosotros: Yo puedo trabajar mañana.',['nosotros podemos trabajar mañana','podemos trabajar mañana'],'Con nosotros: podemos.'],['Cambia a nosotros: Yo quiero comer.',['nosotros queremos comer','queremos comer'],'Después de querer va el infinitivo.'],['Haz la frase negativa: Marta viene a clase.',['marta no viene a clase','no viene a clase'],'Correcto.'],['Haz la frase negativa: Tú puedes salir hoy.',['tú no puedes salir hoy','tu no puedes salir hoy','no puedes salir hoy'],'Correcto.'],['Transforma en pregunta: Tú quieres comer ahora.',['quieres comer ahora','¿quieres comer ahora?','tú quieres comer ahora','¿tú quieres comer ahora?','quieres tú comer ahora','¿quieres tú comer ahora?'],'La pregunta puede tener más de un orden natural.'],['Transforma en pregunta: Tú puedes venir mañana.',['puedes venir mañana','¿puedes venir mañana?','tú puedes venir mañana','¿tú puedes venir mañana?','puedes tú venir mañana','¿puedes tú venir mañana?'],'La pregunta puede tener más de un orden natural.'],['Cambia a nosotros: Yo entiendo la pregunta.',['nosotros entendemos la pregunta','entendemos la pregunta'],'Correcto.'],['Cambia a ellos: Ella pide una ensalada.',['ellos piden una ensalada','piden una ensalada'],'Correcto.'],['Reconstruye: ellos / poder / venir / mañana',['ellos pueden venir mañana','pueden venir mañana'],'Correcto.'],['Reconstruye: yo / querer / viajar / el viernes',['yo quiero viajar el viernes','quiero viajar el viernes'],'Después de querer va viajar.'],['Reconstruye: nosotros / volver / a casa / a las siete',['nosotros volvemos a casa a las siete','volvemos a casa a las siete'],'Correcto.'],['Reconstruye: tú / preferir / tomar un café',['tú prefieres tomar un café','tu prefieres tomar un café','prefieres tomar un café'],'Correcto.'],['Corrige el error: Yo quiero viajo mañana.',['yo quiero viajar mañana','quiero viajar mañana'],'Revisa el infinitivo después de querer.'],['Corrige el error: Nosotros podimos trabajar.',['nosotros podemos trabajar','podemos trabajar'],'Con nosotros: podemos.'],['Corrige el error: Ella tiena una reunión.',['ella tiene una reunión','tiene una reunión'],'Tener: tiene.'],['Corrige el error: Ellos dormen tarde.',['ellos duermen tarde','duermen tarde'],'Dormir cambia o → ue.'],['Escribe una frase con tener.','open','Usa una forma correcta de tener.'],['Escribe una frase con hacer.','open','Usa una forma correcta de hacer.'],['Escribe una frase con venir.','open','Usa una forma correcta de venir.'],['Escribe una frase con salir.','open','Usa una forma correcta de salir.'],['Escribe una frase con querer + infinitivo.','open','Después de querer usa un infinitivo.'],['Escribe una frase con poder + infinitivo.','open','Después de poder usa un infinitivo.'],['Escribe una frase negativa con poder.','open','Usa no + poder conjugado.'],['Escribe una pregunta natural con querer.','open','Puedes usar: ¿Quieres...?']
];
let index=0,score=0,checked=false;const $=id=>document.getElementById(id);const normalize=v=>String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿¡!?.,;:]/g,'').replace(/\s+/g,' ').trim();function render(){const item=items[index];$('count').textContent=`Ejercicio ${index+1} de ${items.length}`;$('bar').style.width=`${index/items.length*100}%`;$('prompt').textContent=item[0];$('hint').textContent=item[2]||'';$('answer').value='';$('answer').disabled=false;$('check').disabled=false;$('next').disabled=true;$('feedback').textContent='';$('feedback').className='feedback';checked=false}function evaluate(){const value=normalize($('answer').value);const item=items[index];if(!value){$('feedback').textContent='Escribe una respuesta antes de comprobar.';$('feedback').className='feedback bad';return}let ok;if(item[1]==='open'){ok=value.length>=5;$('feedback').textContent=ok?'Respuesta registrada. Revísala con tu profesor.':'Escribe una frase más completa.'}else{ok=item[1].some(answer=>normalize(answer)===value);$('feedback').textContent=ok?item[2]:'Revisa la conjugación, la concordancia y el infinitivo.'}$('feedback').className=`feedback ${ok?'ok':'bad'}`;if(ok){score+=1;checked=true;$('answer').disabled=true;$('check').disabled=true;$('next').disabled=false}}$('check').addEventListener('click',evaluate);$('next').addEventListener('click',()=>{if(!checked)return;if(index<items.length-1){index+=1;render()}else{$('work').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('score').textContent=`${score} / ${items.length}`;$('summary').textContent=`Aciertos: ${score} · Errores: ${items.length-score}`}});$('repeat').addEventListener('click',()=>{index=0;score=0;$('result').classList.add('hidden');$('work').classList.remove('hidden');render()});document.querySelectorAll('[data-font]').forEach(b=>b.addEventListener('click',()=>{let n=Number(getComputedStyle(document.documentElement).getPropertyValue('--font'))||1;n=b.dataset.font==='up'?n+.05:b.dataset.font==='down'?n-.05:1;document.documentElement.style.setProperty('--font',Math.min(1.35,Math.max(.85,n)))}));render();
</script></body></html>
