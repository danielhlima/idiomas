<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook · Lección 6 · Practicamos</title><style>body{margin:0;background:linear-gradient(135deg,#fff,#f7f1e5);color:#172033;font-family:Arial,Helvetica,sans-serif}main{width:min(92%,900px);margin:auto;padding:34px 0}header{border-bottom:2px solid #aa151b33;padding-bottom:14px}.course{color:#aa151b;font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{font:700 clamp(2rem,5vw,3.5rem) Georgia,"Times New Roman",serif}.sub{color:#667085;font-weight:700}.shell{margin-top:24px;padding:clamp(22px,4vw,42px);border-left:5px solid #f1bf00;background:#fffffff5;box-shadow:0 12px 28px #141c261a}.progress{color:#667085;font-weight:800}.prompt{font:700 clamp(1.35rem,3.4vw,2.2rem) Georgia,"Times New Roman",serif}.answer{width:100%;min-height:120px;margin-top:20px;padding:12px;border:1px solid #1720331f;border-bottom:3px solid #2d5ea8;font:700 1.05rem Arial}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.actions button,button{min-height:42px;padding:9px 16px;border:1px solid #aa151b;background:#aa151b;color:#fff;font-weight:900;cursor:pointer}.actions .secondary{background:#fff;color:#aa151b}.feedback,.key{min-height:48px;margin-top:16px;padding:12px 14px;background:#f4efe4;font-weight:750}.feedback.ok{background:#ecfdf3;color:#17603f}.feedback.bad{background:#fff1f0;color:#8e1116}.key{border-left:4px solid #2d7a5b;background:#ecfdf3}.key[hidden],.done[hidden],.question[hidden]{display:none}.done{text-align:center}.repeat{margin-top:16px}@media(max-width:560px){.actions{display:grid}.actions button{width:100%}}</style></head><body><main><header><p class="course">Curso de Español · Lección 6 · Practicamos</p><h1>Practicamos</h1><p class="sub">Querer y poder + infinitivo</p></header><section class="shell"><div class="question" data-question><p class="progress" data-progress></p><p class="prompt" data-prompt></p><textarea class="answer" data-answer aria-label="Escribe tu respuesta"></textarea><div class="actions"><button type="button" data-check>COMPROBAR</button><button class="secondary" type="button" data-show>VER RESPUESTA</button></div><p class="feedback" aria-live="polite" data-feedback>Escribe tu respuesta.</p><p class="key" data-key hidden></p></div><div class="done" hidden><h2>¡Práctica terminada!</h2><p>Con querer y poder, el segundo verbo va en infinitivo.</p><button class="repeat" type="button" data-repeat>REPETIR</button></div></section></main><script>(()=>{const items=[['Yo ______ viajar mañana. (querer)',['quiero','yo quiero viajar mañana.'],'Correcto. Después de querer usamos el infinitivo.'],['Nosotros ______ trabajar hoy. (poder)',['podemos','nosotros podemos trabajar hoy.'],'Correcto. Después de poder usamos el infinitivo.'],['Marta / querer / aprender / español',['marta quiere aprender español.'],'Correcto. Solo querer se conjuga.'],['yo / no / poder / venir / hoy',['yo no puedo venir hoy.','no puedo venir hoy.'],'Correcto. La negativa va delante del verbo conjugado.'],['Tú quieres comer ahora. → pregunta',['¿quieres comer ahora?','quieres comer ahora?','¿tú quieres comer ahora?','tú quieres comer ahora?','¿quieres tú comer ahora?','quieres tú comer ahora?'],'Correcto. Después de querer usamos el infinitivo.'],['Yo puedo trabajar mañana. → nosotros',['nosotros podemos trabajar mañana.','podemos trabajar mañana.'],'Correcto. Con nosotros: podemos trabajar.'],['¿Cuál es correcta? A. Quiero viajo mañana. B. Quiero viajar mañana.',['b','b. quiero viajar mañana.','quiero viajar mañana.'],'Correcto. El segundo verbo va en infinitivo.'],['¿Cuál es correcta? A. Podemos trabajamos hoy. B. Podemos trabajar hoy.',['b','b. podemos trabajar hoy.','podemos trabajar hoy.'],'Correcto. El segundo verbo va en infinitivo.']];let index=0;const progress=document.querySelector('[data-progress]'),prompt=document.querySelector('[data-prompt]'),answer=document.querySelector('[data-answer]'),check=document.querySelector('[data-check]'),show=document.querySelector('[data-show]'),feedback=document.querySelector('[data-feedback]'),key=document.querySelector('[data-key]'),question=document.querySelector('.question'),done=document.querySelector('.done');const clean=v=>v.trim().toLocaleLowerCase('es-ES').replace(/^[¿¡]+/g,'').replace(/[.!?]+$/g,'').replace(/\s+/g,' ');function render(){progress.textContent=`Ejercicio ${index+1} de ${items.length}`;prompt.textContent=items[index][0];answer.value='';answer.disabled=false;check.disabled=false;show.disabled=false;feedback.className='feedback';feedback.textContent='Escribe tu respuesta.';key.hidden=true}function reveal(){key.textContent=`Respuesta posible: ${items[index][1][0]}`;key.hidden=false}function verify(){const item=items[index],value=clean(answer.value);if(!value){feedback.className='feedback bad';feedback.textContent='Escribe una respuesta antes de comprobar.';return}const ok=item[1].some(v=>clean(v)===value);feedback.className=`feedback ${ok?'ok':'bad'}`;feedback.textContent=ok?item[2]:'Revisa la conjugación de querer o poder y deja el segundo verbo en infinitivo.';reveal();if(ok){answer.disabled=true;check.disabled=true;show.disabled=true;setTimeout(()=>{index++;if(index===items.length){question.hidden=true;done.hidden=false}else render()},850)}}check.addEventListener('click',verify);show.addEventListener('click',reveal);document.querySelector('[data-repeat]').addEventListener('click',()=>{index=0;done.hidden=true;question.hidden=false;render()});render()})();</script></body></html>
