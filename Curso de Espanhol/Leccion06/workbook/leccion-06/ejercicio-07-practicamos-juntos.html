<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook · Lección 6 · Practicamos juntos</title><style>:root{--r:#aa151b;--i:#172033;--m:#667085;--s:#f4efe4;--l:#1720331f;--g:#2d7a5b;--b:#2d5ea8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,#f7f1e5);color:var(--i);font-family:Arial,Helvetica,sans-serif}main{width:min(92%,980px);margin:auto;padding:34px 0}header{border-bottom:2px solid #aa151b33;padding-bottom:14px}.course{margin:0;color:var(--r);font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{margin:10px 0 5px;font:700 clamp(2rem,5vw,3.5rem) Georgia,"Times New Roman",serif}.sub{margin:0;color:var(--m);font-weight:700}.shell{margin-top:24px;padding:clamp(22px,4vw,42px);border-left:5px solid #f1bf00;background:#fffffff5;box-shadow:0 12px 28px #141c261a}.progress{margin:0 0 14px;color:var(--m);font-weight:800}.prompt{margin:0;font:700 clamp(1.2rem,2.8vw,1.9rem) Georgia,"Times New Roman",serif;line-height:1.35}.answer{width:100%;min-height:110px;margin-top:20px;padding:12px;border:1px solid var(--l);border-bottom:3px solid var(--b);font:700 1.05rem Arial}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.actions button,button{min-height:42px;padding:9px 16px;border:1px solid var(--r);background:var(--r);color:#fff;font-weight:900;cursor:pointer}.actions .secondary{background:#fff;color:var(--r)}.feedback,.revealed{min-height:48px;margin-top:16px;padding:12px 14px;background:var(--s);font-weight:750;line-height:1.4}.feedback.ok{background:#ecfdf3;color:#17603f}.feedback.bad{background:#fff1f0;color:#8e1116}.revealed{border-left:4px solid var(--g);background:#ecfdf3}.revealed[hidden],.question[hidden],.done[hidden]{display:none}.next{display:block;margin:14px 0 0 auto}.done{text-align:center}.done h2{font-family:Georgia,"Times New Roman",serif}.repeat{margin-top:16px}@media(max-width:560px){.actions{display:grid}.actions button{width:100%}}
</style></head><body><main><header><p class="course">Curso de Español · Lección 6 · Consolidación</p><h1>Practicamos juntos</h1><p class="sub">Repasamos toda la lección · Lee la frase completa en voz alta.</p></header><section class="shell"><div class="question" data-question><p class="progress" data-progress></p><p class="prompt" data-prompt></p><textarea class="answer" data-answer aria-label="Escribe la forma verbal o la frase completa"></textarea><div class="actions"><button type="button" data-check>COMPROBAR</button><button class="secondary" type="button" data-show>VER RESPUESTA</button></div><p class="feedback" aria-live="polite" data-feedback>Escribe la forma verbal o la frase completa.</p><p class="revealed" data-revealed hidden></p><button class="next" type="button" data-next hidden>SIGUIENTE</button></div><div class="done" hidden><h2>¡Repaso terminado!</h2><p>Lee las frases una vez más y compártelas con la clase.</p><button class="repeat" type="button" data-repeat>REPETIR</button></div></section></main><script>(()=>{const items=[['Yo ______ viajar a España el próximo año porque quiero practicar más español. (querer)',['quiero','yo quiero viajar a españa el próximo año porque quiero practicar más español.'],'Correcto. Querer cambia e → ie: quiero.'],['Nosotros ______ trabajar mañana por la mañana, pero por la tarde estamos libres. (poder)',['podemos','nosotros podemos trabajar mañana por la mañana, pero por la tarde estamos libres.'],'Correcto. Con nosotros usamos podemos.'],['Marta ______ ocho horas cada noche porque empieza a trabajar muy temprano. (dormir)',['duerme','marta duerme ocho horas cada noche porque empieza a trabajar muy temprano.'],'Revisa la raíz: dormir → duerme.'],['Ellos ______ la comida en este restaurante porque siempre comen aquí los viernes. (pedir)',['piden','ellos piden la comida en este restaurante porque siempre comen aquí los viernes.'],'Correcto. Pedir cambia e → i: piden.'],['Yo ______ una reunión importante hoy a las nueve de la mañana. (tener)',['tengo','yo tengo una reunión importante hoy a las nueve de la mañana.'],'Tener tiene una forma especial en yo: tengo.'],['¿Qué ______ tú por la mañana antes de empezar a trabajar o estudiar? (hacer)',['haces','¿qué haces tú por la mañana antes de empezar a trabajar o estudiar?'],'Correcto. La forma de tú es haces.'],['Carlos ______ de la oficina a las seis y después vuelve directamente a casa. (salir)',['sale','carlos sale de la oficina a las seis y después vuelve directamente a casa.'],'Correcto. Salir en él: sale.'],['Marta ______ a clase todos los jueves porque estudia español después del trabajo. (venir)',['viene','marta viene a clase todos los jueves porque estudia español después del trabajo.'],'Correcto. Venir cambia la raíz: viene.'],['Nosotros ______ café por la mañana, pero por la tarde normalmente bebemos té. (preferir)',['preferimos','nosotros preferimos café por la mañana, pero por la tarde normalmente bebemos té.'],'Con nosotros no cambia la raíz: preferimos.'],['Ella no ______ venir hoy porque trabaja hasta muy tarde. (poder)',['puede','ella no puede venir hoy porque trabaja hasta muy tarde.'],'Correcto. Poder cambia o → ue: puede.'],['Yo no ______ bien esta explicación, así que necesito leer el ejemplo otra vez. (entender)',['entiendo','yo no entiendo bien esta explicación, así que necesito leer el ejemplo otra vez.'],'Correcto. Entender cambia e → ie: entiendo.'],['Pedro ______ en su trabajo cuando prepara su agenda para la semana. (pensar)',['piensa','pedro piensa en su trabajo cuando prepara su agenda para la semana.'],'Correcto. Pensar cambia e → ie: piensa.'],['Nosotros ______ a casa a las siete después de terminar todas las actividades del día. (volver)',['volvemos','nosotros volvemos a casa a las siete después de terminar todas las actividades del día.'],'Con nosotros: volvemos.'],['Mis compañeros ______ a la una porque tienen una reunión a las dos. (almorzar)',['almuerzan','mis compañeros almuerzan a la una porque tienen una reunión a las dos.'],'Almorzar cambia o → ue: almuerzan.'],['Vosotros ______ la actividad otra vez porque queréis comprobar todas las respuestas. (repetir)',['repetís','vosotros repetís la actividad otra vez porque queréis comprobar todas las respuestas.'],'Con vosotros: repetís, con acento.'],['¿Tú ______ aprender más español para hablar con tus compañeros y viajar con más confianza? (querer)',['quieres','¿tú quieres aprender más español para hablar con tus compañeros y viajar con más confianza?'],'Correcto. Querer cambia e → ie: quieres.']];let index=0;const progress=document.querySelector('[data-progress]'),prompt=document.querySelector('[data-prompt]'),answer=document.querySelector('[data-answer]'),check=document.querySelector('[data-check]'),show=document.querySelector('[data-show]'),feedback=document.querySelector('[data-feedback]'),revealed=document.querySelector('[data-revealed]'),next=document.querySelector('[data-next]'),question=document.querySelector('[data-question]'),done=document.querySelector('.done');const clean=v=>v.trim().toLocaleLowerCase('es-ES').replace(/^[¿¡]+/g,'').replace(/[.!?]+$/g,'').replace(/\s+/g,' ');function render(){progress.textContent=`Ejercicio ${index+1} de ${items.length}`;prompt.textContent=items[index][0];answer.value='';answer.disabled=false;check.disabled=false;show.disabled=false;next.hidden=true;revealed.hidden=true;feedback.className='feedback';feedback.textContent='Escribe la forma verbal o la frase completa.'}function reveal(){revealed.textContent=`Frase completa: ${items[index][1][1]}`;revealed.hidden=false}function verify(){const item=items[index],value=clean(answer.value);if(!value){feedback.className='feedback bad';feedback.textContent='Escribe una respuesta antes de comprobar.';return}const ok=item[1].some(v=>clean(v)===value);feedback.className=`feedback ${ok?'ok':'bad'}`;feedback.textContent=ok?item[2]:'Revisa la forma verbal y vuelve a intentarlo.';if(ok){reveal();answer.disabled=true;check.disabled=true;show.disabled=true;next.hidden=false}}check.addEventListener('click',verify);show.addEventListener('click',reveal);next.addEventListener('click',()=>{index++;if(index===items.length){question.hidden=true;done.hidden=false}else render()});document.querySelector('[data-repeat]').addEventListener('click',()=>{index=0;done.hidden=true;question.hidden=false;render()});render()})();</script></body></html>
