<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbook · Lección 6 · Conjugación reflexiva</title><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:linear-gradient(135deg,#fff,#f7f1e5)}main{width:min(92%,820px);margin:auto;padding:34px 0}header{border-bottom:2px solid #aa151b33;padding-bottom:12px}.course{margin:0;color:#aa151b;font-size:.8rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}h1{margin:9px 0 5px;font-size:clamp(2rem,5vw,3rem)}.sub{margin:0;color:#667085;font-weight:650}.shell{margin-top:24px;padding:clamp(22px,5vw,42px);border-top:6px solid #f1bf00;border-radius:18px;background:#fff;box-shadow:0 15px 35px #17203318}.progress{color:#667085;font-weight:800}.question{font-size:clamp(1.35rem,4vw,2.1rem);font-weight:850;line-height:1.3}.answer{width:100%;min-height:57px;border:2px solid #17203322;border-radius:12px;padding:10px 14px;font:inherit;font-size:1.15rem;font-weight:750}.answer.correct{border-color:#2d7a5b;background:#ecfdf3}.answer.incorrect{border-color:#b42318;background:#fff1f0}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}button{min-height:46px;border:0;border-radius:11px;padding:10px 16px;background:#aa151b;color:#fff;font-weight:900;cursor:pointer}.feedback{min-height:46px;margin-top:15px;padding:12px;border-radius:11px;background:#f4efe4;font-weight:750}.done{text-align:center}.done[hidden],.question-wrap[hidden]{display:none}.repeat{margin-top:12px}@media(max-width:500px){.actions button{width:100%}}</style></head><body><main><header><p class="course">Curso de Español · Lección 6 · Práctica 2</p><h1>Conjugación reflexiva</h1><p class="sub">Escribe la forma completa del verbo entre paréntesis.</p></header><section class="shell"><div class="question-wrap"><p class="progress" data-progress></p><p class="question" data-question></p><input class="answer" data-answer aria-label="Tu respuesta" autocomplete="off"><div class="actions"><button type="button" data-check>COMPROBAR</button></div><p class="feedback" aria-live="polite" data-feedback>Escribe una respuesta y comprueba.</p></div><div class="done" hidden><h2>¡Actividad terminada!</h2><p>Has practicado la conjugación de verbos reflexivos.</p><button class="repeat" type="button" data-repeat>REPETIR EJERCICIO</button></div></section></main><script>(()=>{const items=[['Yo ___ a las siete. (levantarse)',['me levanto','yo me levanto']],['Tú ___ antes de cenar. (ducharse)',['te duchas','tú te duchas']],['Ana ___ muy rápido. (vestirse)',['se viste','ana se viste']],['Nosotros ___ tarde. (acostarse)',['nos acostamos','nosotros nos acostamos']]];let i=0;const q=document.querySelector('[data-question]'),a=document.querySelector('[data-answer]'),p=document.querySelector('[data-progress]'),f=document.querySelector('[data-feedback]'),w=document.querySelector('.question-wrap'),d=document.querySelector('.done');const normal=s=>s.toLowerCase().trim().replace(/[.¡!]/g,'');function render(){p.textContent=`Pregunta ${i+1} de ${items.length}`;q.textContent=items[i][0];a.value='';a.className='answer';f.textContent='Escribe una respuesta y comprueba.';a.focus()}function check(){const valid=items[i][1].map(normal),value=normal(a.value);if(!value){f.textContent='Escribe una respuesta antes de comprobar.';a.classList.add('incorrect');return}if(valid.includes(value)){a.classList.add('correct');f.textContent='Correcto.'}else{a.classList.add('incorrect');f.textContent=`Todavía no. Modelo: “${items[i][1][0]}”.`}setTimeout(()=>{i++;if(i===items.length){w.hidden=true;d.hidden=false}else render()},1100)}document.querySelector('[data-check]').addEventListener('click',check);a.addEventListener('input',()=>a.className='answer');a.addEventListener('keydown',e=>{if(e.key==='Enter')check()});document.querySelector('[data-repeat]').addEventListener('click',()=>{i=0;d.hidden=true;w.hidden=false;render()});render()})();</script></body></html>
