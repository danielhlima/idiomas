<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Exercise 8.7: transforma adjetivos en adverbios terminados en -mente.">
  <title>Exercise 8.7 · Adverbios en -mente</title>
  <style>
    :root { --red:#aa151b; --gold:#f1bf00; --ink:#172033; --muted:#667085; --paper:#fffdf8; --soft:#f4efe4; --line:rgba(23,32,51,.12); --green:#2d7a5b; --blue:#2d5ea8; --focus:rgba(45,94,168,.38); --font-scale:1; --shadow:0 12px 28px rgba(20,28,38,.1); }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#fff,var(--soft)); color:var(--ink); font-family:Arial,Helvetica,sans-serif; font-size:calc(1rem * var(--font-scale)); line-height:1.5; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.58; }
    [hidden] { display:none !important; }
    main { margin:0 auto; max-width:1000px; padding:28px 0 42px; width:min(92%,1000px); }
    header { border-bottom:2px solid rgba(170,21,27,.2); padding-bottom:16px; }
    .course { color:var(--red); font-size:.8rem; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
    h1,h2 { font-family:Georgia,"Times New Roman",serif; line-height:1.05; }
    h1 { font-size:clamp(2rem,5vw,3.5rem); margin:10px 0 6px; }
    h2 { font-size:clamp(1.6rem,4vw,2.4rem); margin:0 0 10px; }
    .sub { color:var(--muted); font-weight:700; margin:0; }
    .font-controls { align-items:center; display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .font-controls button { background:#fff; border:1px solid var(--line); border-radius:5px; color:var(--ink); min-height:40px; min-width:44px; padding:6px 9px; }
    .font-controls button[aria-pressed="true"] { background:var(--red); border-color:var(--red); color:#fff; font-weight:900; }
    .font-controls button:focus-visible,.answer-input:focus-visible,.answer-form button:focus-visible,.repeat:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .shell { background:rgba(255,255,255,.96); border-left:5px solid var(--gold); box-shadow:var(--shadow); margin-top:20px; padding:clamp(22px,4vw,42px); }
    .question-wrap { display:grid; gap:16px; }
    .progress { color:var(--muted); font-weight:800; margin:0; }
    .progress-track { background:var(--soft); border-radius:999px; height:10px; overflow:hidden; }
    .progress-track span { background:linear-gradient(90deg,var(--red),var(--gold)); display:block; height:100%; transition:width .2s ease; width:0; }
    .item-type { color:var(--red); font-size:.78rem; font-weight:900; letter-spacing:.11em; margin:0; text-transform:uppercase; }
    .instruction { color:var(--muted); font-weight:700; margin:0; }
    .prompt { display:grid; gap:12px; }
    .base-word { color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:clamp(2.2rem,7vw,4rem); font-weight:700; line-height:1.15; overflow-wrap:anywhere; }
    .answer-label { color:var(--muted); font-size:.95rem; font-weight:800; }
    .answer-input { background:#fff; border:1px solid var(--line); border-bottom:3px solid var(--blue); border-radius:3px; color:var(--ink); font-size:clamp(1.25rem,4vw,1.8rem); font-weight:700; min-height:3.3rem; padding:.45rem .65rem; width:min(100%,28rem); }
    .answer-input.is-correct { background:#ecfdf3; border-color:var(--green); }
    .answer-input.is-incorrect { background:#fff1f0; border-color:var(--red); }
    .answer-input:disabled { color:var(--ink); opacity:1; }
    .answer-form { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
    .answer-form button,.repeat { background:var(--red); border:1px solid var(--red); color:#fff; font-weight:900; min-height:46px; padding:9px 16px; }
    .answer-form [data-show-answer] { background:#fff; color:var(--red); }
    .feedback { background:var(--soft); line-height:1.4; margin:0; min-height:48px; padding:12px 14px; }
    .feedback.correct { background:#ecfdf3; color:#17603f; }
    .feedback.incorrect { background:#fff1f0; color:#8e1116; }
    .done { text-align:center; }
    .done > p { color:var(--muted); font-weight:700; }
    .result-summary { display:grid; gap:8px; margin:18px auto; max-width:36rem; text-align:left; }
    .result-summary p { border-bottom:1px solid var(--line); margin:0; padding:8px 0; }
    .result-summary strong { color:var(--red); }
    .performance { color:var(--muted); font-weight:800; }
    .repeat { margin-top:10px; }
    @media(max-width:560px) { main { padding-top:18px; } .answer-form { display:grid; } .answer-form button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="course">Curso de Español · Lección 8 · Práctica</p>
      <h1>Exercise 8.7 · Adverbios en -mente</h1>
      <p class="sub">Transforma los siguientes adjetivos en su forma adverbial correspondiente.</p>
      <div class="font-controls" role="group" aria-label="Controles de tamaño del texto">
        <button type="button" data-font="small" aria-label="Reducir tamaño del texto" aria-pressed="false">A−</button>
        <button type="button" data-font="normal" aria-label="Tamaño normal del texto" aria-pressed="true">A</button>
        <button type="button" data-font="large" aria-label="Aumentar tamaño del texto" aria-pressed="false">A+</button>
      </div>
    </header>
    <section class="shell" aria-label="Ejercicio de formación de adverbios">
      <div class="question-wrap" data-question-wrap>
        <p class="progress" data-progress aria-live="polite"></p>
        <div class="progress-track" role="progressbar" data-exercise-progress aria-label="Progreso del ejercicio" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><span></span></div>
        <p class="item-type">Transformación · Escribe la forma adverbial</p>
        <div class="prompt" data-prompt>
          <label class="answer-label" for="answer-input">Forma adverbial de:</label>
          <p class="base-word" data-base-word id="base-word">sincero</p>
          <input class="answer-input" id="answer-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="answer-feedback" placeholder="Escribe tu respuesta">
        </div>
        <form class="answer-form" data-answer-form novalidate>
          <button type="button" data-show-answer>VER RESPUESTA</button>
          <button type="submit" data-submit>COMPROBAR</button>
        </form>
        <p class="feedback" id="answer-feedback" data-feedback aria-live="polite">Escribe la forma adverbial y comprueba tu respuesta.</p>
      </div>
      <div class="done" data-done hidden>
        <h2>¡Ejercicio terminado!</h2>
        <p class="performance" data-performance></p>
        <div class="result-summary" data-summary aria-live="polite"></div>
        <button class="repeat" type="button" data-repeat>REPETIR EJERCICIO</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const BEST_SCORE_KEY = "workbook-leccion-08-ejercicio-08-07-best-precision";
      const items = [
        { adjective: "sincero", answer: "sinceramente", hint: "Recuerda: forma femenina + -mente.", intermediate: "sincera" },
        { adjective: "loco", answer: "locamente", hint: "Recuerda: forma femenina + -mente.", intermediate: "loca" },
        { adjective: "total", answer: "totalmente", hint: "Si el adjetivo no cambia de género, añade -mente directamente." },
        { adjective: "verdadero", answer: "verdaderamente", hint: "Recuerda: forma femenina + -mente.", intermediate: "verdadera" },
        { adjective: "inocente", answer: "inocentemente", hint: "Si el adjetivo no cambia de género, añade -mente directamente." },
        { adjective: "cariñoso", answer: "cariñosamente", hint: "Recuerda: forma femenina + -mente.", intermediate: "cariñosa", checkEnye: true },
        { adjective: "completo", answer: "completamente", hint: "Recuerda: forma femenina + -mente.", intermediate: "completa" },
        { adjective: "normal", answer: "normalmente", hint: "Si el adjetivo no cambia de género, añade -mente directamente." }
      ];
      const progress = document.querySelector("[data-progress]");
      const progressBar = document.querySelector("[data-exercise-progress]");
      const baseWord = document.querySelector("[data-base-word]");
      const input = document.querySelector("#answer-input");
      const form = document.querySelector("[data-answer-form]");
      const showAnswerButton = document.querySelector("[data-show-answer]");
      const submitButton = document.querySelector("[data-submit]");
      const feedback = document.querySelector("[data-feedback]");
      const wrap = document.querySelector("[data-question-wrap]");
      const done = document.querySelector("[data-done]");
      const summary = document.querySelector("[data-summary]");
      const performance = document.querySelector("[data-performance]");
      let index = 0;
      let errors = 0;
      let attempts = 0;
      let completed = 0;
      let accepted = false;

      function normalize(value) { return value.trim().toLocaleLowerCase("es-ES"); }
      function updateProgress() {
        progress.textContent = "Ejercicio " + (index + 1) + " de " + items.length + " · Completados: " + completed + " de " + items.length;
        progressBar.setAttribute("aria-valuenow", String(completed));
        progressBar.firstElementChild.style.width = ((completed / items.length) * 100) + "%";
      }
      function clearFeedback() {
        if (accepted || input.disabled) return;
        input.classList.remove("is-correct", "is-incorrect");
        input.removeAttribute("aria-invalid");
        feedback.textContent = "Respuesta actualizada. Pulsa COMPROBAR.";
        feedback.className = "feedback";
      }
      function render() {
        baseWord.textContent = items[index].adjective;
        input.value = "";
        input.disabled = false;
        input.classList.remove("is-correct", "is-incorrect");
        input.removeAttribute("aria-invalid");
        accepted = false;
        showAnswerButton.disabled = false;
        submitButton.textContent = "COMPROBAR";
        feedback.textContent = "Escribe la forma adverbial y comprueba tu respuesta.";
        feedback.className = "feedback";
        updateProgress();
      }
      function feedbackForError(item, value) {
        if (item.checkEnye && value.includes("carinosamente")) return "Revisa la ñ.";
        if (item.intermediate && value === item.intermediate) return "Primero forma el femenino del adjetivo y añade -mente.";
        if (item.intermediate && value.startsWith(item.intermediate)) return "Recuerda: forma femenina + -mente.";
        if (!item.intermediate && value === item.adjective) return "Si el adjetivo no cambia de género, añade -mente directamente.";
        return "Revisa la ortografía. " + item.hint;
      }
      function showSummary() {
        const precision = attempts ? Math.round((completed / attempts) * 100) : 0;
        let bestPrecision = 0;
        try { bestPrecision = Number(localStorage.getItem(BEST_SCORE_KEY)) || 0; } catch (error) { bestPrecision = 0; }
        bestPrecision = Math.max(bestPrecision, precision);
        try { localStorage.setItem(BEST_SCORE_KEY, String(bestPrecision)); } catch (error) { /* El ejercicio funciona aunque el almacenamiento no esté disponible. */ }
        const rows = [
          ["Ejercicios completados", completed + " / " + items.length],
          ["Errores cometidos", String(errors)],
          ["Intentos totales", String(attempts)],
          ["Precisión", precision + "%"],
          ["Mejor precisión", bestPrecision + "%"]
        ];
        summary.replaceChildren(...rows.map(([label, value]) => {
          const row = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = label + ": ";
          row.append(strong, document.createTextNode(value));
          return row;
        }));
        performance.textContent = precision >= 90 ? "Desempeño excelente." : precision >= 70 ? "Buen trabajo. Sigue practicando." : "Sigue practicando para mejorar tu precisión.";
        wrap.hidden = true;
        done.hidden = false;
        document.querySelector("[data-repeat]").focus();
      }
      input.addEventListener("input", clearFeedback);
      showAnswerButton.addEventListener("click", () => {
        if (accepted) return;
        input.value = items[index].answer;
        input.classList.remove("is-correct", "is-incorrect");
        input.removeAttribute("aria-invalid");
        feedback.textContent = "Respuesta mostrada. Pulsa COMPROBAR para validarla.";
        feedback.className = "feedback";
        submitButton.focus();
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (accepted) {
          if (index === items.length - 1) showSummary();
          else { index += 1; render(); input.focus(); }
          return;
        }
        attempts += 1;
        const item = items[index];
        const value = normalize(input.value);
        if (value === normalize(item.answer)) {
          completed += 1;
          updateProgress();
          accepted = true;
          input.classList.remove("is-incorrect");
          input.classList.add("is-correct");
          input.removeAttribute("aria-invalid");
          input.disabled = true;
          showAnswerButton.disabled = true;
          feedback.textContent = "Correcto. Ahora puedes continuar.";
          feedback.className = "feedback correct";
          submitButton.textContent = index === items.length - 1 ? "VER RESULTADOS" : "SIGUIENTE";
          return;
        }
        errors += 1;
        input.classList.remove("is-correct");
        input.classList.add("is-incorrect");
        input.setAttribute("aria-invalid", "true");
        feedback.textContent = feedbackForError(item, value);
        feedback.className = "feedback incorrect";
        input.focus();
      });
      document.querySelector("[data-repeat]").addEventListener("click", () => {
        index = 0;
        errors = 0;
        attempts = 0;
        completed = 0;
        accepted = false;
        done.hidden = true;
        wrap.hidden = false;
        render();
        input.focus();
      });
      document.querySelectorAll("[data-font]").forEach((button) => {
        button.addEventListener("click", () => {
          const size = button.dataset.font;
          document.documentElement.style.setProperty("--font-scale", size === "small" ? ".9" : size === "large" ? "1.16" : "1");
          document.querySelectorAll("[data-font]").forEach((control) => control.setAttribute("aria-pressed", String(control === button)));
        });
      });
      render();
      input.focus();
    })();
  </script>
</body>
</html>
