<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ejercicio 8.2 de adjetivos demostrativos.">
  <title>Ejercicio 8.2 · Adjetivos demostrativos</title>
  <style>
    :root { --red:#aa151b; --gold:#f1bf00; --ink:#172033; --muted:#667085; --paper:#fffdf8; --soft:#f4efe4; --line:rgba(23,32,51,.12); --green:#2d7a5b; --blue:#2d5ea8; --focus:rgba(45,94,168,.38); --font-scale:1; --shadow:0 12px 28px rgba(20,28,38,.1); }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(135deg,#fff,var(--soft)); color:var(--ink); font-family:Arial,Helvetica,sans-serif; font-size:calc(1rem * var(--font-scale)); line-height:1.5; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    [hidden] { display:none !important; }
    .sr-only { height:1px; margin:-1px; overflow:hidden; padding:0; position:absolute; width:1px; clip:rect(0,0,0,0); white-space:nowrap; }
    main { margin:0 auto; max-width:960px; padding:28px 0 42px; width:min(92%,960px); }
    header { border-bottom:2px solid rgba(170,21,27,.2); padding-bottom:16px; }
    .course { color:var(--red); font-size:.8rem; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
    h1,h2 { font-family:Georgia,"Times New Roman",serif; line-height:1.05; }
    h1 { font-size:clamp(2rem,5vw,3.5rem); margin:10px 0 6px; }
    h2 { font-size:clamp(1.6rem,4vw,2.4rem); margin:0 0 10px; }
    .sub { color:var(--muted); font-weight:700; margin:0; }
    .font-controls { align-items:center; display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .font-controls button { background:#fff; border:1px solid var(--line); border-radius:5px; color:var(--ink); min-height:40px; min-width:44px; padding:6px 9px; }
    .font-controls button[aria-pressed="true"] { background:var(--red); border-color:var(--red); color:#fff; font-weight:900; }
    .font-controls button:focus-visible, .answer-form input:focus-visible, .answer-form button:focus-visible, .repeat:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .shell { background:rgba(255,255,255,.96); border-left:5px solid var(--gold); box-shadow:var(--shadow); margin-top:20px; padding:clamp(22px,4vw,42px); }
    .question-wrap { display:grid; gap:16px; }
    .progress { color:var(--muted); font-weight:800; margin:0; }
    .progress-track { background:var(--soft); border-radius:999px; height:10px; overflow:hidden; }
    .progress-track span { background:linear-gradient(90deg,var(--red),var(--gold)); display:block; height:100%; transition:width .2s ease; width:0; }
    .item-type { color:var(--red); font-size:.78rem; font-weight:900; letter-spacing:.11em; margin:0; text-transform:uppercase; }
    .prompt { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:.2em; row-gap:.35em; font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.4rem,3.5vw,2.15rem); font-weight:700; line-height:1.35; margin:0; }
    .prompt input { background:#fff; border:1px solid var(--line); border-bottom:3px solid var(--blue); border-radius:3px; color:var(--ink); font-family:Arial,Helvetica,sans-serif; font-size:.78em; font-weight:700; min-height:2.2em; min-width:5.6em; padding:.2em .35em; text-align:center; }
    .prompt input.is-correct { background:#ecfdf3; border-color:var(--green); }
    .prompt input.is-incorrect { background:#fff1f0; border-color:var(--red); }
    .clue { color:var(--muted); font-size:.92rem; font-weight:700; margin:0; }
    .instruction { color:var(--muted); font-weight:700; margin:0; }
    .answer-form { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
    .answer-form button,.repeat { background:var(--red); border:1px solid var(--red); color:#fff; font-weight:900; min-height:46px; padding:9px 16px; }
    .answer-form [data-show-answers] { background:#fff; color:var(--red); }
    .feedback { background:var(--soft); line-height:1.4; margin:0; min-height:48px; padding:12px 14px; }
    .feedback.correct { background:#ecfdf3; color:#17603f; }
    .feedback.incorrect { background:#fff1f0; color:#8e1116; }
    .done { text-align:center; }
    .done > p { color:var(--muted); font-weight:700; }
    .result-summary { display:grid; gap:8px; margin:18px auto; max-width:34rem; text-align:left; }
    .result-summary p { border-bottom:1px solid var(--line); margin:0; padding:8px 0; }
    .result-summary strong { color:var(--red); }
    .performance { color:var(--muted); font-weight:800; }
    .repeat { margin-top:10px; }
    @media(max-width:560px) { main { padding-top:18px; } .prompt { column-gap:.12em; } .prompt input { min-width:4.9em; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="course">Curso de Español · Lección 8 · Práctica</p>
      <h1>Ejercicio 8.2 · Adjetivos demostrativos</h1>
      <p class="sub">Completa las frases usando el adjetivo demostrativo correcto.</p>
      <div class="font-controls" role="group" aria-label="Controles de tamaño del texto">
        <button type="button" data-font="small" aria-label="Reducir tamaño del texto" aria-pressed="false">A−</button>
        <button type="button" data-font="normal" aria-label="Tamaño normal del texto" aria-pressed="true">A</button>
        <button type="button" data-font="large" aria-label="Aumentar tamaño del texto" aria-pressed="false">A+</button>
      </div>
    </header>
    <section class="shell" aria-label="Actividad de completar frases">
      <div class="question-wrap" data-question-wrap>
        <p class="progress" data-progress aria-live="polite"></p>
        <div class="progress-track" role="progressbar" data-exercise-progress aria-label="Progreso del ejercicio" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><span></span></div>
        <p class="item-type">Completa</p>
        <div class="prompt" data-prompt aria-label="Frase para completar"></div>
        <p class="clue"><span>Pista: </span><span lang="pt-BR" data-clue></span></p>
        <p class="instruction">Escribe la forma correcta en cada espacio y pulsa COMPROBAR.</p>
        <form class="answer-form" data-answer-form novalidate>
          <button type="button" data-show-answers>VER RESPUESTAS</button>
          <button type="submit" data-submit>COMPROBAR</button>
        </form>
        <p class="feedback" id="answer-feedback" data-feedback aria-live="polite">Completa los espacios y comprueba tus respuestas.</p>
      </div>
      <div class="done" data-done hidden>
        <h2>¡Ejercicio terminado!</h2>
        <p class="performance" data-performance></p>
        <div class="result-summary" data-summary aria-live="polite"></div>
        <button class="repeat" type="button" data-repeat>REPETIR EJERCICIO</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const BEST_SCORE_KEY = "workbook-leccion-08-ejercicio-08-02-best-precision";
      const items = [
        { sentence: "______ revista que tú lees es interesante, pero ______ artículo tiene más información.", clue: "(este / esse)", answers: ["esta", "ese"], hints: ["Revisa el género del sustantivo.", "Recuerda: el demostrativo concuerda con el sustantivo."] },
        { sentence: "¿Piensa Ud. que ______ camisas son hermosas, o prefiere Ud. ______ camisas azules?", clue: "(estes / esses)", answers: ["estas", "esas"], hints: ["Revisa el género y el número del sustantivo.", "Revisa la distancia y el número del sustantivo."] },
        { sentence: "¿En qué sitio prefieren Uds. comer, en ______ restaurante o en ______ cafetería?", clue: "(aquele ali / aquela ali)", answers: ["aquel", "aquella"], hints: ["¿Está lejos de ambos? Revisa el género del sustantivo.", "Recuerda: el demostrativo concuerda con el sustantivo."] },
        { sentence: "______ falda es bonita, pero voy a comprar ______ pantalones porque son más cómodos.", clue: "(este / esses)", answers: ["esta", "esos"], hints: ["Revisa el género del sustantivo.", "Revisa el género y el número del sustantivo."] },
        { sentence: "______ mujeres corren en el maratón.", clue: "(aquelas lá)", answers: ["aquellas"], hints: ["¿Está cerca, más lejos o lejos de ambos?", "Revisa el número del sustantivo."] },
        { sentence: "¿Por qué mira Ud. ______ programas en televisión si son repeticiones?", clue: "(esses)", answers: ["esos"], hints: ["Revisa el género y el número del sustantivo.", "Revisa la distancia."] },
        { sentence: "______ mes va a ser maravilloso.", clue: "(este)", answers: ["este"], hints: ["Revisa el género del sustantivo.", "Recuerda: el demostrativo concuerda con el sustantivo."] }
      ];
      const progress = document.querySelector("[data-progress]");
      const progressBar = document.querySelector("[data-exercise-progress]");
      const prompt = document.querySelector("[data-prompt]");
      const clue = document.querySelector("[data-clue]");
      const form = document.querySelector("[data-answer-form]");
      const submitButton = document.querySelector("[data-submit]");
      const showAnswersButton = document.querySelector("[data-show-answers]");
      const feedback = document.querySelector("[data-feedback]");
      const wrap = document.querySelector("[data-question-wrap]");
      const done = document.querySelector("[data-done]");
      const summary = document.querySelector("[data-summary]");
      const performance = document.querySelector("[data-performance]");
      let index = 0;
      let errors = 0;
      let attempts = 0;
      let completed = 0;
      let accepted = false;

      function render() {
        const item = items[index];
        progress.textContent = "Ejercicio " + (index + 1) + " de " + items.length + " · Completados: " + completed + " de " + items.length;
        progressBar.setAttribute("aria-valuemax", String(items.length));
        progressBar.setAttribute("aria-valuenow", String(completed));
        progressBar.firstElementChild.style.width = ((completed / items.length) * 100) + "%";
        prompt.replaceChildren();
        const fragments = item.sentence.split("______");
        fragments.forEach((fragment, gapIndex) => {
          if (fragment) prompt.append(document.createTextNode(fragment));
          if (gapIndex < item.answers.length) {
            const input = document.createElement("input");
            input.type = "text";
            input.autocomplete = "off";
            input.autocapitalize = "none";
            input.spellcheck = false;
            input.required = true;
            input.dataset.gapIndex = String(gapIndex);
            input.setAttribute("aria-label", item.answers.length > 1 ? "Respuesta " + (gapIndex + 1) : "Adjetivo demostrativo");
            input.setAttribute("aria-describedby", "answer-feedback");
            input.addEventListener("input", clearGapFeedback);
            prompt.append(input);
          }
        });
        clue.textContent = item.clue;
        accepted = false;
        showAnswersButton.disabled = false;
        submitButton.textContent = "COMPROBAR";
        feedback.textContent = "Completa los espacios y comprueba tus respuestas.";
        feedback.className = "feedback";
        prompt.querySelector("input").focus();
      }
      function clearGapFeedback(event) {
        if (accepted) return;
        event.currentTarget.classList.remove("is-incorrect", "is-correct");
        event.currentTarget.removeAttribute("aria-invalid");
        feedback.textContent = "Respuesta actualizada. Pulsa COMPROBAR.";
        feedback.className = "feedback";
      }
      function showSummary() {
        const precision = attempts ? Math.round((completed / attempts) * 100) : 0;
        let bestPrecision = 0;
        try { bestPrecision = Number(localStorage.getItem(BEST_SCORE_KEY)) || 0; } catch (error) { bestPrecision = 0; }
        bestPrecision = Math.max(bestPrecision, precision);
        try { localStorage.setItem(BEST_SCORE_KEY, String(bestPrecision)); } catch (error) { /* El ejercicio funciona aunque el almacenamiento no esté disponible. */ }
        const rows = [
          ["Ejercicios completados", completed + " / " + items.length],
          ["Errores cometidos", String(errors)],
          ["Intentos totales", String(attempts)],
          ["Precisión", precision + "%"],
          ["Mejor precisión", bestPrecision + "%"]
        ];
        summary.replaceChildren(...rows.map(([label, value]) => {
          const row = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = label + ": ";
          row.append(strong, document.createTextNode(value));
          return row;
        }));
        performance.textContent = precision >= 90 ? "Desempeño excelente." : precision >= 70 ? "Buen trabajo. Sigue practicando." : "Sigue practicando para mejorar tu precisión.";
        wrap.hidden = true;
        done.hidden = false;
        document.querySelector("[data-repeat]").focus();
      }
      showAnswersButton.addEventListener("click", () => {
        if (accepted) return;
        const inputs = Array.from(prompt.querySelectorAll("input"));
        inputs.forEach((input, gapIndex) => {
          input.value = items[index].answers[gapIndex];
          input.classList.remove("is-correct", "is-incorrect");
          input.removeAttribute("aria-invalid");
        });
        feedback.textContent = "Respuestas mostradas. Pulsa COMPROBAR para validarlas.";
        feedback.className = "feedback";
        submitButton.focus();
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (accepted) {
          if (index === items.length - 1) showSummary();
          else { index += 1; render(); }
          return;
        }
        attempts += 1;
        const item = items[index];
        const inputs = Array.from(prompt.querySelectorAll("input"));
        const results = inputs.map((input, gapIndex) => input.value.trim().toLocaleLowerCase("es-ES") === item.answers[gapIndex]);
        inputs.forEach((input, gapIndex) => {
          input.classList.toggle("is-correct", results[gapIndex]);
          input.classList.toggle("is-incorrect", !results[gapIndex]);
          input.setAttribute("aria-invalid", String(!results[gapIndex]));
        });
        if (results.every(Boolean)) {
          completed += 1;
          progress.textContent = "Ejercicio " + (index + 1) + " de " + items.length + " · Completados: " + completed + " de " + items.length;
          progressBar.setAttribute("aria-valuenow", String(completed));
          progressBar.firstElementChild.style.width = ((completed / items.length) * 100) + "%";
          accepted = true;
          inputs.forEach((input) => { input.disabled = true; });
          showAnswersButton.disabled = true;
          feedback.textContent = "Correcto. El demostrativo concuerda con el sustantivo.";
          feedback.className = "feedback correct";
          submitButton.textContent = index === items.length - 1 ? "VER RESULTADOS" : "SIGUIENTE";
          return;
        }
        errors += 1;
        const emptyInput = inputs.find((input) => !input.value.trim());
        const incorrectIndexes = results.map((isCorrect, gapIndex) => isCorrect ? -1 : gapIndex).filter((gapIndex) => gapIndex >= 0);
        if (emptyInput) feedback.textContent = "Completa todos los espacios antes de comprobar.";
        else if (incorrectIndexes.length === 1 && inputs.length > 1) {
          const gapIndex = incorrectIndexes[0];
          feedback.textContent = "La respuesta " + (gapIndex + 1) + " necesita revisión. " + item.hints[gapIndex];
        } else feedback.textContent = item.hints[incorrectIndexes[0]];
        feedback.className = "feedback incorrect";
        (emptyInput || inputs[incorrectIndexes[0]]).focus();
      });
      document.querySelector("[data-repeat]").addEventListener("click", () => {
        index = 0;
        errors = 0;
        attempts = 0;
        completed = 0;
        done.hidden = true;
        wrap.hidden = false;
        render();
      });
      document.querySelectorAll("[data-font]").forEach((button) => {
        button.addEventListener("click", () => {
          const size = button.dataset.font;
          document.documentElement.style.setProperty("--font-scale", size === "small" ? ".9" : size === "large" ? "1.16" : "1");
          document.querySelectorAll("[data-font]").forEach((control) => control.setAttribute("aria-pressed", String(control === button)));
        });
      });
      render();
    })();
  </script>
</body>
</html>
