<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Repaso de vocabulario de las Lecciones 1–8.">
  <title>Vocabulario · Repaso 1</title>
  <style>
    :root { --red:#aa151b; --gold:#f1bf00; --ink:#172033; --muted:#667085; --paper:#fffdf8; --soft:#f4efe4; --line:rgba(23,32,51,.12); --green:#2d7a5b; --blue:#2d5ea8; --focus:rgba(45,94,168,.38); --font-scale:1; --shadow:0 12px 28px rgba(20,28,38,.1); }
    * { box-sizing:border-box; } [hidden] { display:none !important; }
    body { margin:0; background:linear-gradient(135deg,#fff,var(--soft)); color:var(--ink); font:calc(1rem * var(--font-scale))/1.5 Arial,Helvetica,sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.58; }
    main { margin:0 auto; max-width:1000px; padding:28px 0 42px; width:min(92%,1000px); }
    header { border-bottom:2px solid rgba(170,21,27,.2); padding-bottom:16px; }
    .course { color:var(--red); font-size:.8rem; font-weight:900; letter-spacing:.11em; text-transform:uppercase; }
    h1,h2 { font-family:Georgia,"Times New Roman",serif; line-height:1.05; } h1 { font-size:clamp(2rem,5vw,3.5rem); margin:10px 0 6px; } h2 { font-size:clamp(1.6rem,4vw,2.4rem); margin:0 0 10px; }
    .sub { color:var(--muted); font-weight:700; margin:0; }
    .font-controls { align-items:center; display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .font-controls button { background:#fff; border:1px solid var(--line); border-radius:5px; color:var(--ink); min-height:40px; min-width:44px; padding:6px 9px; }
    .font-controls button[aria-pressed="true"] { background:var(--red); border-color:var(--red); color:#fff; font-weight:900; }
    button:focus-visible,input:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .shell { background:rgba(255,255,255,.96); border-left:5px solid var(--gold); box-shadow:var(--shadow); margin-top:20px; padding:clamp(22px,4vw,42px); }
    .question-wrap { display:grid; gap:16px; } .progress { color:var(--muted); font-weight:800; margin:0; }
    .progress-track { background:var(--soft); border-radius:999px; height:10px; overflow:hidden; } .progress-track span { background:linear-gradient(90deg,var(--red),var(--gold)); display:block; height:100%; transition:width .2s ease; width:0; }
    .item-type { color:var(--red); font-size:.78rem; font-weight:900; letter-spacing:.11em; margin:0; text-transform:uppercase; }
    .prompt { font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.5rem,4vw,2.25rem); font-weight:700; line-height:1.4; margin:0; }
    .context { color:var(--muted); font-size:1.1rem; font-weight:700; margin:0; }
    .answer-input { background:#fff; border:1px solid var(--line); border-bottom:3px solid var(--blue); border-radius:3px; color:var(--ink); font-size:1.2rem; font-weight:700; min-height:3rem; min-width:12ch; padding:.35rem .5rem; width:min(100%,24ch); }
    .answer-input.is-correct { background:#ecfdf3; border-color:var(--green); } .answer-input.is-incorrect { background:#fff1f0; border-color:var(--red); }
    .answer-input:disabled { color:var(--ink); opacity:1; }
    .answer-form { display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
    .answer-form button,.repeat { background:var(--red); border:1px solid var(--red); color:#fff; font-weight:900; min-height:46px; padding:9px 16px; }
    .answer-form [data-show-answer] { background:#fff; color:var(--red); }
    .feedback { background:var(--soft); line-height:1.4; margin:0; min-height:48px; padding:12px 14px; } .feedback.correct { background:#ecfdf3; color:#17603f; } .feedback.incorrect { background:#fff1f0; color:#8e1116; }
    .done { text-align:center; } .done>p { color:var(--muted); font-weight:700; } .result-summary { display:grid; gap:8px; margin:18px auto; max-width:36rem; text-align:left; } .result-summary p { border-bottom:1px solid var(--line); margin:0; padding:8px 0; } .result-summary strong { color:var(--red); } .performance { color:var(--muted); font-weight:800; } .repeat { margin-top:10px; }
    @media(max-width:560px) { main { padding-top:18px; } .answer-form { display:grid; } .answer-form button { width:100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="course">Curso de Español · Lección 9 · Repaso</p>
      <h1>Vocabulario · Repaso 1</h1>
      <p class="sub">20 ejercicios para recuperar palabras y expresiones de las Lecciones 1–8.</p>
      <div class="font-controls" role="group" aria-label="Controles de tamaño del texto">
        <button type="button" data-font="small" aria-label="Reducir tamaño del texto" aria-pressed="false">A−</button><button type="button" data-font="normal" aria-label="Tamaño normal del texto" aria-pressed="true">A</button><button type="button" data-font="large" aria-label="Aumentar tamaño del texto" aria-pressed="false">A+</button>
      </div>
    </header>
    <section class="shell" aria-label="Ejercicio de repaso de vocabulario">
      <div class="question-wrap" data-question-wrap>
        <p class="progress" data-progress aria-live="polite"></p><div class="progress-track" role="progressbar" data-exercise-progress aria-label="Progreso del ejercicio" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><span></span></div>
        <p class="item-type" data-block></p><p class="prompt" data-prompt></p><p class="context" data-context hidden></p>
        <form class="answer-form" data-answer-form novalidate><label class="sr-only" for="repaso-answer">Escribe tu respuesta</label><input class="answer-input" id="repaso-answer" data-answer-input type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="answer-feedback"><button type="button" data-show-answer>VER RESPUESTA</button><button type="submit" data-submit>COMPROBAR</button></form>
        <p class="feedback" id="answer-feedback" data-feedback aria-live="polite">Escribe una respuesta y compruébala.</p>
      </div>
      <div class="done" data-done hidden><h2>¡Repaso terminado!</h2><p class="performance" data-performance></p><div class="result-summary" data-summary aria-live="polite"></div><button class="repeat" type="button" data-repeat>REPETIR EJERCICIO</button></div>
    </section>
  </main>
  <style>.sr-only { clip:rect(0,0,0,0); clip-path:inset(50%); height:1px; overflow:hidden; position:absolute; white-space:nowrap; width:1px; }</style>
  <script>
    (() => {
      "use strict";
      const BEST_SCORE_KEY = "workbook-leccion-09-ejercicio-09-01-best-precision";
      const items = [
        { block:"Personas y familia · 1 de 4", prompt:"La madre de mi madre es mi…", answers:["abuela"] },
        { block:"Personas y familia · 2 de 4", prompt:"El hijo de mis padres es mi…", answers:["hermano"] },
        { block:"Personas y familia · 3 de 4", prompt:"La hija de mi tío es mi…", answers:["prima"] },
        { block:"Personas y familia · 4 de 4", prompt:"Carlos y Laura están casados. Carlos es el… de Laura.", answers:["marido","esposo"] },
        { block:"Casa y trabajo · 1 de 4", prompt:"Dormimos en el…", answers:["dormitorio","habitación"] },
        { block:"Casa y trabajo · 2 de 4", prompt:"Hay una mesa y cuatro sillas en el…", answers:["comedor"] },
        { block:"Casa y trabajo · 3 de 4", prompt:"Trabajo en una… de tecnología.", answers:["empresa"] },
        { block:"Casa y trabajo · 4 de 4", prompt:"La persona que organiza citas y contesta llamadas puede ser la…", answers:["secretaria"] },
        { block:"Tiempo y acciones · 1 de 4", prompt:"El último mes del año es…", answers:["diciembre"] },
        { block:"Tiempo y acciones · 2 de 4", prompt:"7:30 · Son las siete y…", answers:["media"] },
        { block:"Tiempo y acciones · 3 de 4", prompt:"Después del trabajo… a casa.", answers:["vuelvo"] },
        { block:"Tiempo y acciones · 4 de 4", prompt:"En la cafetería… un café.", answers:["pido"] },
        { block:"Salud · La cita · 1 de 4", prompt:"Tengo dolor de…", context:"Me duele la parte de arriba de la cabeza.", answers:["cabeza"] },
        { block:"Salud · La cita · 2 de 4", prompt:"El médico recibe a los pacientes en el…", answers:["consultorio"] },
        { block:"Salud · La cita · 3 de 4", prompt:"Los pacientes esperan en la…", answers:["sala de espera"] },
        { block:"Salud · La cita · 4 de 4", prompt:"Después de esperar mucho,… aparece el doctor.", answers:["por fin"] },
        { block:"El tren · Descripción · 1 de 4", prompt:"El tren sale a las ocho y llego a las siete y cincuenta. Llego…", answers:["a tiempo"] },
        { block:"El tren · Descripción · 2 de 4", prompt:"Entro en el tren y…", answers:["tomo asiento"] },
        { block:"El tren · Descripción · 3 de 4", prompt:"Un coche que cuesta mucho dinero es…", answers:["caro"] },
        { block:"El tren · Descripción · 4 de 4", prompt:"Una persona que no está nerviosa puede estar…", answers:["tranquila"] }
      ];
      const progress = document.querySelector("[data-progress]"), progressBar = document.querySelector("[data-exercise-progress]"), block = document.querySelector("[data-block]"), prompt = document.querySelector("[data-prompt]"), context = document.querySelector("[data-context]"), input = document.querySelector("[data-answer-input]"), form = document.querySelector("[data-answer-form]"), reveal = document.querySelector("[data-show-answer]"), submit = document.querySelector("[data-submit]"), feedback = document.querySelector("[data-feedback]"), wrap = document.querySelector("[data-question-wrap]"), done = document.querySelector("[data-done]"), summary = document.querySelector("[data-summary]"), performance = document.querySelector("[data-performance]");
      let index=0, errors=0, attempts=0, completed=0, accepted=false;
      function normalize(value) { return value.trim().toLocaleLowerCase("es-ES").replace(/[.!?]+$/g, "").trim(); }
      function updateProgress() { progress.textContent="Ejercicio "+(index+1)+" / "+items.length+" · Completados: "+completed+" de "+items.length; progressBar.setAttribute("aria-valuenow",String(completed)); progressBar.firstElementChild.style.width=(completed/items.length*100)+"%"; }
      function render() { const item=items[index]; block.textContent=item.block; prompt.textContent=item.prompt; context.textContent=item.context||""; context.hidden=!item.context; input.value=""; input.disabled=false; input.classList.remove("is-correct","is-incorrect"); input.removeAttribute("aria-invalid"); accepted=false; reveal.disabled=false; submit.textContent="COMPROBAR"; feedback.textContent="Escribe una respuesta y compruébala."; feedback.className="feedback"; updateProgress(); }
      function showSummary() {
        const precision=attempts?Math.round(completed/attempts*100):0; let best=0;
        try { best=Number(localStorage.getItem(BEST_SCORE_KEY))||0; } catch(error) { best=0; }
        best=Math.max(best,precision); try { localStorage.setItem(BEST_SCORE_KEY,String(best)); } catch(error) { /* El ejercicio funciona sin almacenamiento local. */ }
        const rows=[["Puntuación",completed+" / "+items.length+" puntos"],["Ejercicios completados",completed+" / "+items.length],["Errores cometidos",String(errors)],["Intentos totales",String(attempts)],["Precisión",precision+"%"],["Mejor precisión",best+"%"]];
        summary.replaceChildren(...rows.map(([label,value])=>{ const row=document.createElement("p"), strong=document.createElement("strong"); strong.textContent=label+": "; row.append(strong,document.createTextNode(value)); return row; }));
        performance.textContent=precision>=90?"Desempeño excelente.":precision>=70?"Buen trabajo. Sigue practicando.":"Sigue practicando para mejorar tu precisión."; wrap.hidden=true; done.hidden=false; document.querySelector("[data-repeat]").focus();
      }
      reveal.addEventListener("click",()=>{ if(accepted)return; input.value=items[index].answers[0]; input.classList.remove("is-correct","is-incorrect"); input.removeAttribute("aria-invalid"); feedback.textContent="Respuesta mostrada. Pulsa COMPROBAR para validarla."; feedback.className="feedback"; submit.focus(); });
      input.addEventListener("input",()=>{ if(accepted||input.disabled)return; input.classList.remove("is-correct","is-incorrect"); input.removeAttribute("aria-invalid"); feedback.textContent="Respuesta actualizada. Pulsa COMPROBAR."; feedback.className="feedback"; });
      form.addEventListener("submit",event=>{ event.preventDefault(); if(accepted){ if(index===items.length-1)showSummary(); else {index++;render();input.focus();} return; }
        attempts++; const correct=items[index].answers.some(answer=>normalize(answer)===normalize(input.value));
        if(correct){ completed++; accepted=true; input.classList.remove("is-incorrect"); input.classList.add("is-correct"); input.disabled=true; input.removeAttribute("aria-invalid"); reveal.disabled=true; updateProgress(); feedback.textContent="Correcto. Ya puedes continuar."; feedback.className="feedback correct"; submit.textContent=index===items.length-1?"VER RESULTADOS":"SIGUIENTE"; }
        else { errors++; input.classList.remove("is-correct"); input.classList.add("is-incorrect"); input.setAttribute("aria-invalid","true"); feedback.textContent=input.value.trim()?"Respuesta incorrecta. Revisa la ortografía y vuelve a intentarlo.":"Escribe una respuesta. Errar cuenta para la estadística; puedes intentarlo de nuevo."; feedback.className="feedback incorrect"; input.focus(); }
      });
      document.querySelector("[data-repeat]").addEventListener("click",()=>{index=0;errors=0;attempts=0;completed=0;accepted=false;done.hidden=true;wrap.hidden=false;render();input.focus();});
      document.querySelectorAll("[data-font]").forEach(button=>button.addEventListener("click",()=>{const size=button.dataset.font;document.documentElement.style.setProperty("--font-scale",size==="small"?".9":size==="large"?"1.16":"1");document.querySelectorAll("[data-font]").forEach(control=>control.setAttribute("aria-pressed",String(control===button)));}));
      render();
    })();
  </script>
</body>
</html>
