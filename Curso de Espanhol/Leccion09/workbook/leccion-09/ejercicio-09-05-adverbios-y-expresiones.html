<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="20 actividades autónomas para repasar adverbios y expresiones de modo, cantidad, tiempo y lugar."><title>Adverbios y expresiones · Lección 9</title>
<style>
:root{--red:#aa151b;--gold:#f1bf00;--ink:#172033;--muted:#667085;--paper:#fffdf8;--soft:#f4efe4;--green:#2d7a5b;--blue:#2d5ea8;--line:rgba(23,32,51,.14);--scale:1}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:linear-gradient(135deg,#fff,var(--soft));color:var(--ink);font:calc(1.05rem * var(--scale))/1.5 Arial,Helvetica,sans-serif}main{width:min(94%,900px);margin:auto;padding:24px 0 48px}h1,h2{font-family:Georgia,'Times New Roman',serif;line-height:1.12}h1{font-size:calc(clamp(2rem,5vw,3rem)*var(--scale));margin:.4rem 0}.course{color:var(--red);font-size:.82rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.sub,.muted{color:var(--muted)}.shell{margin-top:22px;padding:clamp(20px,4vw,38px);border-left:5px solid var(--gold);background:#fff;box-shadow:0 8px 28px #141c261a}.progress-line{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.progress-line span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .2s}.progress-meta{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);font-weight:800;margin-bottom:10px}.block{margin:0 0 .4rem;color:var(--red);font-size:.9rem;font-weight:900}.prompt{font:700 calc(clamp(1.35rem,3.5vw,1.9rem)*var(--scale))/1.3 Georgia,'Times New Roman',serif;margin:.5rem 0 1.2rem}.answer{width:100%;max-width:32rem;min-height:3rem;padding:.6rem .75rem;border:1px solid var(--line);border-bottom:3px solid var(--blue);font:700 calc(1.1rem*var(--scale)) Arial,sans-serif}.choice-list{display:grid;gap:.65rem}.choice{display:flex;gap:.7rem;align-items:center;padding:.75rem;border:1px solid var(--line);background:#fff}.choice input{accent-color:var(--red);width:1.15rem;height:1.15rem}.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.6rem;margin-top:1rem}.actions button,.repeat{min-height:2.75rem;padding:.6rem 1rem;border:1px solid var(--red);background:var(--red);color:#fff;font-weight:900}.actions .secondary{background:#fff;color:var(--red)}button:focus-visible,input:focus-visible{outline:3px solid #2d5ea860;outline-offset:3px}.feedback{min-height:3rem;margin:1rem 0 0;padding:.75rem;border-left:4px solid var(--blue);background:#f2f6fb}.feedback.good{border-color:var(--green);background:#ecfdf3}.feedback.bad{border-color:var(--red);background:#fff1f0}.answer-key{margin-top:1rem;padding:.8rem;border-left:4px solid var(--gold);background:var(--soft)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}.stat{padding:.8rem;background:var(--soft);border-top:3px solid var(--red)}.stat b,.stat span{display:block}.font-controls{display:flex;gap:.5rem;justify-content:flex-end}.font-controls button{min-height:40px;padding:.4rem .7rem;border:1px solid var(--line);background:#fff;color:var(--ink)}@media(max-width:600px){main{width:min(94%,560px)}.shell{padding:18px}.progress-meta{font-size:.9rem}.stats{grid-template-columns:1fr}}
</style></head>
<body><main><header><p class="course">Lección 9 · Gran repaso de vacaciones</p><h1>Adverbios y expresiones</h1><p class="sub">20 ejercicios · modo, cantidad, tiempo, lugar y dirección</p><div class="font-controls" aria-label="Tamaño del texto"><button type="button" data-font="small" aria-pressed="false">A−</button><button type="button" data-font="normal" aria-pressed="true">A</button><button type="button" data-font="large" aria-pressed="false">A+</button></div></header>
<section class="shell" data-work><div class="progress-meta"><span data-count>Ejercicio 1 / 20</span><span data-block>Adverbios en -mente</span></div><div class="progress-line" role="progressbar" aria-label="Progreso del ejercicio" aria-valuemin="1" aria-valuemax="20" aria-valuenow="1"><span></span></div><p class="block" data-label></p><form><p class="prompt" data-prompt></p><div data-response></div><div class="actions"><button type="button" class="secondary" data-reveal aria-expanded="false">VER RESPUESTA</button><button type="submit" data-check>COMPROBAR</button></div></form><div class="answer-key" data-key hidden></div><p class="feedback" data-feedback aria-live="polite"></p></section>
<section class="shell" data-finish hidden><h2>Resumen del repaso</h2><p>La precisión se calcula como ejercicios completados divididos por intentos enviados.</p><div class="stats" data-stats></div><p data-message></p><button type="button" class="repeat" data-repeat>REPETIR EJERCICIO</button></section></main>
<script>
(()=>{'use strict';
const items=[
{block:'Adverbios en -mente',type:'text',prompt:'Forma el adverbio: rápido → ______.',answer:['rápidamente'],key:'rápidamente',feedback:'Usa la forma femenina rápida y añade -mente.'},
{block:'Adverbios en -mente',type:'text',prompt:'Forma el adverbio: fácil → ______.',answer:['fácilmente'],strictAccent:true,key:'fácilmente',feedback:'El adjetivo conserva su tilde.'},
{block:'Adverbios en -mente',type:'text',prompt:'Completa: Ana explica el ejercicio ______. (clara)',answer:['claramente'],key:'claramente',feedback:'Usa claramente para indicar cómo explica.'},
{block:'Adverbios en -mente',type:'text',prompt:'Completa: Mis compañeros trabajan ______. (lenta)',answer:['lentamente'],key:'lentamente',feedback:'El adverbio permanece igual con un sujeto plural.'},
{block:'Adverbios en -mente',type:'choice',prompt:'En «Lucía trabaja cuidadosamente», ¿qué palabra expresa cómo trabaja?',options:['Lucía','trabaja','cuidadosamente'],answer:2,key:'cuidadosamente',feedback:'El adverbio modifica la acción de trabajar.'},
{block:'Adverbios en -mente',type:'text',prompt:'Corrige la escritura: Carlos habla facilmente.',answer:['Carlos habla fácilmente.'],strictAccent:true,key:'Carlos habla fácilmente.',feedback:'Fácilmente conserva la tilde de fácil.'},
{block:'Modo',type:'text',prompt:'Completa: Ana habla español muy ______. (bien / bueno)',answer:['bien'],key:'bien',feedback:'Bien modifica el verbo habla.'},
{block:'Modo',type:'open',requiredGroups:[['claramente','fácilmente']],prompt:'Escribe una frase completa sobre una actividad que haces claramente o fácilmente.',key:'Modelo: Ana explica claramente el horario.',feedback:'Escribe una frase con sentido, verbo y un adverbio que describa cómo se realiza la acción.'},
{block:'Tiempo',type:'text',prompt:'Completa: Mi hermano se levanta ______, a las seis. (temprano / cerca)',answer:['temprano'],key:'temprano',feedback:'Temprano indica cuándo.'},
{block:'Tiempo',type:'choice',prompt:'¿Cuál expresión indica que una acción ocurre algunas veces?',options:['a veces','al fondo','con cuidado'],answer:0,key:'a veces',feedback:'A veces expresa frecuencia.'},
{block:'Lugar',type:'text',prompt:'Completa: La estación está ______ del centro; no está lejos. (cerca / tarde)',answer:['cerca'],key:'cerca',feedback:'Cerca expresa ubicación o distancia.'},
{block:'Dirección',type:'open',requiredGroups:[['derecha']],prompt:'Escribe una frase completa con «a la derecha» para indicar dónde está o hacia dónde va alguien.',key:'Modelo: La estación está a la derecha.',feedback:'Incluye una frase completa y usa a la derecha con un sentido claro.'},
{block:'Cantidad',type:'text',prompt:'Completa: Tengo poco tiempo, pero estudio ______. (mucho / muchas)',answer:['mucho'],key:'mucho',feedback:'Mucho modifica la actividad estudiar y permanece invariable.'},
{block:'Cantidad',type:'choice',prompt:'Elige la opción que completa la frase: «Trabajo ______ los viernes».',options:['menos','menos reuniones','menor'],answer:0,key:'menos',feedback:'Menos modifica aquí la actividad trabajar.'},
{block:'Dos adverbios',type:'choice',prompt:'Completa la coordinación habitual: «La secretaria explica ______ y concisamente».',options:['clara','claramente','claridad'],answer:0,key:'clara',feedback:'La primera forma conserva el femenino singular; -mente aparece en el último adverbio.'},
{block:'Con y sin',type:'text',prompt:'Completa: La secretaria revisa la lista ______ cuidado.',answer:['con'],key:'con cuidado',feedback:'Con cuidado expresa la manera de revisar.'},
{block:'Con y sin',type:'text',prompt:'Completa: Carlos encuentra la estación sin ______.',answer:['dificultad'],key:'sin dificultad',feedback:'Sin dificultad expresa que la acción no presenta dificultad.'},
{block:'Tiempo y lugar',type:'text',prompt:'Completa las dos expresiones y escribe la frase: «______ voy a la oficina; trabajo ______». (ahora / ahí)',answer:['Ahora voy a la oficina; trabajo ahí.'],key:'Ahora voy a la oficina; trabajo ahí.',feedback:'Ahora indica tiempo; ahí indica lugar.'},
{block:'Producción',type:'open',requiredGroups:[['estudio','estudiar'],['a veces','ahora'],['aquí','en casa']],minSentences:2,prompt:'Escribe dos frases conectadas: una sobre cómo estudias y otra sobre cuándo o dónde practicas.',key:'Modelo: Estudio cuidadosamente. A veces practico en casa.',feedback:'Escribe dos frases comprensibles con al menos una expresión de modo y otra de tiempo o lugar.'},
{block:'Producción',type:'open',requiredGroups:[['normalmente','temprano'],['con cuidado','lentamente','frecuentemente']],minSentences:2,prompt:'Escribe dos frases completas sobre una rutina. Usa al menos dos adverbios o expresiones de esta lección.',key:'Modelo: Normalmente salgo temprano. Camino con cuidado y llego a tiempo.',feedback:'Comprueba que tus frases tienen sentido y que los adverbios modifican la información adecuada.'}
];
const BEST='curso-espanol-leccion-9-adverbios-best-v1',work=document.querySelector('[data-work]'),finish=document.querySelector('[data-finish]'),form=work.querySelector('form'),response=work.querySelector('[data-response]'),prompt=work.querySelector('[data-prompt]'),label=work.querySelector('[data-label]'),count=work.querySelector('[data-count]'),block=work.querySelector('[data-block]'),key=work.querySelector('[data-key]'),feedback=work.querySelector('[data-feedback]'),check=work.querySelector('[data-check]'),reveal=work.querySelector('[data-reveal]');let index=0,attempts=0,errors=0,completed=0,accepted=false;
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/[.,;:¿?¡!]/g,'').trim().replace(/\s+/g,' ')}function normAccented(v){return String(v||'').normalize('NFC').toLocaleLowerCase('es').replace(/[.,;:¿?¡!]/g,'').trim().replace(/\s+/g,' ')}
function draw(){const item=items[index];count.textContent=`Ejercicio ${index+1} / ${items.length} · Completados: ${completed}`;block.textContent=item.block;label.textContent=`EJERCICIO ${String(index+1).padStart(2,'0')}`;prompt.textContent=item.prompt;response.replaceChildren();key.hidden=true;key.textContent='Respuesta: '+item.key;accepted=false;reveal.disabled=false;reveal.setAttribute('aria-expanded','false');check.textContent='COMPROBAR';feedback.textContent='Responde y pulsa COMPROBAR.';feedback.className='feedback';if(item.type==='choice'){const box=document.createElement('div');box.className='choice-list';item.options.forEach((option,i)=>{const lab=document.createElement('label');lab.className='choice';const input=document.createElement('input');input.type='radio';input.name='choice';input.value=String(i);lab.append(input,document.createTextNode(option));box.append(lab)});response.append(box)}else{const input=item.type==='open'?document.createElement('textarea'):document.createElement('input');input.className='answer';input.dataset.answer='';if(item.type==='open'){input.rows=4;input.placeholder='Escribe tu respuesta en español.'}else{input.type='text';input.autocomplete='off';input.setAttribute('aria-label','Respuesta');input.placeholder='Escribe aquí'}response.append(input)}const bar=work.querySelector('[role=progressbar]');bar.setAttribute('aria-valuenow',String(index+1));bar.firstElementChild.style.width=((index+1)/items.length*100)+'%';}
reveal.addEventListener('click',()=>{key.hidden=!key.hidden;reveal.setAttribute('aria-expanded',String(!key.hidden));if(!key.hidden)feedback.textContent='Lee la respuesta y después escribe o selecciona tu propia respuesta para comprobarla.'});
form.addEventListener('input',()=>{if(!accepted){feedback.textContent='Respuesta actualizada. Pulsa COMPROBAR cuando esté lista.';feedback.className='feedback'}});
form.addEventListener('change',()=>{feedback.textContent='Opción seleccionada. Pulsa COMPROBAR.'});
form.addEventListener('submit',e=>{e.preventDefault();if(accepted){if(index===items.length-1)end();else{index++;draw()}return}attempts++;const item=items[index];let ok=false,msg=item.feedback;if(item.type==='choice'){const selected=response.querySelector('input:checked');ok=Boolean(selected&&Number(selected.value)===item.answer);if(!selected)msg='Selecciona una opción antes de continuar.'}else{const value=response.querySelector('[data-answer]').value.trim();if(item.type==='open'){const v=norm(value);ok=value.length>=24&&/[.!?]$/.test(value)&&value.split(/\s+/).length>=5&&item.requiredGroups.every(group=>group.some(term=>v.includes(norm(term))))&&(!item.minSentences||value.split(/[.!?]+/).filter(x=>x.trim()).length>=item.minSentences)}else ok=item.answer.some(a=>item.strictAccent?normAccented(value)===normAccented(a):norm(value)===norm(a));if(!value)msg='Escribe una respuesta antes de continuar.';else if(item.type==='open'&&!ok)msg='Añade una frase completa de al menos cinco palabras e incluye una de las expresiones solicitadas.'}if(ok){completed++;accepted=true;response.querySelectorAll('input,textarea').forEach(el=>{el.disabled=true;el.style.borderColor='var(--green)'});check.textContent=index===items.length-1?'VER RESULTADOS':'SIGUIENTE';feedback.textContent='¡Respuesta aceptada! '+item.feedback;feedback.className='feedback good';return}errors++;feedback.textContent='Revisa tu respuesta. '+msg+' Puedes intentarlo de nuevo.';feedback.className='feedback bad'});
function end(){const accuracy=attempts?Math.round(completed/attempts*100):0;let best=accuracy;try{best=Math.max(Number(localStorage.getItem(BEST))||0,accuracy);localStorage.setItem(BEST,String(best))}catch{};const rows=[['Ejercicios completados',`${completed} / ${items.length}`],['Errores registrados',String(errors)],['Intentos totales',String(attempts)],['Precisión',`${accuracy}%`],['Mejor precisión en este dispositivo',`${best}%`]];finish.querySelector('[data-stats]').replaceChildren(...rows.map(([a,b])=>{const d=document.createElement('div');d.className='stat';const x=document.createElement('b');x.textContent=a;const y=document.createElement('span');y.textContent=b;d.append(x,y);return d}));finish.querySelector('[data-message]').textContent=accuracy===100?'Has respondido correctamente en todos tus intentos.':'Revisa los errores registrados y elige qué quieres practicar otra vez.';work.hidden=true;finish.hidden=false;finish.querySelector('[data-repeat]').focus()}
finish.querySelector('[data-repeat]').addEventListener('click',()=>{index=attempts=errors=completed=0;finish.hidden=true;work.hidden=false;draw()});document.querySelectorAll('[data-font]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.font;document.documentElement.style.setProperty('--scale',v==='small'?'.92':v==='large'?'1.16':'1');document.querySelectorAll('[data-font]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));draw();
})();
</script></body></html>
